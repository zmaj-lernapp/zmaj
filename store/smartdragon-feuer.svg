           offenen Maul. -->
      <polygon points="248,108 256,126 250,129 152,142 142,180 92,168 58,148 44,116 66,104 22,68 76,80 56,58 16,14 64,28 110,48 158,64 190,88" fill="#1E3FA8" stroke="#1E3FA8" stroke-width="1.6"/>
