[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "zmaj-bosnian"
version = "1.1.0"
description = "Open Bosnian course data: 1,728 words, 300 sentences, 12 stories, 16 grammar lessons in 8 languages"
readme = "README.md"
requires-python = ">=3.10"
license = "CC-BY-SA-4.0"
license-files = ["LICENSE"]
authors = [{ name = "Ajdin Hasic", email = "zmaj.lernapp@gmail.com" }]
keywords = ["bosnian", "dataset", "vocabulary", "language-learning", "low-resource-languages", "parallel-corpus"]
classifiers = [
  "Intended Audience :: Education",
  "Intended Audience :: Science/Research",
  "Natural Language :: Bosnian",
  "Programming Language :: Python :: 3",
  "Topic :: Education",
  "Topic :: Text Processing :: Linguistic",
]

[project.urls]
Homepage = "https://github.com/zmaj-lernapp/zmaj"
Dataset = "https://github.com/zmaj-lernapp/zmaj/tree/master/data"
Datasheet = "https://github.com/zmaj-lernapp/zmaj/blob/master/data/DATASHEET.md"
Issues = "https://github.com/zmaj-lernapp/zmaj/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
zmaj_bosnian = ["daten/*.json", "py.typed"]
