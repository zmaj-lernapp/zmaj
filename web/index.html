/* Auf das Ereignis warten, mit dem das SDK sagt „fertig" oder „ging nicht".
   Ohne Frist könnte die App hängenbleiben, wenn gar nichts mehr kommt. */
/* DIE HORCHER MUESSEN STEHEN, BEVOR DIE ANZEIGE STARTET.
   addListener liefert ein Versprechen. Bis zum 27.09.2026 wurde darauf nicht
   gewartet: admobWarten meldete an, und showInterstitial() lief im selben Zug
   los. War die Anmeldung dann noch nicht durch, kamen interstitialAdShowed und
   interstitialAdDismissed bei niemandem an. Die Anzeige stand auf dem Schirm,
   die App wartete zwei Minuten in der Frist, zaehlte nichts und meldete
   "nicht gelaufen".
   Am Geraet belegt: werbungHeute stand bei n=0 und lohn=4 - der belohnte Weg
   benutzt gar keine Horcher, sondern den Rueckgabewert von
   showRewardVideoAd(), und lief deshalb immer. Nur das Interstitial hing am
   Wettlauf. Mit vorher angemeldeten Horchern feuerten alle drei Ereignisse
   sauber: Loaded 520,3 s, Showed 520,4 s, Dismissed 525,5 s.

   Deshalb ist die Funktion jetzt async und gibt einen Umschlag zurueck:
   { warten: Versprechen }. Ein nacktes Versprechen ginge nicht - await wuerde
   es mit dem inneren verketten und erst beim Ereignis zurueckkommen, also
   genau nach dem Zeigen, was wir vermeiden wollen. */
async function admobWarten(paare, frist){
  let melden = null;
  const warten = new Promise(f => { melden = f; });
  const handles = [];
  let uhr = 0;
  const schluss = w => {
    clearTimeout(uhr);
    handles.forEach(h => { try{ h.remove(); }catch(e){} });
    melden(w);
  };
  for(const [name, wert] of paare){
    try{ handles.push(await AdMobP.addListener(name, ()=>schluss(wert))); }catch(e){}
  }
  uhr = setTimeout(()=>schluss(false), frist);
  return {warten};
}

/* Zeigt eine Anzeige und kommt zurück, wenn sie wieder zu ist.
   true heißt: sie lief wirklich. */
/* darfNoch() ist die Bedingung, unter der die Anzeige ueberhaupt
   angefordert wurde - derselbe Bildschirm, dieselbe Lektion, App noch
   vorne. Sie wird unten ein zweites Mal geprueft, unmittelbar bevor die
   Anzeige auf den Schirm geht. Dazwischen liegt prepareInterstitial(),
   und das ist ein Netzabruf von ein bis mehreren Sekunden: genug Zeit,
   um auf „Noch eine Lektion“ zu tippen und die erste Aufgabe vor sich
   zu haben. Punkt 1 aus WERBUNG_PRUEFUNG.md, behoben am 29.09.2026. */
async function admobZeigen(belohnt, darfNoch){
  if(!AdMobP || !admobDarf) return false;
  try{
    if(belohnt){
      /* Punkt 17: prepare hatte keine Frist - nur show war abgesichert.
         Seit der Riegel aus Punkt 9/13 drin ist, waere ein haengendes
         prepare besonders unangenehm: die Sicherheitsleine macht zwar
         nach 150 Sekunden wieder auf, aber so lange soll niemand vor
         einem toten Knopf sitzen. Fuenfzehn Sekunden reichen - kein
         Mensch wartet zwei Minuten auf ein Leben.
         Der Grund fuer den Fehlschlag wird mitgenommen statt verschluckt,
         sonst sucht man beim naechsten Mal wieder von vorn. */
      let ladeFehler = null;
      const geladen = await Promise.race([
        AdMobP.prepareRewardVideoAd({adId: ADMOB_ID.belohnt, isTesting: ADMOB_TEST,
                                     npa: !werbungPersonalisiert()})
          .then(()=> true, e => { ladeFehler = e; return false; }),
        new Promise(f => setTimeout(()=> f(null), 15000))]);
      if(!geladen){
        admobFehler = ladeFehler ? String(ladeFehler.message || ladeFehler.code || ladeFehler)
                                 : 'Ladefrist von 15 s abgelaufen';
        return false;
      }
      /* Punkt 11 und 16 aus WERBUNG_PRUEFUNG.md.
         Vorher entschied hier ein Rennen gegen zwei Minuten darueber, ob
         es ein Leben gibt. Zwei Wege liefen schief: wer waehrend des
         Videos angerufen wurde, sah es zu Ende und bekam trotzdem nichts
         - die Belohnung kam nach dem Rennen und fiel unter den Tisch.
         Und wer abbrach, wartete zwei volle Minuten auf nichts, weil das
         Plugin den Aufruf beim Schliessen ohne Belohnung weder aufloest
         noch ablehnt.
         Jetzt halten zwei Zuhoerer die beiden Dinge getrennt fest:
         onRewardedVideoAdReward sagt, DASS die Belohnung faellig wurde -
         das Plugin schreibt eigens dazu, dass Dismissed darueber nichts
         aussagt -, und Dismissed beendet das Warten, sobald der Nutzer
         die Anzeige wegdrueckt. Dieselbe Bauweise wie beim Interstitial
         ein Stueck weiter unten.
         Die Frist bleibt als letzter Ausweg stehen: ohne sie haengt der
         Aufruf bei einem Abbruch fuer immer. */
      let verdient = false;
      let lohnHorcher = null;
      try{ lohnHorcher = await AdMobP.addListener('onRewardedVideoAdReward',
                                                  ()=>{ verdient = true; }); }catch(e){}
      const fertigLohn = await admobWarten([['onRewardedVideoAdDismissed', true],
                                            ['onRewardedVideoAdFailedToShow', false]], 120000);
      /* Nicht awaiten: das Versprechen loest nur auf, wenn es eine
         Belohnung gibt. Kommt sie, wird sie hier trotzdem noch
         mitgenommen - doppelt haelt besser als der Zuhoerer allein. */
      AdMobP.showRewardVideoAd().then(lohn => { if(lohn) verdient = true; }, ()=>{});
      await fertigLohn.warten;
      if(lohnHorcher) try{ lohnHorcher.remove(); }catch(e){}
      return verdient;
    }
    await AdMobP.prepareInterstitial({adId: ADMOB_ID.interstitial, isTesting: ADMOB_TEST,
                                     npa: !werbungPersonalisiert()});
    /* Hier der zweite Blick. Passt es nicht mehr, wird die geladene
       Anzeige einfach nicht gezeigt - sie geht dadurch nicht verloren,
       der naechste Aufruf laedt sie erneut. Lieber eine Einblendung
       weniger als eine ueber einer laufenden Aufgabe. */
    if(darfNoch && !darfNoch()) return false;
    /* GEZAEHLT wird, sobald die Anzeige wirklich auf dem Schirm stand, und
       GEWARTET wird, bis der Nutzer sie geschlossen hat. Das sind zwei
       verschiedene Dinge, und bis zum 27.09.2026 hingen beide am
       Schliess-Ereignis: kam es nicht, lief admobZeigen nach zwei Minuten in
       die Frist, gab false zurueck, und die Anzeige galt als nicht gelaufen -
       obwohl sie da war. Gemessen: werbungHeute.n stand nach elf Lektionen
       auf 0, waehrend prepareInterstitial und showInterstitial einzeln
       aufgerufen beide sauber durchliefen.
       Ajdin am 27.09.2026: "also es kommt nicht immer werbung nach der
       lektion und nach dem test auch nicht". */
    let gezeigt = false;
    /* Auch hier auf die Anmeldung warten - aus demselben Grund wie in
       admobWarten. */
    let gesehen = null;
    try{ gesehen = await AdMobP.addListener('interstitialAdShowed', ()=>{ gezeigt = true; }); }
    catch(e){}
    const zu = await admobWarten([['interstitialAdDismissed', true],
                                  ['interstitialAdFailedToShow', false]], 120000);
    await AdMobP.showInterstitial();
    await zu.warten;
    if(gesehen) try{ gesehen.remove(); }catch(e){}
    return gezeigt;
  }catch(e){
    /* Auch hier den Grund stehen lassen statt ihn zu verschlucken - sonst
       sucht man beim naechsten Mal wieder von vorne. */
    admobFehler = (e && (e.message || e.code)) ? String(e.message || e.code) : 'unbekannt';
    return false;
  }
}

function fuelle(s, vars){
  return vars ? s.replace(/\{(\w+)\}/g, (m,k)=> vars[k]!==undefined ? vars[k] : m) : s;
}

  let s = T[key] !== undefined ? T[key] : FALLBACK[key];

/* Franzoesisch stellt das Substantiv nach null in die Einzahl ("0 nouveau
   mot"); Deutsch, Englisch, Schwedisch, Norwegisch, Daenisch und
   Niederlaendisch nehmen die Mehrzahl, Tuerkisch hat nur eine Form. Ohne diese
   Ausnahme stand auf dem Ergebnisschirm einer Lektion ohne neue Woerter
   "+0 nouveaux mots" und in den Einstellungen am ersten Tag "Serie : 0 jours".
   Eine Liste statt eines Vergleichs auf 'fr', damit eine spaetere Sprache mit
   derselben Regel nur hier eingetragen werden muss. Gefunden am 26.09.2026. */
const EINZAHL_BEI_NULL = ['fr'];
function tp(key, n, vars){
  const s = T[key] !== undefined ? T[key] : key;
  const teile = s.split('|');
  const einzahl = n === 1 || (n === 0 && EINZAHL_BEI_NULL.includes(SPRACHE));
  const gewaehlt = (einzahl || teile.length < 2) ? teile[0] : teile[1];
  return fuelle(gewaehlt, Object.assign({n:n}, vars||{}));
}

/* Auf- und Zuklappen. Ein Tipp auf einen anderen Kopf klappt den auf und
   den bisherigen zu. Ein Tipp auf den Kopf der offenen Sektion klappt sie
   zu - dann ist keine offen und der Lernpfad steht als reine Uebersicht
   da. Ajdin am 26.09.2026: "die sektion soll sich auch zuklappen koennen
   wenn man nochmal ganz oben drauf drueckt".
   Es wird nicht neu gezeichnet, nur umgeschaltet - das ist billiger und
   laesst die Stelle stehen, an der man gerade liest. */
function sektionAufklappen(id){
  const box = $('sections'); if(!box) return;
  /* Wo sitzt der angetippte Kopf gerade auf dem Bildschirm? Klappt gleichzeitig
     eine Sektion WEITER OBEN zu, fallen dort mehrere hundert Pixel weg, alles
     darunter rutscht nach oben, und der angetippte Kopf wandert aus dem Blick.
     Es sieht aus, als springe die Seite.
     Ajdin am 27.09.2026: "wenn man eine sektion oeffnet dann springt das so
     komisch am besten wenn man auf die sektion klickt das der bildschirm auch
     da bleibt".
     Deshalb: Stelle vorher merken, nach dem Umschalten um genau den
     Unterschied nachscrollen. Der Kopf steht danach wieder da, wo der Finger
     ihn getroffen hat. */
  const kasten = [].slice.call(box.children).find(el => el.dataset.sid === id);
  const vorher = kasten ? kasten.getBoundingClientRect().top : null;

  offeneSektion = (offeneSektion === id) ? '' : id;
  [].slice.call(box.children).forEach(el => {
    const auf = el.dataset.sid === offeneSektion;
    el.classList.toggle('zu', !auf);
    const kopf = el.querySelector('.skopf');
    if(kopf) kopf.setAttribute('aria-expanded', auf ? 'true' : 'false');
  });

  if(kasten && vorher !== null){
    /* getBoundingClientRect erzwingt hier einen neuen Umbruch - genau das ist
       gewollt, sonst stuende noch die alte Stelle da.
       Ohne behavior:'instant' wuerde ein spaeter eingefuehrtes
       scroll-behavior:smooth daraus eine sichtbare Fahrt machen; das Ziel ist
       aber, dass sich gar nichts bewegt. */
    const versatz = kasten.getBoundingClientRect().top - vorher;
    if(Math.abs(versatz) > 1) scrollBy({top: versatz, behavior: 'instant'});
    /* Klappt oberhalb eine lange Sektion zu, wird die Seite kuerzer als die
       Stelle, an der man gerade stand. Der Browser kann dann nicht so weit
       scrollen und klemmt den Wert ab - der Kopf sitzt hinterher trotzdem
       woanders. In dem Fall ist "bleiben" gar nicht moeglich, weil nicht
       genug Seite da ist.
       Dann wird der Kopf bewusst an die Bezugslinie gesetzt, an der auch die
       Farbe haengt. Das ist eine Bewegung, aber eine erklaerbare: die
       angetippte Sektion steht oben und traegt ihre Farbe. */
    const rest = kasten.getBoundingClientRect().top - vorher;
    if(Math.abs(rest) > 2){
      const linie = innerHeight > 0 ? Math.min(220, innerHeight * 0.32) : 160;
      scrollBy({top: kasten.getBoundingClientRect().top - linie, behavior: 'instant'});
    }
  }
  /* Der Umweg ueber sektionsFarbe ist Absicht: ist keine Sektion offen,
     faellt die Farbe auf die zurueck, in der gerade gelernt wird. Ohne
     Farbe dazustehen waere schlechter als eine. */
  sektionsFarbe();
}

function abstand(a, b){
  if(a === b) return 0;
  const m = a.length, n = b.length;
  if(!m) return n;
  if(!n) return m;
  let vorige = Array.from({length:n+1}, (_,j)=>j);

    }

  }

}

  const schluessel = ids.join(',') + '|' + farbe;
  if(!vorgabe && zmajFertig && zmajFertigFuer === schluessel) return zmajFertig;
  if(!zmajBasis) zmajBasis = await (await fetch('maskottchen/zmaj.json', {cache:'no-cache'})).json();
  for(const id of ids){
    if(zmajTeile.has(id)) continue;
    try{ zmajTeile.set(id, await (await fetch('maskottchen/' + zierratDatei(id), {cache:'no-cache'})).json()); }
    catch(e){ zmajTeile.set(id, null); }   // fehlt sie, bleibt der Drache eben ohne
  }
  /* Ein Schnipsel ist eine Liste von Ebenen - meist eine, beim Fanschal
     zwei, weil der Schriftzug eine eigene Textebene braucht. Aeltere
     Schnipsel waren ein einzelnes Objekt; beides wird vertragen. */
  const ebenen = zmajBasis.layers.slice();
  ids.forEach(id => { const teil = zmajTeile.get(id);
    if(Array.isArray(teil)) ebenen.push(...teil); else if(teil) ebenen.push(teil); });
  ebenen.sort((a, b) => a.ind - b.ind);
  /* Beim Faerben MUSS auf einer Kopie gearbeitet werden: zmajBasis und die
     Schnipsel bleiben im Speicher stehen, und ein Farbwechsel wuerde sonst
     auf dem Ergebnis des vorigen aufsetzen. */
  const fertig = farbe
    ? faerbe(JSON.parse(JSON.stringify(Object.assign({}, zmajBasis, {layers: ebenen}))), farbeVon(farbe))
    : Object.assign({}, zmajBasis, {layers: ebenen});
  if(vorgabe) return fertig;
  zmajFertig = fertig; zmajFertigFuer = schluessel;
  return zmajFertig;
}

function segOf(a, name){
  const m = (a.markers||[]).find(x => (x.payload && x.payload.name===name) || x.payload===name);

function playMood(el, mood){
  const name = MOOD_SEG[mood] || 'idle';

     nachgeladen. Steht der Zierrat nicht mehr auf dem Stand, baut mountZmaj
     die Anzeige neu auf - das ruft drachenNeu() nach jedem Anziehen. */
  const a = el._anim; if(!a || !a.isLoaded){ el.dataset.mood = mood; return; }
  el.dataset.mood = mood;
  if(el._back){ a.removeEventListener('complete', el._back); el._back = null; }
  if(el._timer){ clearTimeout(el._timer); el._timer = null; }
  // 'cheer' gehoert dazu: einmal springen reicht. Lief es in Schleife,
  // huepfte der Drache die ganze Zeit vor sich hin.

  const s = segOf(a, name) || (name.slice(0,3)==='no_' ? segOf(a, 'no') : null);
  const toIdle = ()=>{ if(el._back){ a.removeEventListener('complete', el._back); el._back=null; } if(el._timer){ clearTimeout(el._timer); el._timer=null; } if(el.dataset.mood===mood) playMood(el, 'idle'); };
  const frames = s ? (s[1]-s[0]) : (a.totalFrames || 30);

  if(once){
    el._back = toIdle; a.addEventListener('complete', el._back);

  }

/* Lautstärke: Die Vokabeln kommen als fertige Aufnahme und damit in voller
   Höhe. Dagegen waren die berechneten Töne mit 0,18 deutlich zu leise –
   man hörte das Wort, aber kaum, ob es richtig war. Jetzt 0,38. Ein
   Sägezahn trägt bei gleicher Höhe mehr Energie als ein Sinus, deshalb
   bleibt der Fehlton darunter. */
function tone(freq, start, dur, type='sine', gain=0.38){
  const o=actx.createOscillator(), g=actx.createGain();
  o.type=type; o.frequency.value=freq; g.gain.value=0;
  o.connect(g); g.connect(actx.destination);
  const ab=actx.currentTime+start;
  g.gain.setValueAtTime(0,ab); g.gain.linearRampToValueAtTime(gain,ab+0.01); g.gain.exponentialRampToValueAtTime(0.0001,ab+dur);
  o.start(ab); o.stop(ab+dur+0.05);
}

  else if(kind==='kauf') buzz([12,40,18]);
  else if(kind==='quest') buzz([20,50,20,50,70]);
  else if(kind==='wegmarke') buzz([40,60,40,60,40,60,180]);

    if(!actx) actx = new (window.AudioContext||window.webkitAudioContext)();

/* Der Werbeschalter ist UNSERER und wirkt sofort, in beide Richtungen.
   Er erzwingt npa=1, also unpersonalisierte Anzeigen - auch dann, wenn bei
   Google zugestimmt wurde. Strenger als die Einwilligung darf man sein,
   lockerer nicht.

   Warum er Googles Fenster NICHT spiegelt, obwohl das der Wunsch war: aus
   Googles Antwort laesst sich gar nicht ablesen, ob der Nutzer zugestimmt
   hat. Das Plugin liefert `status`, `canRequestAds` und
   `privacyOptionsRequirementStatus` - und canRequestAds ist in beiden
   Faellen wahr, denn ohne Zustimmung kommen eben unpersonalisierte
   Anzeigen. Die feine Antwort steckt in Googles TCF-Speicher, an den die
   App nicht herankommt. Ein Schalter, der Googles Fenster nachfaehrt,
   braucht also eine eigene native Erweiterung.

   Googles Fenster bleibt trotzdem erreichbar: als kleiner Verweis in der
   Zeile darunter, sobald Google einen Weg dorthin verlangt. */
/* ---- Der Werbeschalter ----
   Wo AdMob laeuft, gehoert die Einwilligung Google. Ein Tipp auf den
   Schalter oeffnet deshalb Googles eigenes Fenster - und DANACH stellt sich
   der Schalter auf das ein, was dort herauskam. Er springt also nicht von
   selbst um, sondern folgt der Antwort. Genau das wollte Ajdin.

   Dass das geht, liegt an ZmajEinwilligung, einem kleinen eigenen Plugin im
   Android-Teil: es liest die TCF-Angaben, die Googles UMP-SDK ablegt. Das
   AdMob-Plugin allein gibt sie nicht her - es meldet nur canRequestAds, und
   das ist auch bei Ablehnung wahr, weil dann eben unpersonalisierte
   Anzeigen kommen.

   Ohne AdMob - am PC, im Browser - bleibt es ein gewoehnlicher Schalter,
   der sofort umlegt. */
const einwPlugin = () => (window.Capacitor && window.Capacitor.Plugins
                          && window.Capacitor.Plugins.ZmajEinwilligung) || null;
/* Liefert true/false, wenn Google etwas abgelegt hat, sonst null. Bei null
   wird der eigene Schalter NICHT angefasst - lieber stehen lassen als raten. */
async function googlesAntwort(){
  const P = einwPlugin();
  if(!P) return null;
  try{
    const s = await P.stand();
    return (s && s.bekannt) ? !!s.personalisiert : null;
  }catch(e){ return null; }
}

   was bei Google steht - und nicht erst, nachdem man ihn angefasst hat. */
/* Abgeglichen wird nur, wo Googles Fenster den Schalter fuehrt. Ajdin am
   26.09.2026: verlangt Google keinen eigenen Aenderungsknopf (ausserhalb

/* Ein Stand sieht ueberall gleich aus - egal ob er aus der Profildatei des
   Servers kommt, aus dem Gerätespeicher oder aus einer Sicherungsdatei.
   Deshalb nur eine Stelle, die ihn uebernimmt. */
function standUebernehmen(d){
  d = d || {};
  known = new Set(d.gewusst||[]); passed = new Set(d.bestanden||[]); read = new Set(d.gelesen||[]);
  // Nur echte Datumsangaben - siehe istDatum.
  days = new Set((d.tage||[]).filter(istDatum));
  frost = new Set((d.frost||[]).filter(istDatum));
  /* Unterschied zwischen "Feld fehlt" und "Feld ist leer":
       fehlt  = der Stand kommt von VOR den Wegmarken, etwa aus einer alten
                Sicherungsdatei. Dann wird weiter unten alles schon
                Erreichte stillschweigend abgehakt - eine alte Datei
                einzulesen ist kein Grund zu feiern.
       leer   = neuer Stand, es wurde wirklich noch nichts gefeiert.
     Die Dateien in testdaten/ haben 30 Lerntage und kein Feld; ohne diese
     Unterscheidung feierte die App nach jedem Einlesen von vorn. */
  const gefeiertFehlt = (d.gefeiert === undefined);
  gefeiert = new Set(d.gefeiert||[]);
  wann = (d.wann && typeof d.wann==='object' && !Array.isArray(d.wann)) ? d.wann : {};
  rekord = Number(d.rekord) || 0;
  /* Steht noch kein Rekord da, wird er aus den vorhandenen Lerntagen
     nachgerechnet. Sonst finge Kübra bei null an, obwohl sie die Tage
     längst hinter sich hat. Passiert genau einmal je Lernstand. */
  const gerechnet = laengsteSerie();
  if(gerechnet > rekord) rekord = gerechnet;
  /* Siehe oben: alter Stand ohne das Feld. Was schon erreicht ist, gilt als
     gefeiert - sonst kommt beim nächsten Lerntag eine Karte für etwas, das
     Wochen zurückliegt. */
  if(gefeiertFehlt && days.size){
    MEILENSTEINE.forEach(m => { if(days.size >= m.ziel) gefeiert.add(m.id); });
  }
  tagwerk = (d.tagwerk && typeof d.tagwerk==='object') ? d.tagwerk : {};
  muenzenGes = Number(d.muenzen_ges) || 0; muenzenAus = Number(d.muenzen_aus) || 0;
  besitz = new Set(d.besitz||[]);
  lives = (d.leben && typeof d.leben.anzahl==='number') ? {anzahl:d.leben.anzahl, zeit:d.leben.zeit||0} : {anzahl:LEBEN_MAX, zeit:0};
  schutz = (d.schutz && typeof d.schutz.anzahl==='number') ? {anzahl:d.schutz.anzahl, zeit:d.schutz.zeit||0} : {anzahl:1, zeit:0};
  /* premium steht hier bewusst NICHT mehr. Der Lernstand kommt auch aus
     einer Sicherungsdatei, die jeder von Hand aufmachen kann - siehe
     vollversionLaden() weiter unten. */
  /* Das getragene Stueck lebt sonst nur im Geraetespeicher. Wer auf ein
     neues Handy umzieht, haette den Zierrat zwar gekauft, der Drache truege
     aber nichts. Nur uebernehmen, wenn es wirklich dabei ist: vom Server
     kommt der Schluessel nie, und dann soll er das Getragene nicht loeschen. */
  if(typeof d.getragen === 'string'){
    getragen = d.getragen;
    try{ localStorage.setItem('zmaj_getragen', getragen); }catch(e){}
  }
  /* Siehe standAlsObjekt: nur nach oben. Eine aeltere Sicherung darf ein
     schon gegebenes Geschenk nicht wieder aufmachen. */
  const jahrAusStand = Number(d.geschenk_jahr) || 0;
  if(jahrAusStand > (geschenk.jahr || 0)){
    geschenk = {jahr: jahrAusStand, bis: geschenk.bis || 0};
    try{ localStorage.setItem(GESCHENK_SCHLUESSEL, JSON.stringify(geschenk)); }catch(e){}
  }
}

    return r.ok;
  }catch(e){ return false; }
}
/* ---- Wegmarken ----
   Was gefeiert wird. Ajdin hat am 18.09.2026 aus vier Möglichkeiten nur die
   Lerntage gewählt - Wörter, Level und Geschichten bleiben bewusst draußen.
   Weitere Schwellen kosten hier nur eine Zeile und einen Text.

   Die Zahl kommt aus days.size und ist rückwirkend richtig: die App schreibt
   die Lerntage seit dem ersten Tag mit. Wer die App heute aktualisiert,
   verliert also nichts. */
const MEILENSTEINE = [
  {id:'tage7',    ziel:7,    txt:'wegmarke.t7'},
  {id:'tage30',   ziel:30,   txt:'wegmarke.t30'},
  {id:'tage100',  ziel:100,  txt:'wegmarke.t100'},
  {id:'tage365',  ziel:365,  txt:'wegmarke.t365'},
  {id:'tage1000', ziel:1000, txt:'wegmarke.t1000'},
];
/* Läuft gerade eine Wegmarke? Dann keine Werbung darüber - siehe lessonEnd.
   Eine Anzeige über dem 100. Lerntag wäre die schlechteste Minute, die sich
   die App aussuchen könnte. */
let wegmarkeLaeuft = false;

/* Wird aus markToday gerufen, also genau einmal je neuem Lerntag - NIE aus
   einer Zeichenfunktion. Sonst käme die Karte bei jedem Neuzeichnen wieder,
   und das ist derselbe Fehler, vor dem oben schon bei den Münzen gewarnt
   wird. */
function pruefeMeilensteine(){
  const n = days.size;
  const faellig = MEILENSTEINE.filter(m => n >= m.ziel && !gefeiert.has(m.id));
  if(!faellig.length) return;
  /* Mehrere auf einmal kann es geben: wer die App erst jetzt aktualisiert,
     hat 7, 30 und 100 längst hinter sich. Abgehakt werden dann alle, gefeiert
     nur die größte - fünf Karten hintereinander wären kein Fest mehr,
     sondern eine Warteschlange. */
  wegmarkeLaeuft = true;
  /* SOFORT abhaken und speichern, nicht erst beim Zeigen der Karte.
     Vorher stand das unten in zeigeWegmarke - der Gedanke war, dass eine
     Wegmarke nicht verlorengeht, wenn die App in den 1,4 Sekunden bis zur
     Karte zugemacht wird. Die Kehrseite war schlimmer: dann kam sie am
     nächsten Tag wieder. Ajdin hat das an zwei Tagen gesehen.
     Abgewogen: eine verpasste Wegmarke kostet einen Glückwunsch, und die
     nächste kommt trotzdem. Eine wiederholte lässt die App kaputt aussehen. */
  faellig.forEach(m => gefeiert.add(m.id));
  saveProgress();
  /* Erst der Ergebnisschirm, dann die Karte. Die Fanfare läuft 0,7 s, der
     Ton für die Tagesaufgabe kommt bei 0,85 s - die Wegmarke ist die größte
     Sache und kommt zuletzt. */
  setTimeout(()=> zeigeWegmarke(faellig[faellig.length - 1]), 1400);
}

function zeigeWegmarke(m){

  kasten.querySelector('#wegOk').textContent = t('task.weiter');
  // Nur bei eingeschalteter Bewegung - siehe .schnipsel im Stilblatt.

     Taste durch die Karte hindurch: am 7. Lerntag drueckte der erste Druck
     darunter "Lektion abbrechen", der noch nicht gelesene Ergebnisschirm war
     weg, und die Glueckwunschkarte schwebte danach ueber dem Lernpfad.
     Gefunden am 26.09.2026. Beim Schliessen wieder abmelden, sonst blockiert
     die Karte jede spaetere Nachfrage - frage() steigt bei gesetztem
     frageSchliessen sofort aus. */
  const zu = ()=>{ kasten.remove(); wegmarkeLaeuft = false;
                   if(frageSchliessen === zu) frageSchliessen = null; };
  frageSchliessen = zu;
  kasten.querySelector('#wegOk').addEventListener('click', zu);

}

/* Die längste Serie, die jemals lief - über ALLE Tage, nicht von heute
   rückwärts wie streak(). Dieselbe Regel wie dort: ein Frosttag überbrückt
   die Lücke, zählt aber selbst nicht mit.

   Gerechnet wird über den Mittag ('T12:00:00'). Um Mitternacht zu rechnen
   geht bei der Zeitumstellung schief: die Nacht hat dann 23 oder 25 Stunden,
   und ein Tagesabstand in Millisekunden stimmt nicht mehr. */
function laengsteSerie(){
  const alle = new Set([...days, ...frost]);
  if(!alle.size) return 0;
  let best = 0, lauf = 0, vor = null;
  for(const k of [...alle].sort()){
    if(vor !== null){
      const d = new Date(vor + 'T12:00:00'); d.setDate(d.getDate() + 1);
      if(dayKey(d) !== k) lauf = 0;          // Lücke: von vorn
    }
    if(days.has(k)) lauf++;
    if(lauf > best) best = lauf;
    vor = k;
  }
  return best;
}
function markToday(){
  const t=today();
  if(days.has(t)) return false;
  days.add(t);
  const n = streak(); if(n > rekord) rekord = n;
  pruefeMeilensteine();
  return true;
}

/* ---- Tagesaufgaben ----
   Drei Stück am Tag, ausgelost aus Profilname und Datum. WELCHE drei es sind,
   wird nirgends gespeichert, sondern jedes Mal neu ausgerechnet – deshalb
   kommen beim Neuladen, im zweiten Tab und auf dem Handy zwingend dieselben
   drei heraus. Man kann sich also keine leichten erwürfeln.

   Wichtige Regel: In die Auslosung darf nur eingehen, was sich im Lauf des
   Tages NICHT mehr ändert. Also nicht `passed`, nicht `read`, nicht `catIdx` –
   sonst stünden nach der ersten Lektion drei andere Aufgaben da und der
   Fortschritt in den alten wäre weg. Erlaubt: profil, today(), Lerntage vor
   heute, canListen, known.size.

   Gespeichert wird nur `tagwerk`: die Zähler je Tag. */
const alleWoerter = () => CATEGORIES.reduce((n,c)=>n+c.words.length, 0);

/* known.size darf laut der Regel darueber in die Auslosung - die Bedingung
   "es gibt noch unbekannte Woerter" kippt aber doch mitten am Tag, naemlich
   in der Lektion, in der das letzte unbekannte Wort richtig beantwortet wird.
   Ab diesem Augenblick fiel 'neu' aus questTopf(), zieh() mischte aus acht
   statt neun Arten und lieferte fuer denselben Tag drei ANDERE Aufgaben: der
   Fortschritt der angefangenen war weg, und die neu gezogenen standen wegen
   tagwerk sofort mit Haken da, ohne dass Muenzen geflossen waeren - zaehle()
   zahlt nur im Augenblick des Ueberschreitens. Deshalb bleibt die Aufgabe an
   dem Tag, an dem das letzte Wort fiel, noch im Topf. Der Tag liegt in wann,
   damit es nach einem Neustart und im zweiten Tab genauso ausgeht - eine
   Sitzungsvariable waere hier zu wenig. Gefunden am 26.09.2026. */
function neuNochMoeglich(){
  const alle = alleWoerter();
  if(!alle || known.size < alle) return true;   // !alle: Inhalt noch nicht geladen
  if(!wann.alleWoerter){ wann.alleWoerter = today(); saveProgress(); }
  return wann.alleWoerter === today();
}

/* Die Ziele waren auf GENAU EINE Lektion kalibriert, und zwar systematisch:
   eine Lektion bringt 10 Wortaufgaben, 2 Lückentexte, bis zu 2
   Grammatikaufgaben und - bei fünf Aufgabenarten im Wechsel - etwa 2
   Hörübungen. Stufe 1 verlangte 8 richtige, 2 Hörübungen, 2 Lückentexte,
   3 neue Wörter: alles mit einer Lektion erledigt.
   Ajdin am 27.09.2026: "ich hab doch gesagt das die ziele nicht bei lektion
   geschafft sein sollen das ist zu viel". Die Mengenziele liegen jetzt bei
   etwa zwei Lektionen.
   NICHT angehoben sind 'gesch' (eine Geschichte lesen ist eine eigene
   Handlung, kein Nebenprodukt der Lektion) und 'per' (fehlerfrei ist ein
   Güte-, kein Mengenziel). */
const QUESTS = [
  {id:'auf',   art:'menge',   dick:1, ohneLeben:true, ziele:[20,30,40], txt:'quest.aufgaben'},
  {id:'ric',   art:'menge',   dick:1, ohneLeben:true, ziele:[18,26,34], txt:'quest.richtig'},
  {id:'gesch', art:'lesen',   dick:2, ohneLeben:true, ziele:[1,1,1],    txt:'quest.geschichte'},
  {id:'lue',   art:'typ',     dick:1, ziele:[4,6,8],  txt:'quest.luecken'},
  {id:'hoer',  art:'typ',     dick:1, ziele:[4,6,8],  txt:'quest.hoeren',     geht:()=>canListen},
  {id:'neu',   art:'woerter', dick:2, ziele:[10,14,18], txt:'quest.woerter',  geht:()=>known.size < alleWoerter()},
  {id:'lek',   art:'lektion', dick:2, ziele:[2,3,4],  txt:'quest.lektionen'},
  {id:'per',   art:'lektion', dick:3, ziele:[1,1,1],  txt:'quest.fehlerfrei', abStufe:2},
  // Zeit in Sekunden gespeichert, in Minuten angezeigt – siehe uhrTakt()
  {id:'zeit',  art:'zeit',    dick:2, ohneLeben:true, ziele:[600,900,1200], txt:'quest.minuten', min:true}
];

/* Die Stufe zählt nur Tage VOR heute, damit sie sich tagsüber nicht ändert
   und die drei Aufgaben nicht mitten am Tag wechseln. */
function questStufe(){
  const t=today(); let n=0;
  days.forEach(d => { if(d < t) n++; });
  return n >= 21 ? 3 : (n >= 5 ? 2 : 1);
}
/* Zahl aus Text (FNV-1a) und Würfel mit festem Startwert (mulberry32):
   gleicher Startwert, gleiche Reihe. Ohne Fremdcode, die App lädt nichts nach. */
function saatAus(text){
  let h = 2166136261;
  for(let i=0;i<text.length;i++){ h ^= text.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
function wuerfel(saat){
  let a = saat >>> 0;
  return function(){
    a = (a + 0x6D2B79F5) >>> 0;
    let x = Math.imul(a ^ (a >>> 15), 1 | a);
    x = (x + Math.imul(x ^ (x >>> 7), 61 | x)) ^ x;
    return ((x ^ (x >>> 14)) >>> 0) / 4294967296;
  };
}
function mischeFest(liste, rnd){
  const a = liste.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
const tagMinus = (tag, d) => { const x=new Date(tag+'T12:00:00'); x.setDate(x.getDate()-d); return dayKey(x); };

function questTopf(stufe){
  return QUESTS.filter(q => (q.abStufe||1) <= stufe && (!q.geht || q.geht()));
}
/* Zieht drei Aufgaben für einen Tag. `meide` sind die von gestern – die
   rutschen nach hinten, damit nicht tagelang dasselbe kommt. */
function zieh(tag, stufe, meide){
  const liste = mischeFest(questTopf(stufe), wuerfel(saatAus(questSaat()+'|'+tag)))
    .sort((x,y) => (meide.indexOf(x.id)>=0?1:0) - (meide.indexOf(y.id)>=0?1:0));
  const raus=[], arten=new Set(); let dick=0;
  for(const q of liste){
    if(arten.has(q.art)) continue;      // nicht zweimal fast dasselbe
    if(q.dick === 3 && dick) continue;  // höchstens eine schwere am Tag
    arten.add(q.art); if(q.dick === 3) dick++;
    raus.push(q);
    if(raus.length === 3) break;
  }
  // Mindestens eine Aufgabe, die auch mit null Herzen geht
  if(raus.length && !raus.some(q => q.ohneLeben)){
    const ersatz = liste.find(q => q.ohneLeben);
    if(ersatz) raus[raus.length-1] = ersatz;
  }
  return raus;
}
function questsHeute(){
  const tag=today(), stufe=questStufe();
  const gestern = zieh(tagMinus(tag,1), stufe, []).map(q=>q.id);
  return zieh(tag, stufe, gestern).map(q => ({...q, ziel: q.ziele[stufe-1]}));
}
const questStand = id => (tagwerk[today()] || {})[id] || 0;
const questFertig = q => questStand(q.id) >= q.ziel;

/* ---- Lernzeit ----
   Gezählt wird NUR, während wirklich an einer Lektion, einem Test oder einer
   Geschichte gearbeitet wird – und nur zwischen zwei beantworteten Aufgaben.
   Jede einzelne Pause ist auf PAUSE_MAX gedeckelt: Wer über einer Aufgabe
   lange nachdenkt, bekommt 90 Sekunden gutgeschrieben, wer die Lektion offen
   liegen lässt, bekommt nichts mehr. Auf zehn Minuten kommt man damit nur
   durch tatsächlich beantwortete Aufgaben, nicht durch Dasitzen.
   Gespeichert wird in Sekunden, angezeigt in Minuten. */
const PAUSE_MAX = 90;      // Sekunden je Pause, die noch als Lernen zählen
let uhrStart = 0;          // 0 = Uhr läuft nicht
let seitAntwort = 0;       // Sekunden seit der letzten beantworteten Aufgabe
function uhrAn(){ if(!uhrStart) uhrStart = Date.now(); }
function uhrNeu(){ seitAntwort = 0; uhrAn(); }   // frische Lektion, Test oder Geschichte
/* Schreibt die bisher gelaufene Zeit gut. Wird alle zehn Sekunden aufgerufen,
   damit die Zeit auch dann in der Datei landet, wenn der Browser mitten in
   der Lektion zugeht – und beim Verlassen ein letztes Mal.
   `antwort` = true kommt aus den Antwort-Rückrufen: erst dann beginnt die
   nächste Pause. Der Deckel oben im Kommentar war lange nur versprochen –
   ohne ihn füllte eine offen liegende Aufgabe die Tagesaufgabe „Minuten“
   und damit die Münzen, ohne dass jemand übt. */
function uhrTakt(antwort){
  if(!uhrStart) return;
  const weg = Date.now() - uhrStart;
  if(weg < 1000) return;      // angefangene Sekunde liegen lassen
  const sek = Math.floor(weg/1000);
  uhrStart += sek*1000;       // nur das Gutgeschriebene abziehen, Rest bleibt stehen
  const gut = Math.max(0, Math.min(sek, PAUSE_MAX - seitAntwort));
  seitAntwort += sek;
  if(gut) zaehle('zeit', gut);
  if(antwort === true) seitAntwort = 0;
}
function uhrAus(){ uhrTakt(); uhrStart = 0; }
setInterval(uhrTakt, 10000);
// Bildschirm aus, Tab gewechselt, Handy gesperrt: das zählt nicht mit –
// und der Ton hat dort erst recht nichts verloren. Sonst spricht die App
// aus der Tasche weiter, obwohl sie längst im Hintergrund liegt.
// Wieder sichtbar: nur anlaufen lassen, was vorher wirklich lief. Die
// Ergebnisschirme haben die Uhr schon aus – dort darf sie nicht neu starten,
// sonst zählt jede AdMob-Anzeige und jedes Sperren Minuten dazu.
let uhrWarAn = false;
document.addEventListener('visibilitychange', ()=>{
  if(document.hidden){
    uhrWarAn = uhrStart > 0; uhrAus(); stilleBitte(true);   // Aufgabe bleibt gueltig
    /* Den Werbewecker abraeumen. Die Anzeige ist damit nicht verloren:
       werbungSchuldig traegt sie in die naechste Lektion. */
    if(werbungWecker){ clearTimeout(werbungWecker); werbungWecker = 0; schuldigSetzen(true); }
    /* Und speichern. Eine RICHTIGE Antwort speicherte bisher gar nicht:
       known.add() und zaehle() laufen, saveProgress() nicht. Gespeichert
       wurde nur bei einer falschen Antwort (ueber loseLife) und am
       Lektionsende. Der Fehler traf also ausgerechnet den fehlerfreien
       Lauf - Anruf mitten in der Lektion, und die gelernten Woerter waren
       weg. Ajdin am 18.09.2026. */
    saveProgress();
  }
  else {
    /* Zuerst der Tageswechsel: ueber Nacht im Hintergrund ist der
       haeufigste Fall, und er faellt sonst erst auf, wenn die Serie
       schon gerissen ist. */
    tagPruefen();
    if(uhrWarAn){ uhrWarAn = false; uhrAn(); }
  }
});

/* Frisch geschaffte Aufgaben – wird beim Zeichnen des Ergebnisschirms geleert.
   Deshalb braucht es keinen "schon gefeiert"-Merker in der Datei: nach einem
   Neuladen ist die Liste leer, also feiert nichts ein zweites Mal. */
let questFrisch = [];

/* Zählt hoch. Münzen gibt es genau in dem Augenblick, in dem der Zähler das
   Ziel überschreitet – nie beim Zeichnen, sonst gäbe es sie doppelt. */
function zaehle(id, wieviel){
  const t=today();
  if(!tagwerk[t]) tagwerk[t] = {};
  const vorher = tagwerk[t][id] || 0;
  tagwerk[t][id] = vorher + (wieviel || 1);
  const q = questsHeute().find(x => x.id === id);
  if(q && vorher < q.ziel && tagwerk[t][id] >= q.ziel){
    muenzenGes += MUENZEN_PRO_QUEST;
    questFrisch.push(q);
  }
}

/* ---- Leben ---- */
/* Das Geschenk zaehlt hier mit: solange es laeuft, gibt es weder Werbung
   noch eine Grenze bei den Leben - genau wie gekauft. */
const unlimited = () => premium || ALLE_FREI || geschenkLaeuft();
const REFILL_MS = LEBEN_NACHFUELLEN_MIN*60*1000;
function syncLives(){
  if(unlimited() || lives.anzahl >= LEBEN_MAX) return;
  /* Eine Zeit aus der Zukunft kommt wirklich vor: wer die Uhr des Handys
     vorstellt und wieder zurueckstellt, hat sie im Lernstand stehen. Dann
     ist die Differenz unten fuer immer negativ, gained wird nie groesser
     als null - und es waechst nie wieder ein Herz nach. Die App sagt dann
     Dinge wie "naechstes Herz in 11 Tagen", und dagegen laesst sich von
     aussen nichts machen. Selten, aber ein Totalausfall ohne Selbsthilfe. */
  if(lives.zeit > Date.now()) lives.zeit = Date.now();
  const gained = Math.floor((Date.now() - lives.zeit) / REFILL_MS);
  if(gained > 0){
    const n = Math.min(LEBEN_MAX, lives.anzahl + gained);
    lives = n >= LEBEN_MAX ? {anzahl:LEBEN_MAX, zeit:0} : {anzahl:n, zeit:lives.zeit + gained*REFILL_MS};
    saveProgress();
  }
}
function livesNow(){ syncLives(); return unlimited() ? LEBEN_MAX : lives.anzahl; }
function loseLife(){
  if(unlimited()) return;
  syncLives();
  if(lives.anzahl >= LEBEN_MAX) lives.zeit = Date.now();
  lives.anzahl = Math.max(0, lives.anzahl - 1);
  saveProgress(); renderLives();
}
function nextLifeIn(){ if(unlimited() || lives.anzahl >= LEBEN_MAX) return 0; return Math.max(0, lives.zeit + REFILL_MS - Date.now()); }
const fmtMin = ms => { const m=Math.ceil(ms/60000); return m>=60 ? t('zeit.stunden',{h:Math.floor(m/60), m:m%60}) : t('zeit.minuten',{m:m}); };
const fmtTage = ms => { const tg=Math.floor(ms/86400000); return tg>=1 ? tp('zeit.tage', tg) : fmtMin(ms); };
/* Ein Herz mit einer Zahl, mehr nicht. Fünf einzelne Herzen plus ein Satz
   daneben brauchten eine ganze Leiste; jetzt passt es in eine Ecke.
   Die Wartezeit kommt erst, wenn man aufs Herz tippt – außer bei null, da
   ist sie das Einzige, was gerade zählt.
   livesInfoAn steht außerhalb, weil renderLives() alle 30 Sekunden neu
   zeichnet und die aufgeklappte Zeile das überleben muss. */
let livesInfoAn = false;
function lebenText(n){
  if(unlimited()) return t(ALLE_FREI ? 'leben.testmodus' : 'leben.unbegrenzt');
  if(n >= LEBEN_MAX) return t('leben.voll');
  if(n === 0) return t('leben.keine', {zeit: fmtMin(nextLifeIn())});
  return t('leben.stand', {n:n, max:LEBEN_MAX, zeit:fmtMin(nextLifeIn())});
}
function renderLives(){
  /* Die Muenzen haengen an derselben Leiste wie die Herzen und werden hier
     mitgezeichnet - so stimmen sie nach jedem Kauf und jeder Tagesaufgabe,
     ohne dass jede Stelle daran denken muss. */
  const mb=$('muenzBar');
  if(mb){ mb.hidden = !profil; if(profil) mb.innerHTML = '🪙 <b>'+muenzen()+'</b> <span class="km">KM</span>'; }
  const bar=$('livesBar'); if(!profil){ bar.style.display='none'; return; } bar.style.display='inline-flex';
  const n = livesNow();
  const zeigen = livesInfoAn || n === 0;
  bar.className='livesbar'+(unlimited()?' premium':'')+(n===0?' zero':'');
  bar.innerHTML = '<button type="button" class="herz" id="livesKnopf" aria-expanded="'+zeigen+'">'
                + '♥ <b>'+(unlimited()?'∞':n)+'</b></button>'
                + (zeigen ? '<span class="info">'+esc(lebenText(n))+'</span>' : '');
  $('livesKnopf').addEventListener('click', ()=>{ livesInfoAn = !livesInfoAn; renderLives(); });
  const b=$('btnLesson'); if(b){ b.disabled = n===0; b.textContent = n===0 ? t('leben.warten') : t('level.lektion'); }
}
/* Muenzanzeige, Einkaufswagen und Zahnrad stehen auch waehrend einer
   Lektion oben, weil Lektion und Test Unteransichten von levelView sind und
   nicht ueber showView() laufen. Wer einen davon antippt, verliert sonst die
   angefangene Lektion ohne Warnung - die verbrauchten Leben bleiben
   verbraucht, und zurueck fuehrt nur auf die Startseite. Der Knopf "Lektion
   abbrechen" daneben fragt laengst nach, die Zurueck-Taste des Handys ruft
   genau diesen Knopf. Gefunden am 26.09.2026.
   Gefragt wird nur, wenn wirklich eine Lektion oder ein Test laeuft. */
async function lektionDarfWeg(){
  /* Tx heisst seine Liste "qs", nicht "queue" (siehe buildTest). Mit
     Tx.queue.length warf diese Zeile waehrend eines Tests einen Fehler, und
     der Tipp auf Muenzen, Laden oder Zahnrad tat daraufhin gar nichts.
     Gefunden am 26.09.2026. */
  const laeuft = (sichtbar('lesson') && Lx && Lx.i < Lx.queue.length) ||
                 (sichtbar('test')   && Tx && Tx.i < Tx.qs.length);
  if(!laeuft) return true;

/* Wer die App abends auf der Startseite liegen laesst und sie morgens
   wieder hervorholt, sah bisher den Stand von gestern: "Heute geuebt",
   die alte Serienzahl und alle drei Tagesaufgaben abgehakt. renderHero()
   und renderQuests() laufen naemlich nur aus showHome(), und der einzige
   Zeitgeber zeichnete bloss renderLives().
   Das ist nicht nur schief angezeigt: wer glaubt, er haette heute schon
   geuebt, lernt nicht - und verliert die Serie, weil days den neuen Tag
   nie bekommt. Gefunden am 26.09.2026. */
let letzterTag = today();
function tagPruefen(){
  const jetzt = today();
  if(jetzt === letzterTag) return false;
  letzterTag = jetzt;
  /* Der Serienschutz lief bisher nur beim Kaltstart (nachAnmeldung) und beim
     Einlesen einer Sicherung. Bleibt die App ueber einen ausgelassenen Tag
     hinweg im Speicher - Home-Taste, Handy in die Tasche, kein Neuladen -,
     kam der ausgelassene Tag nie in frost: die Serie fiel still von 40 auf 1,
     obwohl Schutztage im Vorrat lagen, und es kam weder "gerettet" noch
     "verloren". Am PC faellt das nicht auf, weil start.py jedes Mal eine
     frische Seite liefert. pruefeSchutz() zaehlt von GESTERN zurueck, muss
     also nicht punktgenau um Mitternacht laufen; der Aufruf hier deckt beide
     Wege ab - den Zeitgeber alle 30 Sekunden und das Hervorholen der App.
     Zweimal laufen schadet nicht: beim zweiten Mal stehen die Luecken schon
     in frost, luecken ist leer und die Funktion kehrt sofort zurueck.
     Gefunden am 26.09.2026. */
  pruefeSchutz();
  geschenkPruefen();
  geschenkNachreichen();
  /* Nur zeichnen, wenn die Startseite ueberhaupt sichtbar ist. Mitten in
     einer Lektion wuerde showHome() die Aufgabe wegreissen. Der Merker
     steht trotzdem schon auf heute, damit es spaeter nicht grundlos
     nachzieht - showLevelHome() zeichnet die Startseite ohnehin neu. */
  if(sichtbar('pfad')) showHome();
  return true;
}
setInterval(()=>{ tagPruefen(); renderLives(); }, 30000);

/* ---- Lernserie ----
   days  = Tage mit einer fertigen Lektion
   frost = Tage, die ein Serienschutz gerettet hat. Sie unterbrechen die Serie
           nicht, zählen aber selbst nicht als Lerntag (wie bei Duolingo). */
const dayKey = x => x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0');
function streak(){
  const alle = new Set([...days, ...frost]);
  const d=new Date(); let n=0;
  if(!alle.has(dayKey(d))) d.setDate(d.getDate()-1);
  while(alle.has(dayKey(d))){ if(days.has(dayKey(d))) n++; d.setDate(d.getDate()-1); }
  return n;
}

/* ---- Serienschutz ----
   Wächst von selbst nach: alle SCHUTZ_TAGE Tage einer, höchstens SCHUTZ_MAX.
   Lässt man einen Tag aus, deckt ein Schutz diesen Tag ab und die Serie bleibt. */
const SCHUTZ_MS = SCHUTZ_TAGE*24*60*60*1000;
function syncSchutz(){
  if(schutz.zeit > Date.now()) schutz.zeit = Date.now();   // siehe syncLives
  if(schutz.anzahl >= SCHUTZ_MAX){ if(!schutz.zeit) return false; schutz.zeit = 0; return true; }
  if(!schutz.zeit){ schutz.zeit = Date.now(); return true; }
  const dazu = Math.floor((Date.now() - schutz.zeit) / SCHUTZ_MS);
  if(dazu <= 0) return false;
  const n = Math.min(SCHUTZ_MAX, schutz.anzahl + dazu);
  schutz = n >= SCHUTZ_MAX ? {anzahl:SCHUTZ_MAX, zeit:0} : {anzahl:n, zeit:schutz.zeit + dazu*SCHUTZ_MS};
  return true;
}
function schutzNow(){ if(syncSchutz()) saveProgress(); return schutz.anzahl; }
function naechsterSchutzIn(){ return (schutz.anzahl>=SCHUTZ_MAX || !schutz.zeit) ? 0 : Math.max(0, schutz.zeit + SCHUTZ_MS - Date.now()); }

let schutzMeldung = 0;   // >0: so viele Tage gerettet, -1: Serie ist gerissen
function pruefeSchutz(){
  schutzMeldung = 0;
  if(!days.size) return;
  const alle = new Set([...days, ...frost]);
  const luecken = [];
  const d = new Date(); d.setDate(d.getDate()-1);
  while(luecken.length <= SCHUTZ_MAX && !alle.has(dayKey(d))){ luecken.push(dayKey(d)); d.setDate(d.getDate()-1); }
  if(!luecken.length) return;                  // gestern gelernt, alles gut
  if(!alle.has(dayKey(d))){ schutzMeldung = -1; return; }   // Serie schon lange weg
  if(schutzNow() < luecken.length){ schutzMeldung = -1; return; }
  luecken.forEach(k=>frost.add(k));
  schutz.anzahl -= luecken.length;
  if(!schutz.zeit) schutz.zeit = Date.now();
  schutzMeldung = luecken.length;
  saveProgress();
}
function renderSerie(){
  const el=$('streakLine'); if(!el) return;
  if(schutzMeldung < 0 && days.has(today())) schutzMeldung = 0;   // heute gelernt: neue Serie laeuft
  const n=streak(), s=schutzNow(), rest=naechsterSchutzIn();
  const nach = s>=SCHUTZ_MAX ? ' · '+t('serie.schutz_voll') : (rest ? ' · '+t('serie.schutz_naechster',{zeit:fmtTage(rest)}) : '');
  /* Die Serie selbst steht seit dem 26.09.2026 gross darueber, mit ihrer
     eigenen Flamme. Stuende sie hier noch einmal, saehe man "🔥 0" und
     direkt darunter "🔥 Noch keine Lernserie" - dieselbe Flamme und
     dieselbe Zahl zweimal. Diese Zeile traegt deshalb nur noch den
     Schutz und die Meldungen dazu.
     n wird weiter gebraucht: schutzMeldung haengt daran. */
  el.innerHTML =
    '<span>'+tp('serie.schutz', s)+nach+'</span>' +
    (schutzMeldung > 0 ? '<span class="frost">'+tp('serie.gerettet', schutzMeldung)+'</span>' : '') +
    (schutzMeldung < 0 ? '<span class="lost">'+t('serie.verloren')+'</span>' : '');
}

  /* Der Einstiegsknopf traegt den Namen dessen, was als naechstes dran ist.

     Er richtet sich nach dem Reiter: im Lernpfad auf das naechste Level,

/* ---- Sprachausgabe: eigene Aufnahme (web/audio) vor Computerstimme ---- */
/* hasTTS    = das Geraet hat eine Computerstimme. In der Android-App ist das
                meist NICHT so - die System-WebView kennt speechSynthesis nicht.
   canListen = es laesst sich ueberhaupt etwas hoeren: Computerstimme ODER
               mitgelieferte Aufnahmen. Daran haengen die Hoer-Knoepfe, der
               Aufgabentyp 'listen' und die Tagesaufgabe 'hoer'.
               Wird in ladeAudio() endgueltig gesetzt. */
const hasTTS = 'speechSynthesis' in window;
let canListen = hasTTS;
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
/* Spracherkennung gibt es auf zwei Wegen, und der Unterschied ist nicht
   Geschmack: In der App-Huelle ist die Schnittstelle des Browsers zwar da,
   aber der Dienst dahinter fehlt - sie bricht sofort mit "nicht erlaubt"
   ab, ganz gleich welche Berechtigung gesetzt ist. Darum dort das Plugin,
   das Androids eigene Erkennung benutzt; am PC bleibt es beim Browser.
   canSpeak steht erst nach hoerenPruefen() fest, das in init() laeuft. */
function hoererPlugin(){
  const P = window.Capacitor && window.Capacitor.Plugins;
  return (P && P.SpeechRecognition) || null;
}
let canSpeak = false;
/* Hat der Nutzer das Mikrofon einmal abgelehnt, merkt sich die App das.
   Sonst galt der Ausschluss nur bis zum naechsten Start: available()
   sagt lediglich, dass ein Erkenner installiert ist, nicht dass die App
   ihn benutzen darf - und nach jedem Neustart standen wieder
   Sprechaufgaben da, die sich nur ueberspringen lassen. Gefunden bei P10
   am 28.09.2026. Der Weg zurueck bleibt offen: erteilt er die
   Berechtigung spaeter in den Geraeteeinstellungen, faellt die Merkung
   beim naechsten Start von selbst weg. */
const MIKRO_NEIN = 'zmaj_mikro_nein';
function mikroAbgelehnt(){
  try{ return localStorage.getItem(MIKRO_NEIN) === '1'; }catch(e){ return false; }
}
function mikroAbsageMerken(ja){
  try{ ja ? localStorage.setItem(MIKRO_NEIN, '1') : localStorage.removeItem(MIKRO_NEIN); }catch(e){}
}
async function hoerenPruefen(){
  const H = hoererPlugin();
  if(H){
    try{ canSpeak = !!(await H.available()).available; }
    catch(e){ canSpeak = false; }
    /* Nur nachsehen, nicht fragen: checkPermissions() oeffnet kein
       Fenster. Ein abgelehntes Mikrofon nimmt 'speak' aus dem Topf,
       ein erteiltes loescht die gemerkte Absage. */
    if(canSpeak){
      try{
        const r = await H.checkPermissions();
        const stand = r && r.speechRecognition;
        if(stand === 'granted') mikroAbsageMerken(false);
        else if(stand === 'denied' || mikroAbgelehnt()) canSpeak = false;
      }catch(e){}
    }
  } else {
    canSpeak = !!SR && window.isSecureContext;
  }
  return canSpeak;
}
let AUDIO = new Map();
let voiceName = ''; try{ voiceName = localStorage.getItem('zmaj_voice') || ''; }catch(e){}
const audioKey = text => text.split(' / ')[0].replace(/[.!?…]+$/,'').trim().toLowerCase();
function bosnianVoices(){
  return speechSynthesis.getVoices().filter(v=>/^(bs|hr|sr)/i.test(v.lang))
    .sort((a,b)=>{ const s=v=>(/^bs/i.test(v.lang)?0:(/^hr/i.test(v.lang)?1:2))*10 + (/natural|online/i.test(v.name)?0:1); return s(a)-s(b); });
}
function pickVoice(){ const list = bosnianVoices(); return list.find(v=>v.name===voiceName) || list[0] || null; }
/* Das bosnische Alphabet kennt kein x, q, w und y. Die Stimme verschluckt diese
   Buchstaben (aus „Rex“ wird „Re“). Darum vor dem Vorlesen umschreiben.
   Nur für den Ton, der angezeigte Text bleibt unverändert. */
function fuerStimme(text){
  return text.split(' / ')[0]
    .replace(/x/g, 'ks').replace(/X/g, 'Ks')
    .replace(/q/g, 'k').replace(/Q/g, 'K')
    .replace(/w/g, 'v').replace(/W/g, 'V')
    .replace(/y/g, 'j').replace(/Y/g, 'J');
}
/* ---- Tempo ----
   Ajdin am 18.09.2026: man soll langsamer vorlesen lassen koennen. Der Wert
   gilt fuer alle Aufnahmen und fuer die Computerstimme am PC, nicht nur fuer
   die Geschichten - ein Wort, das in der Lektion zu schnell kommt, ist
   dasselbe Problem. */
const TEMPI = [0.5, 0.75, 1, 1.25];
let tempo = 1;
try{ const gemerkt = parseFloat(localStorage.getItem('zmaj_tempo'));
     if(TEMPI.indexOf(gemerkt) >= 0) tempo = gemerkt; }catch(e){}
/* pausiert: angehalten, aber NICHT zurueckgesetzt. Ohne diese Unterscheidung
   wuerde das 'pause'-Ereignis den Vorlese-Knopf sofort zuruecksetzen, und die
   Stelle im Text waere verloren. */
let pausiert = false;

/* Ein einziges Audio-Element fuer alles. Fuer jedes Wort ein neues anzulegen
   laesst den vorigen Ton weiterlaufen und fuellt mit der Zeit den Speicher. */
const spieler = new Audio(); spieler.preload = 'none';
function spieleDatei(datei, fertig){
  pausiert = false;        // ein neuer Ton hebt eine alte Pause auf
  spieler.pause(); spieler.currentTime = 0;
  spieler.onended = fertig || null;
  spieler.src = 'audio/' + datei;
  /* Das Tempo bei jedem Start neu setzen: die Eigenschaft ueberlebt zwar den
     Wechsel der Quelle, aber nicht jede WebView haelt sich daran.
     preservesPitch haelt die Tonhoehe - ohne das klaenge Goran bei 0,5x wie
     aus dem Keller. */
  try{ spieler.preservesPitch = true; }catch(e){}
  try{ spieler.playbackRate = tempo; }catch(e){}
  return spieler.play();   // Promise! Ablehnung muss gefangen werden.
}
/* ---- Ruhe ----
   Die Geschichten sind als ganze Aufnahme dabei, die laengste 52 Sekunden.
   Wer waehrenddessen zurueckgeht, hoerte sie vorher bis zum Ende weiter -
   auch auf der Startseite und in den Einstellungen. Deshalb eine einzige
   Stelle, die alles abstellt, und ein Aufruf in showView(): egal auf
   welchem Weg man eine Ansicht verlaesst, es wird still.
   `laeuftVor` ist gesetzt, solange ein Knopf mitlaufen soll - er faerbt
   sich zurueck, wenn der Ton endet oder abgebrochen wird. */
let laeuftVor = null, tonMarke = 0;
/* Wo eine vorgelesene Geschichte unterbrochen wurde: {datei, sekunde}.
   Wer ein Wort antippt, um es uebersetzt zu bekommen, soll danach nicht
   wieder bei Sekunde null landen - stilleBitte() dreht currentTime aber
   grundsaetzlich zurueck. Deshalb wird die Stelle vorher gesichert.
   Gemeldet am 24.09.2026. */
let geschichteStelle = null;
/* aufgabeMarke: welche Aufgabe gerade steht. Die Spracherkennung antwortet
   verzoegert - wer waehrenddessen ueberspringt oder abbricht, bekaeme sonst
   das Ergebnis in die NAECHSTE Aufgabe geliefert, samt Piepton und einem
   zweiten done(). hoererAbbrechen bricht eine laufende Erkennung ab. */
let aufgabeMarke = 0, hoererAbbrechen = null;
/* Nur den Knopf zuruecksetzen - der Ton selbst ist dann schon aus. */
function knopfZurueck(){
  const zurueck = laeuftVor; laeuftVor = null;
  if(zurueck) try{ zurueck(); }catch(e){}
}
/* behalteAufgabe: den Ton abstellen, die Aufgabe aber stehen lassen.
   Gebraucht wird das genau einmal - beim Wechsel in den Hintergrund.
   Warum: aufgabeMarke sagt, welche Aufgabe gerade gilt. bewerte() in der
   Sprechaufgabe verwirft jedes Ergebnis, dessen Marke nicht mehr stimmt -
   richtig, wenn die Erkennung verspaetet in die NAECHSTE Aufgabe
   hineinredet. Nur hob visibilitychange die Marke ebenfalls an, obwohl
   dieselbe Aufgabe weiter auf dem Schirm steht. Folge: Handy sperren und
   wieder aufwecken, und das Sprechen war fuer diese Aufgabe tot - das
   Mikrofon hoerte zu, aber das Ergebnis fiel weg.
   Ajdin am 27.09.2026: "wenn ich mein handy schliesse und wieder oeffne geht
   das sprechen nicht mehr er erkennt meine stimme nicht". Am Geraet
   nachgemessen: die Marke sprang allein durch den Wechsel von 68 auf 69.
   Die laufende Erkennung wird trotzdem abgebrochen - die App darf nicht aus
   der Tasche weiter zuhoeren. Nur die Aufgabe bleibt gueltig. */
function stilleBitte(behalteAufgabe){
  tonMarke++;              // macht noch wartende Zeitgeber ungueltig
  if(!behalteAufgabe) aufgabeMarke++;   // und verspaetete Erkennungs-Ergebnisse
  pausiert = false;        // Stopp ist keine Pause: der Knopf darf zurueck
  spieler.onended = null;  // zuerst, und ausserhalb des try: das darf nie haengenbleiben
  try{ spieler.pause(); spieler.currentTime = 0; }catch(e){}
  if(hasTTS){ try{ speechSynthesis.cancel(); }catch(e){} }
  const h = hoererAbbrechen; hoererAbbrechen = null;
  if(h) try{ h(); }catch(e){}
  knopfZurueck();
}
/* Haelt das System den Ton von aussen an - Kopfhoerer abgezogen, ein Anruf,
   eine andere App holt sich den Ton -, kommt kein 'ended'. Der Knopf
   stuende dann bis zum naechsten Tippen auf "Stopp". Das 'pause'-Ereignis
   kommt aber. Nur kommt es VERZOEGERT, auch fuer das pause(), das
   spieleDatei() vor jedem Start selbst ruft - dann laeuft laengst der neue
   Ton und `paused` ist schon wieder false. Deshalb die Pruefung. */
spieler.addEventListener('pause', ()=>{ if(spieler.paused && !pausiert) knopfZurueck(); });
spieler.addEventListener('error', knopfZurueck);
/* ---- Anhalten, weitermachen, Tempo ----
   Stopp setzt an den Anfang zurueck, Pause nicht: `currentTime` bleibt
   stehen, und weil `pausiert` gesetzt ist, faellt der Knopf nicht auf
   "Vorlesen" zurueck. Die Computerstimme am PC kann beides von Haus aus;
   auf dem Handy gibt es sie nicht, dort laeuft alles ueber die Aufnahmen. */
function tonPause(){
  if(pausiert) return false;
  if(hasTTS && speechSynthesis.speaking && !speechSynthesis.paused){
    pausiert = true; try{ speechSynthesis.pause(); }catch(e){} return true;
  }
  if(spieler.src && !spieler.paused){
    pausiert = true; try{ spieler.pause(); }catch(e){} return true;
  }
  return false;            // es lief gar nichts - der Aufrufer stellt ab
}
function tonWeiter(){
  if(!pausiert) return false;
  pausiert = false;
  if(hasTTS && speechSynthesis.paused){ try{ speechSynthesis.resume(); }catch(e){} return true; }
  const p = spieler.play();
  /* Laesst das Geraet nicht weiterspielen, lieber sauber abstellen als den
     Knopf auf "Pause" stehenlassen - sonst reagiert er scheinbar nicht mehr. */
  if(p && p.catch) p.catch(()=>stilleBitte());
  return true;
}
function setzeTempo(v){
  tempo = v;
  try{ localStorage.setItem('zmaj_tempo', String(v)); }catch(e){}
  // Ein laufender Ton aendert sich sofort mit, ohne Neustart.
  try{ spieler.playbackRate = v; }catch(e){}
  // Beide Leisten - die in der Geschichte und die in den Einstellungen.
  document.querySelectorAll('.tempo button').forEach(b =>
    b.setAttribute('aria-pressed', String(parseFloat(b.dataset.tempo) === v)));
}
function tempoLeiste(id, mitWort){
  const box = $(id); if(!box) return;
  // 0,5 im Deutschen, 0.5 im Englischen - sonst liest es sich wie ein Fehler.
  const komma = SPRACHE === 'en' ? '.' : ',';
  // In den Einstellungen steht "Tempo" schon als Ueberschrift der Zeile.
  box.innerHTML = (mitWort ? '<span class="tlabel">'+esc(t('set.tempo'))+'</span>' : '')+
    TEMPI.map(v => '<button type="button" data-tempo="'+v+'" aria-pressed="'+(v===tempo)+'">'+
      String(v).replace('.', komma)+'\u00d7</button>').join('');
  box.querySelectorAll('button').forEach(b => b.addEventListener('click', e=>{
    // Nicht durchreichen: in der Geschichte haengt darueber der Horcher,
    // der zur naechsten Frage blaettert.
    e.stopPropagation(); setzeTempo(parseFloat(b.dataset.tempo));
  }));
}
/* Die Hoer-Aufgaben spielen das Wort kurz verzoegert von selbst ab, damit
   der Bildschirm erst steht. Verlaesst man die Lektion in genau dieser
   Viertelsekunde, kaeme der Ton NACH dem Abstellen - und liefe wieder in
   die naechste Ansicht hinein. Deshalb eine Marke: was vor dem letzten
   stilleBitte() bestellt wurde, wird nicht mehr ausgeliefert. */
function spaeterSprechen(text, ms){
  const marke = ++tonMarke;
  setTimeout(()=>{ if(marke === tonMarke) speak(text); }, ms);
}
/* Erst den vollen Text suchen, dann den gekuerzten Schluessel. Dadurch koennen
   "Molim" und "Molim?" eigene Aufnahmen haben, muessen aber nicht. */
function audioDatei(text){
  const voll = text.split(' / ')[0].trim().toLowerCase();
  return AUDIO.get(voll) || AUDIO.get(audioKey(text)) || null;
}
function sprichMitStimme(text, fertig){
  if(!hasTTS){ if(fertig) fertig(); return; }
  pausiert = false;
  // Sonst laegen am PC eine noch laufende Aufnahme und die Stimme uebereinander
  try{ spieler.pause(); spieler.currentTime = 0; }catch(e){}
  const u = new SpeechSynthesisUtterance(fuerStimme(text));
  const v = pickVoice();
  if(v){ u.lang=v.lang; u.voice=v; } else { u.lang='hr-HR'; }
  // 0,85 ist die Grundgeschwindigkeit der Computerstimme, das eingestellte
  // Tempo verrechnet sich damit. Unter 0,1 nimmt kein Browser den Wert an.
  u.rate = Math.max(0.1, Math.min(10, 0.85 * tempo));
  if(fertig){ u.onend = fertig; u.onerror = fertig; }
  speechSynthesis.cancel(); speechSynthesis.speak(u);
}
/* `fertig` wird gerufen, wenn der Ton von selbst zu Ende ist - daran haengt
   der Knopf, der dann von "Stopp" wieder auf "Vorlesen" springt. */
function speak(text, fertig){
  const datei = audioDatei(text);
  if(!datei){ sprichMitStimme(text, fertig); return; }
  /* Faellt die Datei aus (fehlt, Autoplay gesperrt), springt die Stimme ein.
     Aber NICHT, wenn der Start absichtlich abgebrochen wurde: stilleBitte()
     ruft pause(), und ein pause() vor dem Anlaufen laesst play() mit
     AbortError ablehnen. Ohne diese Pruefung laese am PC die Computerstimme
     genau das weiter, was man gerade abgestellt hat - in der naechsten
     Ansicht, ohne Stopp-Knopf. */
  const marke = tonMarke;
  spieleDatei(datei, fertig).catch(e=>{
    if(marke !== tonMarke || (e && e.name === 'AbortError')) return;
    sprichMitStimme(text, fertig);
  });
}
/* Gibt es fuer dieses Wort ueberhaupt etwas zu hoeren? Auf dem Handy kennt
   die WebView keine Computerstimme - dort gibt es nur die Aufnahmen. */
const hoerbar = text => !!audioDatei(text) || hasTTS;
/* hoerbar() entscheidet, OB ein Lautsprecher angeboten wird, und darf grosszuegig
   sein: ist die Stimmenliste beim ersten Aufruf noch leer, soll der Knopf
   trotzdem dastehen. Beim Vorlesen einer Loesung ist das anders - dort wird
   sofort gesprochen. Ohne bosnische, kroatische oder serbische Stimme liest
   die Standardstimme des Geraets die bosnische Form mit deutscher Aussprache
   vor, direkt nachdem der Nutzer sie gelernt hat. Gefunden am 26.09.2026. */
const vorlesbar = text => !!audioDatei(text) || (hasTTS && !!pickVoice());
/* Die Stimmenauswahl steht seit dem 18.09.2026 nicht mehr in den
   Einstellungen. Die Funktion bleibt samt Aufruf beim Stimmenwechsel
   stehen, falls die Zeile je zurueckkommt - sie muss das Fehlen des
   Kastens nur vertragen. */

/* =================== SPRACHE =================== */
/* Die Lerninhalte kommen je nach Sprache anders vom Server zurück, deshalb
   wird beim Umschalten alles neu geholt. Was noch nicht übersetzt ist,
   schickt der Server auf Deutsch. */
/* Die Tonspur liegt als fertige Dateien in web/audio, die Zuordnung in
   web/audio/index.json. Bewusst NICHT ueber den Server: in der Handy-App
   gibt es keinen. Einmal beim Start, der Bestand ist sprachunabhaengig. */
async function ladeAudio(){
  try{
    const r = await fetch('audio/index.json', {cache:'no-cache'});
    const idx = await r.json();
    AUDIO = new Map((idx.toene||[]).map(e=>[String(e.key).toLowerCase(), e.datei]));
  }catch(e){ AUDIO = new Map(); }
  canListen = hasTTS || AUDIO.size > 0;
}
/* Woher der Inhalt kommt, haengt davon ab, wo die App laeuft.

   Am PC liest der Server die Python-Dateien bei JEDEM Aufruf frisch ein -
   eine Aenderung an vokabeln.py ist nach F5 sofort sichtbar. Diesen Weg
   wollen wir behalten, solange es ihn gibt.

   Auf dem Handy gibt es keinen Server. Dort liegt der Inhalt als fertige
   Datei daneben, erzeugt von inhalt_bauen.py. Deshalb: erst den Server
   fragen, und wenn der nicht antwortet, die Datei nehmen. */
async function holeInhalt(){
  try{
    const r = await fetch('/api/daten?sprache='+encodeURIComponent(SPRACHE));
    /* Erst auswerten, DANN merken. Auf dem Handy gibt es keinen Server,
       aber Capacitor beantwortet jeden Pfad ohne Punkt im letzten Segment
       mit der index.html und Status 200 - r.ok ist also wahr. Stand das
       Merken davor, blieb MIT_SERVER auf true, obwohl r.json() gleich am
       HTML scheitert. Beim Start korrigierte das noch /api/konto weiter
       unten; beim Sprachwechsel lief ladeDaten() erneut und niemand setzte
       zurueck. Ab da schrieb saveProgress() per POST ins Leere und meldete
       Erfolg. Gefunden am 20.09.2026, waehrend der geschlossene Test lief. */
    if(r.ok){ const d = await r.json(); if(KONTEN_AN) MIT_SERVER = true; return d; }
  }catch(e){}
  // Zweiter Versuch mit der gewuenschten Sprache, dann Englisch, dann
  // Deutsch. Englisch davor, weil die App in 177 Laendern steht: ein Handy
  // in Bosnien meldet "bs", das gibt es hier nicht - und wer kein Deutsch
  // kann, kommt mit Englisch weiter. Welche Sprache es wirklich wurde,
  // traegt ladeDaten() danach in SPRACHE nach (Feld "sprache" im Inhalt).
  for(const code of [SPRACHE, 'en', 'de']){
    try{
      const r = await fetch('inhalt/'+encodeURIComponent(code)+'.json', {cache:'no-cache'});
      if(r.ok) return await r.json();
    }catch(e){}
  }
  throw new Error('Inhalt nicht gefunden');
}
async function ladeDaten(){
  const d = await holeInhalt();
  SECTIONS = d.sektionen || []; CATEGORIES = d.kategorien; SENTENCES = d.saetze;
  GRAMMAR = d.grammatik || {}; STORIES = d.geschichten || []; DICT = d.woerterbuch || {};
  /* Die zwei Zwischenspeicher der Wortliste haengen an DICT und CATEGORIES und
     werden nur beim ersten Gebrauch gefuellt. Ohne dieses Leeren behielten sie
     nach einem Sprachwechsel die alte Sprache: im Level Tagesablauf stand bei
     "Ustajem" weiter "ich stehe auf" statt "je me leve", in 28 von 43 Leveln,
     bis die App geschlossen und neu geoeffnet wurde. Gefunden am 26.09.2026. */
  vokabelFormen = null; dictFormen = null;
  MASCOT = new Set(d.maskottchen||[]);
  SPRACHEN = d.sprachen || []; T = d.texte || {}; UEBERSETZT = d.uebersetzt || {fertig:0, gesamt:0};
  WERBUNG_ECHT = !!d.werbung_laeuft;      // Schalter aus sprachen.py
  if(d.sprache) SPRACHE = d.sprache;
  if(!CATEGORIES || !CATEGORIES.length) throw new Error('keine Levels');
  if(!SECTIONS.length){ SECTIONS = [{id:'_', label:'Alle Levels', beschreibung:''}]; CATEGORIES.forEach(c=>c.sektion='_'); }
  applyTexts();
}
async function setzeSprache(code){
  if(code === SPRACHE) return;
  const vorher = SPRACHE;
  const warAuf = VIEWS.find(v => $(v).style.display !== 'none');
  SPRACHE = code;
  try{ localStorage.setItem('zmaj_sprache', code); }catch(e){}
  try{ await ladeDaten(); }catch(e){ SPRACHE = vorher; return; }
  if(!STORIES.length) $('modeStories').hidden = true;
  if(warAuf === 'settingsView') showSettings();          // dort steht die Auswahlliste
  else if(warAuf === 'profileView') zeigeAnmeldung(kontoModus);   // dort stehen die Flaggen
  else if(profil) showHome(); else zeigeAnmeldung('anmelden');
}
function renderLangBar(){
  const box=$('langBar'); if(!box) return;
  box.innerHTML = SPRACHEN.map(s=>'<button type="button" class="'+(s.code===SPRACHE?'on':'')+'" data-code="'+esc(s.code)+'">'+s.flagge+' '+esc(s.name)+'</button>').join('');
  box.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>setzeSprache(b.dataset.code)));
}
/* Die Sprachwahl fährt an Ort und Stelle aus. Zugeklappt steht dort die
   aktuelle Sprache mit Pfeil, aufgeklappt stehen alle untereinander.
   Zu bleibt sie nach der Wahl und beim Verlassen der Einstellungen. */
let langOffen = false;
function renderLangSel(){
  const kopf = $('langKopf'), liste = $('langListe');
  if(!kopf || !liste) return;
  const jetzt = SPRACHEN.find(s => s.code === SPRACHE) || SPRACHEN[0];
  kopf.innerHTML = '<span>' + (jetzt ? jetzt.flagge + ' ' + esc(jetzt.name) : '') + '</span>'
                 + '<span class="pfeil" aria-hidden="true">▾</span>';
  kopf.setAttribute('aria-expanded', langOffen);
  liste.hidden = !langOffen;
  liste.innerHTML = SPRACHEN.map(s =>
      '<button type="button" class="sprachzeile'+(s.code===SPRACHE?' jetzt':'')+'" data-code="'+esc(s.code)+'">'
    + s.flagge + ' ' + esc(s.name)
    + (s.code===SPRACHE ? ' <span class="haken">✓</span>' : '') + '</button>').join('');
  kopf.onclick = ()=>{ langOffen = !langOffen; renderLangSel(); };
  liste.querySelectorAll('.sprachzeile').forEach(b => b.onclick = ()=>{
    langOffen = false;
    const code = b.dataset.code;
    if(code === SPRACHE) renderLangSel(); else setzeSprache(code);
  });
  const fehlt = Math.max(0, (UEBERSETZT.gesamt||0) - (UEBERSETZT.fertig||0));
  $('langNote').textContent = fehlt ? t('set.sprache_luecke',{n:fehlt}) : '';
}

const VIEWS = ['profileView','pfad','storyView','levelView','kontoView','settingsView','shopView'];
function showView(id){
  stilleBitte();          // kein Ton laeuft in die naechste Ansicht hinein
  uhrAus();               // und keine Lernzeit: Geschichte und Lektion rufen uhrAn() selbst
  VIEWS.forEach(v=>{ $(v).style.display = v===id ? 'block' : 'none'; });
  $('kopfLeiste').style.display = '';     // wer sie nicht will, blendet sie danach aus

     Einstellungen, im Laden und bei den Geschichten. */

/* Nachfrage mit Ja und Nein, liefert true für Ja.
   Warum nicht confirm(): Die Systemabfrage einer WebView trägt oben den
   Hostnamen und sieht nach Browser aus, nicht nach App. Außerdem hält
   confirm() den ganzen Bildschirm an.
   Solange eine Nachfrage offen ist, verneint frageSchliessen() sie – das
   braucht die Zurück-Taste, damit sich keine zwei Fenster stapeln. */
let frageSchliessen = null;
function frage(titel, text, ja, nein){
  if(frageSchliessen) return Promise.resolve(false);
  return new Promise(fertig => {
    const kasten = document.createElement('div');
    kasten.className = 'nachfrage';
    kasten.innerHTML =
      '<div class="nachfragebox">' +
        '<h3>' + esc(titel) + '</h3>' +
        (text ? '<div class="txt">' + esc(text) + '</div>' : '') +
        '<button class="btn know" id="frJa"></button>' +
        '<button class="btn ghost" id="frNein"></button>' +
      '</div>';
    kasten.querySelector('#frJa').textContent = ja;
    kasten.querySelector('#frNein').textContent = nein;
    document.body.appendChild(kasten);
    const schliesse = w => { kasten.remove(); frageSchliessen = null; fertig(w); };
    frageSchliessen = () => schliesse(false);
    kasten.querySelector('#frJa').addEventListener('click', ()=>schliesse(true));
    kasten.querySelector('#frNein').addEventListener('click', ()=>schliesse(false));
    // Daneben tippen heißt Nein – wie überall sonst auch
    kasten.addEventListener('click', e=>{ if(e.target === kasten) schliesse(false); });
  });
}

/* Wie frage(), aber mit einem Eingabefeld. Liefert den Text oder null.
   Gebraucht wird das einmal: für den versteckten Schalter der dauerhaften
   Vollversion. prompt() täte es auch, sieht aber nach Browser aus. */
function frageWort(titel, text){
  if(frageSchliessen) return Promise.resolve(null);
  return new Promise(fertig => {
    const kasten = document.createElement('div');
    kasten.className = 'nachfrage';
    kasten.innerHTML =
      '<div class="nachfragebox">' +
        '<h3>' + esc(titel) + '</h3>' +
        (text ? '<div class="txt">' + esc(text) + '</div>' : '') +
        '<input class="field" id="frWort" type="text" autocomplete="off" ' +
               'autocapitalize="none" autocorrect="off" spellcheck="false">' +
        '<button class="btn know" id="frOk">Weiter</button>' +
        '<button class="btn ghost" id="frAb">Abbrechen</button>' +
      '</div>';
    document.body.appendChild(kasten);
    const feld = kasten.querySelector('#frWort');
    const schliesse = w => { kasten.remove(); frageSchliessen = null; fertig(w); };
    frageSchliessen = () => schliesse(null);
    kasten.querySelector('#frOk').addEventListener('click', ()=>schliesse(feld.value));
    kasten.querySelector('#frAb').addEventListener('click', ()=>schliesse(null));
    // Eingabetaste wie Weiter – sonst sucht man auf dem Handy den Knopf
    feld.addEventListener('keydown', e=>{ if(e.key === 'Enter') schliesse(feld.value); });
    kasten.addEventListener('click', e=>{ if(e.target === kasten) schliesse(null); });
    // Erst nach dem Einhängen, sonst öffnet sich die Tastatur nicht
    setTimeout(()=>feld.focus(), 50);
  });
}


/* ===================== Die Vollversion als Abo =====================
   Gekauft wird bei Google, nicht bei uns. Das eigene Plugin ZmajAbo spricht
   mit der Play-Abrechnung; warum selbst geschrieben und welche Fallen darin
   umgangen sind, steht ausführlich in ZmajAbo.java.

   Wichtigste Regel hier oben: Google ist die einzige Wahrheit. Der gemerkte
   Stand im Gerätespeicher wird NUR überschrieben, wenn Google wirklich
   geantwortet hat. Sonst säße ein zahlender Nutzer im Flugzeug plötzlich
   wieder vor Werbung. */
const aboPlugin = () => (window.Capacitor && window.Capacitor.Plugins
                         && window.Capacitor.Plugins.ZmajAbo) || null;
function vollversionGemerkt(){
  try{ return localStorage.getItem(VOLL_SCHLUESSEL) === '1'; }catch(e){ return false; }
}
let aboLaeuft = false;        // gerade eine Abfrage oder ein Kauf unterwegs
let aboStoerung = false;      // Play Store hat zuletzt nicht geantwortet
/* Google hat geantwortet, kennt die Produkte aber nicht. Das ist etwas
   anderes als eine Stoerung: hier ist die Antwort eindeutig, es gibt gerade
   nichts zu kaufen. Solange die Abos in der Play Console nicht angelegt und
   freigeschaltet sind, ist das der Normalfall. */
let aboProdukteFehlen = false;

function vollMeldung(text){
  const el = $('setVollNote'); if(!el) return;
  el.textContent = text || '';
}
function vollZeileZeigen(){
  const box = $('setVollBox'); if(!box) return;
  const an = premium;
  /* Zeigen, wenn es etwas zu kaufen gibt ODER die Vollversion schon laeuft.
     Das "kaufbar" muss hier noch einmal geprueft werden: diese Funktion
     laeuft auch am PC, wo es das Plugin gar nicht gibt - ohne die Pruefung
     wuerde der Block dort auftauchen. */
  box.style.display = ((!!aboPlugin()) && (an || !aboProdukteFehlen)) ? '' : 'none';
  const s = $('swVoll');
  s.setAttribute('aria-checked', an);
  /* aria-disabled statt disabled: ein disabled-Knopf nimmt keinen Tipp mehr
     an - der Tipp soll aber zu Googles Abo-Seite führen. */
  s.setAttribute('aria-disabled', an);
  $('setVollStand').textContent = an ? t('voll.aktiv')
    : (geschenkLaeuft() ? t('voll.geschenk_rest', {n: geschenkRest()})
    : (aboLaeuft ? t('voll.laedt') : (aboStoerung ? t('voll.kein_store') : '')));
  const v = $('setVollVerwalten');
  /* Auch bei einer Störung zeigen: wer zahlt, aber gerade keine Antwort vom
     Play Store bekommt, fände sonst keinen Kündigungsweg - und einen in der
     App verlangt Google. */
  v.style.display = (an || aboStoerung) ? '' : 'none';
  $('aboVerwalten').textContent = t('voll.verwalten');
  const w = $('widerrufKnopf');
  if(w) w.textContent = t('set.widerruf_knopf');
}
/* Fragt Google. Ändert den gemerkten Stand nur bei einer echten Antwort. */
async function vollAbgleichen(){
  const P = aboPlugin(); if(!P) return;
  aboLaeuft = true; vollZeileZeigen();
  let d = null;
  try{ d = await P.stand(); }catch(e){}
  aboLaeuft = false;
  if(d && d.bekannt){
    aboStoerung = false;
    /* Nicht nur die Leben: mit der Vollversion gehen auch ihre Stuecke
       an oder aus. Ohne das neue Zeichnen funkelte der Drache nach dem
       Auslaufen weiter, bis der Nutzer den Schirm wechselte. */
    if(!!d.aktiv !== premium){
      vollversionMerken(!!d.aktiv); renderLives(); drachenNeu(); renderLaden();
    }
  }else{
    aboStoerung = true;   // gemerkten Stand stehen lassen
  }
  vollZeileZeigen();
}
/* Fragt einmal nach, ob es ueberhaupt etwas zu kaufen gibt.

   Ohne diese Abfrage stuende der Block da und meldete erst beim Antippen
   einen Fehler. Sie kostet nichts Sichtbares: Play Billing beantwortet sie
   vom Geraet aus, und wenn sie schiefgeht, bleibt alles, wie es war -
   lieber ein Block zu viel als einer zu wenig. */
async function produkteNachsehen(){
  const P = aboPlugin(); if(!P || premium) return;
  let d = null;
  try{ d = await P.preise(); }catch(e){ return; }
  if(!d || !d.ok) return;                      // keine Antwort: nichts aendern
  aboProdukteFehlen = !d.plaene || !d.plaene.length;
  vollZeileZeigen();
}

/* Die Auswahl Monat oder Jahr. Preise und Zeiträume kommen von Google. */
async function vollWahlZeigen(){
  const P = aboPlugin(); if(!P || aboLaeuft) return;
  aboLaeuft = true; vollMeldung(''); vollZeileZeigen();
  let d = null;
  try{ d = await P.preise(); }catch(e){}
  aboLaeuft = false; vollZeileZeigen();
  if(d && d.ok && (!d.plaene || !d.plaene.length)){
    /* Eindeutige Antwort: es gibt nichts zu kaufen. Keine Fehlermeldung -
       der Block geht einfach weg. */
    aboProdukteFehlen = true; aboStoerung = false; vollZeileZeigen(); return;
  }
  if(!d || !d.ok){
    aboStoerung = true; vollZeileZeigen(); vollMeldung(t('voll.fehler')); return;
  }
  aboStoerung = false; aboProdukteFehlen = false;
  /* Erst hier der Kaufkasten - und nur, wenn die Einstellungen noch offen
     sind. Google braucht fuer preise() eine bis mehrere Sekunden; wer in
     dieser Zeit mit der Zurueck-Taste weiterging, bekam "Vollversion holen"
     mit "Zahlungspflichtig abonnieren" ueber den Lernpfad gelegt, samt
     frageSchliessen: die Zurueck-Taste schloss danach erst diesen Kasten
     statt das, was er vor sich hatte. Googles Antwort ist oben trotzdem
     ausgewertet, nur gefragt wird nicht mehr. Gefunden am 26.09.2026. */
  if(!sichtbar('settingsView')) return;
  const hol = id => d.plaene.find(p => p.plan === id) || {};
  const monat = hol('monat'), jahr = hol('jahr');
  /* Die Ersparnis rechnet die App aus, damit sie in jeder Währung stimmt.
     Nur zeigen, wenn beide Preise da sind und es wirklich günstiger ist. */
  let sparen = 0;
  if(monat.micros && jahr.micros){
    sparen = Math.round(100 - (jahr.micros / 12) / monat.micros * 100);
  }
  /* Was das Jahr im Monat kostet. Google liefert nur den Jahrespreis,
     und 19,99 durch zwoelf rechnet im Laden niemand nach. Die Waehrung
     kommt aus derselben Antwort, damit es in jedem Land stimmt. */
  let proMonat = '';
  if(jahr.micros && jahr.waehrung){
    try{
      proMonat = new Intl.NumberFormat(undefined, {style: 'currency', currency: jahr.waehrung})
                   .format(jahr.micros / 12 / 1000000);
    }catch(e){ proMonat = ''; }
  }
  /* Die Karte WAEHLT nur aus. Gekauft wird mit dem Knopf darunter, und der
     heißt "Zahlungspflichtig abonnieren".

     Das ist kein Schönheitsfehler: § 312j Abs. 3 BGB verlangt für eine
     zahlungspflichtige Bestellung genau diese oder eine gleich eindeutige
     Beschriftung, und nach EuGH C-249/21 zählt allein der Text auf der
     Schaltfläche - nicht, was daneben oder darüber steht. Das OLG
     Düsseldorf hat am 08.02.2024 entschieden, dass "Abonnieren" oder
     "Weiter zur Zahlung" dafür nicht reichen. Eine Karte mit "Jährlich" und
     einem Preis erst recht nicht. */
  const karte = (p, name, abzeichen, zweite) =>
    '<button type="button" class="abokarte" role="radio" aria-checked="false"'+
      ' data-plan="'+esc(p.plan)+'"'+(p.preis?'':' disabled')+'>'+
      '<span><span class="n">'+esc(name)+'</span>'+
        (abzeichen || zweite ? '<br><span class="abospar">'+esc(abzeichen)+
          (zweite ? '<span class="promonat">'+esc(zweite)+'</span>' : '')+'</span>' : '')+'</span>'+
      '<span class="p">'+esc(p.preis || '–')+'</span>'+
    '</button>';
  const kasten = document.createElement('div');
  kasten.className = 'nachfrage';
  kasten.innerHTML =
    '<div class="nachfragebox">' +
      '<h3>'+esc(t('voll.wahl_titel'))+'</h3>' +
      '<div class="abovorschau">' + zmaj('cheer') +
        '<div class="wort">' + esc(t('voll.so_koenntest_du')) + '</div></div>' +
      '<div class="txt">'+esc(t('voll.wahl_text'))+'</div>' +
      '<div class="abowahl" role="radiogroup">' +
        karte(monat, t('voll.monat'), '', '') +
        karte(jahr, t('voll.jahr'),
              sparen > 0 ? tp('voll.sparen', sparen) : '',
              proMonat ? t('voll.pro_monat', {preis: proMonat}) : '') +
      '</div>' +
      '<div class="abohinweis">'+esc(t('voll.hinweis'))+'</div>' +
      '<button class="btn know" id="aboKauf"></button>' +
      '<button class="btn ghost" id="aboZu"></button>' +
    '</div>';
  kasten.querySelector('#aboKauf').textContent = t('voll.kaufen');

/* Fünf Zustände in einer Maske:
     'anmelden'   E-Mail oder Benutzername + Passwort + angemeldet bleiben
     'neu'        Benutzername + E-Mail + Passwort + Wiederholung
     'warten'     Konto steht, die Bestätigungsmail ist unterwegs
     'vergessen'  E-Mail eingeben, Link anfordern
     'neupw'      neues Passwort setzen (über den Link aus der Mail)
   Das Passwort verlässt den Browser nur beim Absenden und wird nirgends
   gespeichert. Die Anmeldung merkt sich der Server über ein Cookie, an das
   dieses Skript nicht herankommt. */
let kontoModus = 'anmelden';
let kontoMail = '';      // Adresse des angemeldeten Kontos, nur zum Anzeigen
let kontoCode = '';        // Code aus dem Link, nur für 'neupw'
let kontoWartetAuf = '';   // Adresse, an die die Bestätigung ging

                 warten:'konto.warten_titel', vergessen:'konto.vergessen_titel',
                 neupw:'konto.neupw_titel'}[m];
  const frage = {anmelden:'konto.anmelden_frage', neu:'konto.anlegen_frage',
                 warten:'konto.warten_frage', vergessen:'konto.vergessen_frage',

  // Ohne bekannte Adresse stünde da "Wir haben eine Mail an  geschickt" -

  $('kontoFrage').textContent = t(frageJetzt, {email: kontoWartetAuf});
