/* Dieselben Regeln wie in konten.py. Verbindlich ist immer der Server;
   hier stehen sie nur, damit man beim Tippen sieht, was noch fehlt. */
const PW_MIN = 10;
const PW_REGELN = [
  ['passwort_kurz',    'konto.regel_laenge',  p => p.length >= PW_MIN],
  ['passwort_gross',   'konto.regel_gross',   p => /\p{Lu}/u.test(p)],
  ['passwort_klein',   'konto.regel_klein',   p => /\p{Ll}/u.test(p)],
  ['passwort_zahl',    'konto.regel_zahl',    p => /\p{Nd}/u.test(p)],
  ['passwort_zeichen', 'konto.regel_zeichen', p => /[^\p{L}\p{N}\s]/u.test(p)],
  ['passwort_leerzeichen', 'konto.regel_leer', p => !/\s/.test(p)]
];

function zeigeRegeln(kasten, passwort){
  kasten.innerHTML = '<b>'+esc(t('konto.regeln_titel'))+'</b>' +
    PW_REGELN.map(([, schluessel, erfuellt]) =>
      '<span class="'+(erfuellt(passwort)?'ok':'')+'">'+
      esc(t(schluessel, {n: PW_MIN}))+'</span>').join('');
}

/* Serverfehler in einen Satz übersetzen, den man lesen kann. */
function kontoFehlerText(fehler){
  const f = String(fehler||'');
  if(f.startsWith('gesperrt:')) return t('konto.fehler_gesperrt', {zeit: fmtDauer(parseInt(f.slice(9),10)||60)});
  return ({
    falsche_daten:   t('konto.fehler_daten'),
    passwort_kurz:   t('konto.fehler_kurz', {n: PW_MIN}),
    passwort_lang:   t('konto.fehler_lang'),
    passwort_gross:  t('konto.fehler_gross'),
    passwort_klein:  t('konto.fehler_klein'),
    passwort_zahl:   t('konto.fehler_zahl'),
    passwort_zeichen:t('konto.fehler_zeichen'),
    passwort_leerzeichen: t('konto.fehler_pw_leerzeichen'),
    name_vergeben:   t('konto.fehler_vergeben'),
    name_fehlt:      t('konto.fehler_name'),
    name_kurz:       t('konto.fehler_name_kurz', {n: 3}),
    name_lang:       t('konto.fehler_name_lang', {n: 20}),
    name_zeichen:    t('konto.fehler_name_zeichen'),
    name_leerzeichen:t('konto.fehler_name_leerzeichen'),
    email_fehlt:     t('konto.fehler_email'),
    email_ungueltig: t('konto.fehler_email'),
    email_vergeben:  t('konto.fehler_email_vergeben'),
    email_offen:     t('konto.fehler_email_offen'),
    code_ungueltig:  t('konto.fehler_code'),
    altes_falsch:    t('konto.fehler_alt'),
    nicht_angemeldet: t('konto.fehler_daten')
  })[f] || t('konto.fehler_allgemein');
}

/* Sekunden als "3 Minuten" oder "40 Sekunden" */
function fmtDauer(sek){
  const m = Math.ceil(sek/60);
  return m >= 1 ? tp('zeit.min_lang', m) : tp('zeit.sekunden', Math.max(1, sek));
}

$('kontoWechsel').addEventListener('click', ()=> zeigeAnmeldung(kontoModus==='anmelden' ? 'neu' : 'anmelden'));

$('kontoForm').addEventListener('submit', async e=>{
  e.preventDefault();
  const m    = kontoModus;
  const name = $('kontoName').value.trim();
  const adr  = $('kontoMail').value.trim();
  const pw   = $('kontoPw').value;
  const pw2  = $('kontoPw2').value;
  const bleiben = $('kontoBleiben').checked;
  const note = $('kontoNote');
  note.className = 'note';

  // --- vorab prüfen, was der Browser schon weiß ---
  if((m==='anmelden' || m==='neu' || m==='vergessen') && !name){
    note.textContent = t(m==='vergessen' ? 'konto.fehler_email' : 'konto.fehler_name'); return;
  }
  if(m==='neu'){
    const nf = nameFehler(name);
    if(nf){ note.textContent = kontoFehlerText(nf); return; }
    if(!/^[^@\s]+@[^@\s.]+(\.[^@\s.]+)+$/.test(adr)){
      note.textContent = t('konto.fehler_email'); return;
    }
  }
  if(m==='neu' || m==='neupw'){
    const fehlt = PW_REGELN.find(([, , erfuellt]) => !erfuellt(pw));
    if(fehlt){ note.textContent = kontoFehlerText(fehlt[0]); return; }
    if(pw !== pw2){ note.textContent = t('konto.fehler_wdh'); return; }
  }

  const knopf = $('kontoSenden');
  knopf.disabled = true; note.textContent = t('konto.laeuft');
  try{
    if(m==='neu'){
      const d = await postJSON('/api/konto/anlegen', {name, email: adr, passwort: pw});
      if(!d.ok){ note.textContent = kontoFehlerText(d.fehler); return; }
      kontoWartetAuf = adr;
      zeigeAnmeldung('warten', {behalteName: true, hinweis: d.mail_raus ? '' : t('konto.testbetrieb')});
      $('kontoName').value = name;
      return;
    }
    if(m==='anmelden'){
      const d = await postJSON('/api/konto/anmelden', {kennung: name, passwort: pw, bleiben});
      if(d.ok){ await nachAnmeldung(d); return; }
      if(d.fehler === 'email_offen'){
        kontoWartetAuf = '';
        zeigeAnmeldung('warten', {behalteName: true, hinweis: t('konto.fehler_email_offen')});
        $('kontoName').value = name;
        return;
      }
      note.textContent = kontoFehlerText(d.fehler);
      return;
    }
    if(m==='warten'){
      const d = await postJSON('/api/konto/mail_neu', {kennung: name});
      note.textContent = t('konto.warten_nochmal_raus');
      note.className = 'note feedback ok';
      return;
    }
    if(m==='vergessen'){
      await postJSON('/api/konto/vergessen', {kennung: name});
      // Immer dieselbe Antwort, auch wenn es die Adresse nicht gibt
      note.textContent = t('konto.vergessen_raus');
      note.className = 'note feedback ok';
      $('kontoSpam').hidden = false;      // jetzt gibt es etwas zu suchen
      return;
    }
    if(m==='neupw'){
      const d = await postJSON('/api/konto/neues_passwort', {code: kontoCode, neu: pw, bleiben});
      if(d.ok){ kontoCode=''; geschichteAufraeumen(); await nachAnmeldung(d); return; }
      note.textContent = kontoFehlerText(d.fehler);
      return;
    }
  }catch(err){
    note.textContent = t('konto.fehler_allgemein');
  }finally{
    knopf.disabled = false;
  }
});

/* Dieselben Regeln wie konten.pruefe_name() auf der Serverseite. */
function nameFehler(n){
  if(!n) return 'name_fehlt';
  if(/\s/.test(n)) return 'name_leerzeichen';
  if(n.length < 3) return 'name_kurz';
  if(n.length > 20) return 'name_lang';
  if(!/^[\p{L}\p{N}\-_.]+$/u.test(n) || !/[\p{L}\p{N}]/u.test(n)) return 'name_zeichen';
  return '';
}

/* Kleiner Helfer, damit jeder Aufruf gleich aussieht. */
async function postJSON(pfad, koerper){

                               body: JSON.stringify(koerper||{})});
  try{ return await r.json(); }catch(e){ return {ok:false, fehler:'kaputt'}; }
}

/* Bis Version 0.9 merkte sich die App nur das bosnische Wort. Jetzt merkt sie
   sich „bedeutung:wort“, also „hundert:sto“ und „tisch:sto“ getrennt.
   Alter Fortschritt wird beim ersten Öffnen umgeschrieben und geht dabei
   nicht verloren. Erkannt werden beide früheren Schreibweisen: das nackte
   Wort und die Zwischenform „level:wort“. */
function altenFortschrittUmschreiben(){
  const gueltig = new Set(), nachWort = new Map(), nachLevel = new Map();
  CATEGORIES.forEach(c => c.words.forEach(w => {
    gueltig.add(w.id);
    if(!nachWort.has(w.bs)) nachWort.set(w.bs, []);
    nachWort.get(w.bs).push(w.id);
    nachLevel.set(c.id + ':' + w.bs, w.id);
  }));
  const neu = new Set(); let geaendert = false;
  known.forEach(x => {
    if(gueltig.has(x)) neu.add(x);
    else if(nachLevel.has(x)){ neu.add(nachLevel.get(x)); geaendert = true; }
    else if(nachWort.has(x)){ nachWort.get(x).forEach(id => neu.add(id)); geaendert = true; }
    else if(nachWort.has(x.slice(x.lastIndexOf(':') + 1))){
      /* Die Kennung eines Wortes ist "deutsch:bosnisch" (start.py). Wird die
         deutsche Seite berichtigt - "Notarzt" war für "hitna pomoć" falsch,
         das ist der Rettungsdienst -, ändert sich damit die Kennung, und ein
         gelerntes Wort gälte plötzlich wieder als ungelernt. Der bosnische
         Teil bleibt. Also am LETZTEN Doppelpunkt trennen: zehn deutsche
         Einträge enthalten selbst einen ("Anrede: Bruder!"), kein einziger
         bosnischer. Geprüft über alle 1108 Wörter. */
      nachWort.get(x.slice(x.lastIndexOf(':') + 1)).forEach(id => neu.add(id));
      geaendert = true;
    }
    else neu.add(x);          // unbekannt, zum Beispiel ein gelöschtes Wort
  });
  if(geaendert) known = neu;
  return geaendert;
}

function showSettings(){
  showView('settingsView'); $('kopfLeiste').style.display='none';
  setzeZurueck(t('btn.zurueck'), showHome);
  $('tag').textContent=t('btn.einstellungen');
  // Werbung: Die Zeile erscheint erst, wenn wirklich geworben wird oder
  // schon einmal gefragt wurde. Vorher gäbe es nichts zu ändern.
  // Mit AdMob verwaltet Google die Antwort, und Google sagt auch, ob ein
  // Knopf zum Ändern verlangt ist - außerhalb der EU ist er das nicht.
  /* Nur EIN Bedienelement fuer die Werbung. Ajdin am 18.09.2026: vorher
     standen zwei untereinander und man wusste nicht, welches nun gilt.
     Wo AdMob laeuft und Google einen eigenen Knopf verlangt, gehoert die
     Einwilligung Google - unser Schalter duerfte sie dort gar nicht selbst
     umstellen. Dann steht Googles Zeile da, und sonst nichts. Ueberall sonst,
     am PC und ohne AdMob, steht unser Schalter, und der wirkt sofort. */
  /* Die Vollversion nur dort, wo man sie auch kaufen kann - also nur mit
     dem Abo-Plugin, nicht im Browser am PC. */
  const kaufbar = !!aboPlugin();
  $('setVollBox').style.display = kaufbar ? '' : 'none';
  if(kaufbar){ vollMeldung(''); vollZeileZeigen(); vollAbgleichen(); produkteNachsehen(); }
  /* Wer die Vollversion hat, sieht gar keine Werbung mehr - dann ist auch
     der Schalter zur Werbe-Einwilligung gegenstandslos. */
  const zeigen = !unlimited()
    && (WERBUNG_ECHT || EINWILLIGUNG_TEST || einwilligungGueltig() || admobDa());
  $('setWerbungBox').style.display = zeigen ? '' : 'none';
  if(zeigen){ werbungZeileZeigen(); werbungAbgleichen(); }
  /* Punkt 8 aus WERBUNG_PRUEFUNG.md: gegenstandslos ist der SCHALTER, nicht
     der Widerruf. Eine frueher als Gratisnutzer erteilte Einwilligung liegt
     weiter in Googles Speicher, und sie muss sich so leicht zuruecknehmen
     lassen, wie sie gegeben wurde - die Datenschutzerklaerung verspricht das
     in acht Sprachen. Deshalb eine eigene Zeile, nur auf dem Geraet: am PC
     gibt es Googles Fenster gar nicht. */
  const widerrufBox = $('setWiderrufBox');
  if(widerrufBox){
    const P = window.Capacitor && window.Capacitor.Plugins;
    widerrufBox.style.display = (unlimited() && P && P.AdMob) ? '' : 'none';
    $('setWiderrufStand').textContent = t('set.einwilligung_google');
  }
  renderLangSel();
}
/* ---- Laden ----
   Münzen kommen aus den Tagesaufgaben. Die Vollversion gibt es hier
   ausdrücklich NICHT: `premium` darf der Browser nie setzen, der Server holt
   es immer aus der Datei zurück. Und die Abos sind die einzige Einnahme. */
/* Welcher Reiter offen ist. Gekauft wird auch ausserhalb des Ladens - vom
   Bildschirm ohne Leben aus -, deshalb steht der Wert hier draussen. */
let ladenReiter = 'vorrat', ladenOffen = false;
function renderLaden(){
  const box=$('ladenWaren'); if(!box) return;
  renderLives();                      // die Muenzzahl oben stimmt sonst nach einem Kauf nicht
  /* Fuenf Reiter nebeneinander brachen auf schmalen Geraeten in zwei Zeilen
     um und sahen zerfasert aus. Jetzt dieselbe Aufklappliste wie bei der
     Sprachwahl: eine Zeile, egal wie viele Gruppen es gibt.
     Ajdin am 18.09.2026. */
  const kopf = $('ladenKopf'), liste = $('ladenListe');
  if(kopf && liste){
    const jetzt = GRUPPEN.find(g => g.id === ladenReiter) || GRUPPEN[0];
    kopf.innerHTML = '<span>'+esc(t(jetzt.titel))+'</span><span class="pfeil" aria-hidden="true">\u25be</span>';
    kopf.setAttribute('aria-expanded', ladenOffen);
    liste.hidden = !ladenOffen;
    liste.innerHTML = GRUPPEN.map(g =>
        '<button type="button" class="sprachzeile'+(g.id===ladenReiter?' jetzt':'')+'" data-gruppe="'+g.id+'">'
      + esc(t(g.titel)) + (g.id===ladenReiter ? ' <span class="haken">\u2713</span>' : '') + '</button>').join('');
    kopf.onclick = ()=>{ ladenOffen = !ladenOffen; renderLaden(); };
    liste.querySelectorAll('.sprachzeile').forEach(b => b.onclick = ()=>{
      ladenOffen = false; ladenReiter = b.dataset.gruppe; renderLaden();
    });
  }
  /* Bei den Farben ein Tupfer neben dem Namen: sonst muesste man kaufen, um
     zu sehen, wovon die Rede ist. */
  const tupfer = w => FARBEN[w.id]
    ? '<span class="farbtupfer" style="background:#'+FARBEN[w.id][0]+'"></span>' : '';
  const zeile = (w, knopf, extra) =>
    '<div class="ware'+(extra ? ' '+extra : '')+'"><div><div class="wt">'+tupfer(w)+t(w.titel)+'</div>'+
    '<div class="wd">'+t(w.sub)+'</div></div>'+knopf+'</div>';
  const preisKnopf = w => {
    const geht = muenzen() >= w.preis && w.geht();
    return '<button class="btn kauf '+(geht?'know':'ghost')+'" data-ware="'+w.id+'"'+
           (geht?'':' disabled')+'>🪙 '+w.preis+'</button>';
  };
  /* Ein Stueck der Vollversion hat keinen Preis. Laeuft sie, steht dort
     Tragen oder Abnehmen wie bei gekaufter Ware; laeuft sie nicht, ein
     grauer Knopf, der in die Einstellungen fuehrt.
     Gibt es dort nichts zu holen - kein Abo-Plugin wie im Browser am PC,
     oder Google kennt die Produkte noch nicht -, blendet showSettings()
     den ganzen Vollversions-Block aus. Dann fuehrte der Knopf ins Leere,
     und im Reiter Effekte war er der einzige. Jetzt steht er dort
     ausgegraut: nichts zu tun, aber auch kein falsches Versprechen.
     Dieselbe Bedingung benutzen vollZeileLaden() und vollZeileLeben().
     Gefunden in der Gegenpruefung am 29.09.2026. */
  const tragenKnopf = w => '<button class="btn kauf '+(traegt(w.id)?'know':'ghost')+'" data-tragen="'+w.id+'">'+
        t(traegt(w.id) ? 'laden.abnehmen' : 'laden.tragen')+'</button>';
  const vollKnopf = () => (!aboPlugin() || aboProdukteFehlen)
    ? '<button class="btn kauf ghost" disabled>'+t('laden.nur_voll')+'</button>'
    : '<button class="btn kauf ghost" data-vollstueck="1">'+t('laden.nur_voll')+'</button>';
  const zierratZeile = w => w.voll
    ? zeile(w, unlimited() ? tragenKnopf(w) : vollKnopf())
    : (besitz.has(w.id) ? zeile(w, tragenKnopf(w)) : zeile(w, preisKnopf(w)));
  /* Beim Herz steht neben dem Preis auch das freiwillige Video - der Laden
     ist die Stelle, an der man nach "auffuellen" sucht. Eigenes
     Tageskontingent, siehe WERBUNG_MAX_LOHN.
     Der Knopf steht IMMER da und wird nur ausgegraut, genau wie der
     Preisknopf. Vorher verschwand er ganz, wenn die Leben voll waren - dann
     stand der Preis grau daneben und das Video gar nicht, und es sah aus, als
     gaebe es den Weg nicht. Ajdin am 27.09.2026: "hae im laden ist noch kein
     werbung ansehen balken" - er hatte funf von funf Leben. */
  const videoKnopf = w => {
    const geht = w.geht() && werbungErlaubt(true);
    return '<button class="btn kauf ' + (geht ? 'know' : 'ghost') + '" data-videoleben="1"'
         + (geht ? '' : ' disabled') + '>' + t('werbung.leben_holen') + '</button>';
  };
  const knoepfe = w => w.id === 'herz'
    ? '<span class="kaufwege">' + preisKnopf(w) + videoKnopf(w) + '</span>'
    : preisKnopf(w);
  /* Die Vollversion ganz oben im Vorrat. Sie ist das Einzige im Laden,
     das es NICHT fuer Muenzen gibt - gekauft wird bei Google -, und
     genau deshalb sucht sie dort niemand. Der Knopf fuehrt in die
     Einstellungen, wo der Kauf steht. Ajdin am 29.09.2026: „im laden
     noch eine anzeige hinbauen dann sieht man es eindeutig“. */
  const vollZeileLaden = () => {
    if(unlimited() || !aboPlugin() || aboProdukteFehlen) return '';
    return '<div class="ware"><div><div class="wt">' + esc(t('voll.wahl_titel')) + '</div>'
         + '<div class="wd">' + esc(t('lektion.vollversion')) + '</div></div>'
         + '<button class="btn kauf know" id="ladenVoll">' + esc(t('laden.voll_knopf'))
         + '</button></div>';
  };
  box.innerHTML = ladenReiter === 'vorrat'
    ? vollZeileLaden() + VERBRAUCH.map(w => zeile(w, knoepfe(w), w.id === 'herz' ? 'zweiwege' : '')).join('')
    : ZIERRAT.filter(w => w.gruppe === ladenReiter).map(zierratZeile).join('');
  box.querySelectorAll('button[data-ware]').forEach(b =>
    b.addEventListener('click', ()=> kaufe(b.dataset.ware)));
  box.querySelectorAll('button[data-tragen]').forEach(b =>
    b.addEventListener('click', ()=> trage(b.dataset.tragen)));
  const vk = box.querySelector('button[data-videoleben]');
  if(vk && !vk.disabled) vk.addEventListener('click', werbungFuerLeben);
  const lv = box.querySelector('#ladenVoll');
  if(lv) lv.addEventListener('click', ()=>{ showSettings(); });
  box.querySelectorAll('button[data-vollstueck]').forEach(b =>
    b.addEventListener('click', ()=>{ showSettings(); }));
}
/* Anziehen oder ausziehen. Aus jeder Gruppe sitzt hoechstens ein Stueck:
   eine zweite Muetze schiebt die erste herunter. Ein zweites Mal auf
   dasselbe tippen nimmt es ab. */
function trage(id){
  if(!besitz.has(id) && !(istVollStueck(id) && unlimited())) return;
  const g = gruppeVon(id);
  const runter = traegt(id);
  // Rohe Liste: siehe getragenRoh(). Sonst faellt hier heraus, was das
  // abgelaufene Abo gerade verdeckt, und kommt nie wieder.
  const rest = getragenRoh().filter(x => x !== id && gruppeVon(x) !== g);
  setzeGetragen(runter ? rest : rest.concat([id]));
  sound(runter ? 'ablegen' : 'anziehen');
  renderLaden(); drachenNeu();
}
/* Nach dem Wechsel muss die Animation neu geladen werden - jedes Stueck
   steckt in einer eigenen Datei. */
function drachenNeu(){
  document.querySelectorAll('.zmaj-anim').forEach(el=>{
    if(el._anim){ try{ el._anim.destroy(); }catch(e){} el._anim = null; el._stand = null; el.innerHTML=''; }
    mountZmaj(el);
  });
}
function kaufe(id){
  const w = [...VERBRAUCH, ...ZIERRAT].find(x => x.id === id);
  if(!w || muenzen() < w.preis || !w.geht()) return;
  if(id==='herz'){
    syncLives();
    lives.anzahl = Math.min(LEBEN_MAX, lives.anzahl + 1);
    if(lives.anzahl >= LEBEN_MAX) lives.zeit = 0;
  } else if(id==='schutz'){
    schutz.anzahl = Math.min(SCHUTZ_MAX, schutzNow() + 1);
  } else {
    // Gekauftes wird gleich getragen - und schiebt das alte Stueck derselben
    // Gruppe herunter, nicht den ganzen uebrigen Zierrat.
    besitz.add(id);
    const g = gruppeVon(id);
    setzeGetragen(getragenRoh().filter(x => gruppeVon(x) !== g).concat([id]));
  }
  muenzenAus += w.preis;
  saveProgress(); sound('kauf');
  // Gekauft wird auch außerhalb des Ladens - vom Bildschirm ohne Leben aus.
  // Dort gibt es weder Notizzeile noch Warenliste, deshalb überall prüfen.
  if($('ladenNote')) $('ladenNote').textContent = t('laden.gekauft');
  if($('ladenWaren')) renderLaden();
  renderLives();
  if(ZIERRAT.some(x => x.id === id)) drachenNeu();
  if($('setSchutz')) $('setSchutz').textContent = tp('serie.schutz', schutzNow());
}

/* ===== Sicherung =====
   Ohne Server liegt der Lernstand nur im Speicher dieses Browsers. Geht das
   Handy kaputt oder wird die App geloescht, ist er weg. Deshalb zum
   Mitnehmen als Datei.

   Auf Android reicht ein gewoehnlicher Download NICHT - eine WebView laedt
   nichts herunter, der Knopf bliebe wirkungslos. Dort schreiben wir die
   Datei ueber Capacitor in den Zwischenspeicher und reichen sie ans
   Teilen-Menue weiter; der Nutzer schickt sie sich dann selbst zu oder legt
   sie in seine Cloud. Im Browser am PC bleibt es beim normalen Download. */
function sicherungInhalt(){
  return JSON.stringify({app:'zmaj', version:1,
                         datum:new Date().toISOString().slice(0,10),
                         stand:standAlsObjekt()}, null, 1);
}
function sicherungName(){ return 'zmaj-sicherung-' + new Date().toISOString().slice(0,10) + '.json'; }

async function sicherungSpeichern(){
  const note = $('sichNote'); note.textContent = '';
  const text = sicherungInhalt(), name = sicherungName();
  const P = window.Capacitor && window.Capacitor.Plugins;
  try{
    if(P && P.Filesystem && P.Share){
      await P.Filesystem.writeFile({path:name, data:text, directory:'CACHE', encoding:'utf8'});
      const ort = await P.Filesystem.getUri({path:name, directory:'CACHE'});
      await P.Share.share({title:t('set.sicherung'), url:ort.uri});
    } else {
      const a = document.createElement('a');
      const adresse = URL.createObjectURL(new Blob([text], {type:'application/json'}));
      a.href = adresse; a.download = name; a.click();
      setTimeout(()=>URL.revokeObjectURL(adresse), 4000);
    }
    /* Der Dateiname gehoert in die Meldung. Wo die Sicherung landet,
       entscheidet der Nutzer im Teilen-Menue - ohne den Namen weiss er
       hinterher nicht, wonach er in der Dateiverwaltung suchen soll.
       Aufgefallen am 25.09.2026 beim Pruefdurchlauf P12. Der Name ist
       sprachneutral, deshalb braucht es dafuer keinen neuen Text. */
    note.textContent = t('set.sicherung_ok') + ' ' + name; sound('ok');
  }catch(e){ note.textContent = t('set.sicherung_fehler'); }
}
async function sicherungEinlesen(datei){
  const note = $('sichNote'); note.textContent = '';
  let d;
  try{ d = JSON.parse(await datei.text()); }
  catch(e){ note.textContent = t('set.sicherung_keine'); return; }
  // typeof [] ist auch 'object'. Eine Datei mit "stand": [] kaeme sonst
  // durch und wuerde den Lernstand nicht ersetzen, sondern loeschen.
  if(!d || d.app !== 'zmaj' || !d.stand || typeof d.stand !== 'object' || Array.isArray(d.stand)){
    note.textContent = t('set.sicherung_keine'); return;
  }
  if(!await frage(t('set.sicherung'), t('set.sicherung_frage'),
                  t('btn.ersetzen'), t('btn.abbrechen'))) return;
  standUebernehmen(d.stand);
  /* Dieselbe Umschreibung wie beim normalen Start (nachAnmeldung). Die
     Kennung eines Wortes ist "bedeutung:wort"; wird eine deutsche Bedeutung
     berichtigt, aendert sich die Kennung mit. Eine Sicherung von vor der
     Berichtigung brachte darum Kennungen mit, die es nicht mehr gibt: die
     Woerter hatten keinen Lautsprecher mehr, die Levelbalken fielen zurueck,
     die naechste Lektion bot sie als neu an - und die Meldung darunter
     zaehlte sie ueber known.size trotzdem mit. Erst ein Neustart richtete es.
     Fall: hitna pomoc, "Notarzt" -> "Rettungsdienst". Gefunden am 26.09.2026. */
  altenFortschrittUmschreiben();
  seitNachEinlesen();
  /* Gleich nachsehen statt erst beim naechsten Kaltstart: die Sicherung
     kann einen viel frueheren Anfang mitbringen, und dann ist das Geschenk
     in diesem Augenblick faellig. */
  geschenkPruefen();
  syncLives(); pruefeSchutz();
  const gesichert = await saveProgress();
  renderLives();
  note.textContent = gesichert
    ? t('set.sicherung_geladen', {woerter: known.size, tage: days.size})
    : t('set.sicherung_fehler');
  sound(gesichert ? 'ok' : 'no');
}
$('sichSpeichern').addEventListener('click', sicherungSpeichern);

const ZMAJ_MAIL = 'zmaj.lernapp@gmail.com';

/* Ohne Server kann die App keine Mail verschicken - das kann nur das Geraet.
   Also oeffnen wir die Mail-App des Nutzers mit fertig ausgefuellter
   Nachricht. Kein fremder Dienst, keine zusaetzlichen Daten.
   Falls kein Mail-Programm eingerichtet ist, passiert sichtbar nichts -
   deshalb steht die Adresse danach zum Kopieren da. */
function feedbackPerMail(text){
  const betreff = 'Zmaj – ' + t('set.feedback');
  const fuss = '\n\n--\n' + (SPRACHE||'') + ' · ' + new Date().toISOString().slice(0,10);
  try{ location.href = 'mailto:' + ZMAJ_MAIL
        + '?subject=' + encodeURIComponent(betreff)
        + '&body=' + encodeURIComponent(text + fuss); }catch(e){}
  const kasten = $('fbNote');
  kasten.textContent = t('set.feedback_mail', {mail: ZMAJ_MAIL}) + ' ';
  const knopf = document.createElement('button');
  knopf.className = 'back'; knopf.type = 'button';
  knopf.textContent = t('set.feedback_kopieren');
  knopf.addEventListener('click', async ()=>{
    try{ await navigator.clipboard.writeText(ZMAJ_MAIL); knopf.textContent = t('set.feedback_kopiert'); }
    catch(e){ knopf.textContent = ZMAJ_MAIL; }
  });
  kasten.appendChild(knopf);
}
$('fbSend').addEventListener('click', async ()=>{
  const text=$('fbText').value.trim(); if(!text){ $('fbNote').textContent=t('set.feedback_leer'); return; }
  if(!MIT_SERVER){ feedbackPerMail(text); sound('ok'); return; }
  try{
    const r=await fetch('/api/feedback',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({profil, text})});
    const d=await r.json();
    if(d.ok){ $('fbText').value=''; $('fbNote').textContent=t('set.feedback_danke'); sound('ok'); }
    else $('fbNote').textContent = t('set.feedback_fehler');
  }catch(e){ feedbackPerMail(text); }
});

/* Der Pfad sprang frueher beim Oeffnen zur aktuellen Lektion. Das kam aus
   der Zeit vor dem Knopf "Weitermachen" oben, der genau dorthin fuehrt.
   Jetzt oeffnet der Pfad oben und bleibt dort - showView() setzt ohnehin
   window.scrollTo(0), gespart wird also nicht das Scrollen an sich,
   sondern der Sprung mitten in die Liste hinein.
   Ajdin am 29.09.2026: "braucht die app nicht zur aktuellsten stelle
   springen". */
function showPath(){
  $('tag').textContent=t('app.tag');
  const done = CATEGORIES.filter(c=>passed.has(c.id)).length;
  const nWords = CATEGORIES.reduce((n,c)=>n+c.words.length,0);
  $('summary').textContent = t('pfad.summary',{done:done, total:CATEGORIES.length, k:known.size, n:nWords})+(ALLE_FREI?t('pfad.testmodus'):'');
  /* Ajdin am 26.09.2026: "das braucht keiner ist platzverschwendung".
     Stimmt fuer den Alltag - wie weit die laufende Sektion ist, steht
     eine Handbreit tiefer in ihrer Karte. Im Testmodus bleibt die Zeile
     stehen, denn dort haengt der Hinweis "alles freigeschaltet" daran. */
  $('summary').style.display = ALLE_FREI ? '' : 'none';
  const box=$('sections'); box.innerHTML='';
  const next = firstOpen();
  /* Beim ersten Zeichnen ist die Sektion offen, in der gerade gelernt wird.
     Danach bleibt die stehen, die der Nutzer gewaehlt hat - auch nach einer
     Lektion. Erst wenn es sie nicht mehr gibt, faellt es zurueck. */
  const laufende = (CATEGORIES[next] || {}).sektion || (SECTIONS[0] || {}).id;
  /* Nur beim allerersten Zeichnen vorbelegen und dann, wenn die gewaehlte
     Sektion verschwunden ist. Ein leerer Merker heisst "alle zugeklappt" -
     das ist eine Wahl des Nutzers und wird nicht ueberschrieben. */
  if(offeneSektion === null || (offeneSektion && !SECTIONS.some(s => s.id === offeneSektion)))
    offeneSektion = laufende;
  SECTIONS.forEach((s, si)=>{
    const levels = CATEGORIES.map((c,i)=>({c,i})).filter(x=>x.c.sektion===s.id);
    if(!levels.length) return;
    const sdone = levels.filter(x=>passed.has(x.c.id)).length;
    const sopen = levels.some(x=>isUnlocked(x.i));
    const sec=document.createElement('div');
    /* sek1 bis sek9 geben die Farbe, eine je Sektion. Mit Rest
       gerechnet, damit eine zehnte wieder bei der ersten anfinge statt
       ohne Farbe dazustehen. */
    const auf = s.id === offeneSektion;
    sec.className='section sek'+(si % 9 + 1)+(sopen?'':' locked')+(auf?'':' zu');
    sec.dataset.sid = s.id;
    /* Der Kopf ist ein Knopf: anklickbar, mit der Tastatur erreichbar, und
       aria-expanded sagt an, was offen ist. Die Level stehen in einem
       eigenen Kasten, damit sich genau der ausblenden laesst. */
    sec.innerHTML =
      '<div class="skopf" role="button" tabindex="0" aria-expanded="'+(auf?'true':'false')+'">'+
        '<h2>'+esc(s.label)+'</h2><div class="desc">'+esc(s.beschreibung||'')+'</div>'+
        '<div class="sbar"><i style="width:'+Math.round(sdone/levels.length*100)+'%"></i></div>'+
        '<div class="scap">'+t('pfad.sektion_stand',{done:sdone, n:levels.length})+(sopen?'':t('pfad.sektion_gesperrt',{n:si}))+'</div>'+
      '</div><div class="levels"></div>';
    const kopf = sec.querySelector('.skopf');
    kopf.addEventListener('click', ()=> sektionAufklappen(s.id));
    kopf.addEventListener('keydown', e => {
      if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); sektionAufklappen(s.id); }
    });
    const levelKasten = sec.querySelector('.levels');
    levels.forEach(({c,i})=>{
      const b=document.createElement('button');
      const d=passed.has(c.id), o=isUnlocked(i), isCur=(i===next && !d), pct=levelPct(c);
      b.className='node'+(d?' done':'')+(isCur?' current':'')+(o?'':' locked');
      const extras = GRAMMAR[c.id]?t('pfad.grammatik'):'';
      b.innerHTML = '<div class="circle">'+(d?'✓':(o?(i+1):'🔒'))+'</div>'+
        '<div class="txt"><div class="label">'+esc(c.label)+'<span style="font-weight:600;font-size:12px;color:var(--muted)">'+esc(extras)+'</span></div><div class="tipp">'+esc(c.tipp||'')+'</div>'+
        (o && !d ? '<div class="mini"><i style="width:'+pct+'%"></i></div>' : '')+'</div>'+
        '<div class="state">'+(d?t('zustand.bestanden'):(isCur?t('zustand.jetzt'):(o?(pct>0?pct+' %':t('zustand.offen')):t('zustand.gesperrt'))))+'</div>';
      b.addEventListener('click',()=>{
        if(!isUnlocked(i)){ b.querySelector('.state').textContent=t('pfad.erst_level',{n:i}); return; }
        openLevel(i);
      });
      levelKasten.appendChild(b);
    });
    box.appendChild(sec);
  });
  /* Erst jetzt steht fest, welche Sektion auf welche folgt: leere werden
     oben uebersprungen. Die letzte zeigt auf sich selbst, ihr Streifen
     bleibt damit einfarbig.
     Weitergegeben wird "var(--sekN)", nicht der fertige Farbwert. Ein
     Blick mit getComputedStyle taete es nicht: der Browser loest --sek
     dort schon auf, und der Verlauf behielte beim Wechsel zwischen heller
     und dunkler Fassung unten die alte Farbe. */
  const mitFarbe = [].slice.call(box.querySelectorAll('.section'));
  const farbNr = el => (el.className.match(/sek(\d)/) || [0, '1'])[1];
  mitFarbe.forEach((el, i) => {
    const naechste = mitFarbe[i + 1] || el;
    el.style.setProperty('--sek-next', 'var(--sek' + farbNr(naechste) + ')');
  });
  geschenkNachreichen();
}

  $('sSummary').style.display = 'none';

function lookup(word, story){ const k=word.toLowerCase(); return (story.vokabeln||{})[k] || DICT[k] || null; }
function showStory(){
  const s = STORIES[rIdx]; if(!s) return;
  stilleBitte();          // beim Blättern zur nächsten Geschichte
  const lvl = byId(s.passt_zu);
  let html = '<div class="kicker" style="text-align:center">'+esc(s.stufe||'')+(lvl?t('gesch.kicker_passt',{label:esc(lvl.label)}):'')+(read.has(s.id)?t('gesch.kicker_gelesen'):'')+'</div>';
  const tokens = s.text.split(/([^\p{L}\p{M}'’-]+)/u);
  html += '<h3>'+esc(s.titel)+'</h3><div class="txt">'+tokens.map(x=> /[\p{L}\p{M}]/u.test(x) ? '<span class="w">'+esc(x)+'</span>' : esc(x)).join('')+'</div>';
  html += '<div class="bubble empty" id="rBubble" hidden></div>';
  html += '<div class="row"><button class="btn ghost" id="rTrans">'+t('gesch.zeigen')+'</button>'+
          '<button class="btn again" id="rListen">'+t('gesch.vorlesen')+'</button>'+
          '<button class="btn ghost" id="rStop" style="flex:0 0 54px" aria-label="'+esc(nurWort(t('gesch.stopp')))+'" hidden>\u23f9</button></div>';
  html += '<div class="tempo" id="rTempo"></div>';
  html += '<div class="trans" id="rTransText" hidden>'+esc(s.uebersetzung||'')+'</div>';
  html += '<div class="fragenblock" id="rQ"></div>';
  $('rBody').innerHTML = html;
  $('rBody').querySelectorAll('.w').forEach(w=>w.addEventListener('click',()=>{
    $('rBody').querySelectorAll('.w.on').forEach(x=>x.classList.remove('on')); w.classList.add('on');
    const wort = w.textContent;
    const bed = lookup(wort, s); const b=$('rBubble');
    b.hidden = false;
    b.className='bubble'; b.innerHTML = '<b>'+esc(wort)+'</b> '+(bed?esc(bed):'<span style="color:var(--muted)">'+t('gesch.kein_eintrag')+'</span>');
    /* Jeder Tipp schafft erst Ruhe. Sonst hinge es vom Wort ab, ob die
       laufende Geschichte abbricht oder weiterlaeuft - und das kann man
       sich nicht merken.
       Die Stelle wird aber vorher gesichert: stilleBitte() setzt
       currentTime auf null, und ohne diese zwei Zeilen begaenne die
       Geschichte danach wieder von vorn. */
    if(laeuftVor && spieler.src && spieler.currentTime > 0)
      geschichteStelle = {datei: spieler.src, sekunde: spieler.currentTime};
    stilleBitte();
    /* Das angetippte Wort gleich einzeln vorsprechen. Nur wenn es dafuer
       wirklich etwas gibt: fuer rund vier von zehn Woertern im Text liegt
       eine Aufnahme bereit, und eine Computerstimme hat die App-Huelle
       nicht. Sonst bliebe es stumm, und das Antippen fuehlte sich kaputt an
       - deshalb steht der Lautsprecher auch nur dann dabei. Er ist ein
       echter Knopf: nochmal hoeren, ohne das Wort im Text neu zu treffen. */
    if(hoerbar(wort)){
      /* task.hoeren, NICHT gesch.vorlesen: dieser Knopf spricht ein einzelnes
         Wort. Sobald eine Sprache aus dem Vorlese-Knopf "Hör die Geschichte"
         macht, stünde hier sonst etwas Falsches. */
      b.insertAdjacentHTML('beforeend', '<button type="button" class="wortton" aria-label="'+esc(nurWort(t('task.hoeren')))+'">🔊</button>');
      b.querySelector('.wortton').addEventListener('click', ()=>{ stilleBitte(); speak(wort); });
      speak(wort);
    }
  }));
  $('rTrans').addEventListener('click',()=>{ const box=$('rTransText'); box.hidden=!box.hidden; $('rTrans').textContent = box.hidden?t('gesch.zeigen'):t('gesch.verbergen'); });
  /* Der grosse Knopf macht drei Dinge nacheinander: vorlesen, anhalten,
     weiterlesen. Angehalten wird nicht zurueckgesetzt - es geht da weiter,
     wo es aufgehoert hat. Ajdin am 18.09.2026.
     Ganz abbrechen kann man mit dem kleinen Knopf daneben; der erscheint
     erst, wenn es etwas abzubrechen gibt. */
  geschichteStelle = null;   // neue Geschichte, alte Stelle gilt nicht mehr
  const knopfVor = $('rListen'), knopfStop = $('rStop');
  const wiederVorlesen = ()=>{
    knopfVor.textContent = t('gesch.vorlesen');
    knopfVor.classList.remove('laeuft');
    knopfStop.hidden = true;
  };
  knopfVor.addEventListener('click',()=>{
    if(pausiert){                      // angehalten -> an derselben Stelle weiter
      if(tonWeiter()){ knopfVor.textContent = t('gesch.pause'); knopfVor.classList.add('laeuft'); }
      return;
    }
    if(laeuftVor){                     // laeuft -> anhalten, Stelle merken
      if(tonPause()){ knopfVor.textContent = t('gesch.weiterlesen'); knopfVor.classList.remove('laeuft'); }
      else stilleBitte();              // nichts zum Anhalten da: sauber abstellen
      return;
    }
    stilleBitte();                     // ein angetipptes Wort koennte noch laufen
    /* Wurde fuer ein Wort unterbrochen, geht es dort weiter statt von vorn.
       Die Stelle gilt nur fuer dieselbe Aufnahme - nach einem Wechsel der
       Geschichte waere sie sinnlos. */
    const weiterAb = geschichteStelle;
    geschichteStelle = null;
    laeuftVor = wiederVorlesen;
    knopfVor.textContent = t('gesch.pause'); knopfVor.classList.add('laeuft');
    knopfStop.hidden = false;
    /* Die Marke unterscheidet Durchlaeufe: ein verspaeteter Rueckruf aus
       einem laengst abgestellten Lauf darf den naechsten nicht abwuergen. */
    const meinLauf = tonMarke;
    /* Zur gemerkten Sekunde springen, sobald die Aufnahme bereitsteht.
       speak() gibt kein Versprechen zurueck, auf das man warten koennte -
       deshalb ueber das Ereignis. loadedmetadata kommt, bevor der erste
       Ton hoerbar ist; bei playing haette man den Anfang schon gehoert.
       {once:true} raeumt den Horcher selbst weg, auch wenn nichts folgt.
       Geprueft wird beides: derselbe Durchlauf und dieselbe Datei. */
    if(weiterAb) spieler.addEventListener('loadedmetadata', ()=>{
      if(meinLauf === tonMarke && spieler.src === weiterAb.datei)
        try{ spieler.currentTime = weiterAb.sekunde; }catch(e){}
    }, {once:true});
    speak(s.text, ()=>{ if(meinLauf === tonMarke && laeuftVor === wiederVorlesen) stilleBitte(); });
  });
  /* Der kleine Knopf bricht wirklich ab - dann ist auch die gemerkte
     Stelle hinfaellig, sonst spraenge der naechste Start mittenhinein. */
  knopfStop.addEventListener('click', ()=>{ geschichteStelle = null; stilleBitte(); });
  tempoLeiste('rTempo', true);
  showStoryQ(s, 0, 0);
}
function showStoryQ(s, qi, right){
  const box=$('rQ'); const fragen=s.fragen||[];
  if(!fragen.length){ box.innerHTML=''; return; }
  if(qi>=fragen.length){
    const all = right===fragen.length;
    if(all){ if(!read.has(s.id)){ read.add(s.id); wann['gs:'+s.id] = today(); } markToday(); zaehle('gesch'); sound('done'); }
    saveProgress();   // auch bei einem Fehler: die Fragen sind beantwortet
    /* Die gruenen Zeilen fuer erledigte Tagesaufgaben - derselbe Fehler, der
       am 18.09.2026 fuer die Lektion und danach fuer den Vokabeltest behoben
       wurde, hier aber nicht: Wer beim Lesen 'gesch', 'auf', 'ric' oder ueber
       die Uhr 'zeit' fertig machte, bekam die Muenzen ohne ein Wort - und die
       Muenzleiste ist ausserhalb der Startseite gar nicht zu sehen. Schlimmer:
       questZeilen() LEERT questFrisch, und weil es hier nie lief, blieb der
       Eintrag liegen und wurde auf dem Ergebnisschirm der NAECHSTEN Lektion
       als frisch geschafft gefeiert, obwohl er zur Geschichte davor gehoerte.
       questZeilen() darf nur einmal je Ergebnisschirm laufen - deshalb hier in
       eine Variable und unten nur noch eingesetzt. Gefunden am 26.09.2026. */
    const questLob = questZeilen();
    if(questLob) setTimeout(()=>sound('quest'), 850);   // nach der Fanfare, nicht darueber
    const hasNext = rIdx+1 < STORIES.length;
    box.innerHTML='<div class="ergebnis-titel">'+t('gesch.fragen')+'</div>'+(all?'<div class="celebrate"><div class="zmaj cheer">'+zmaj('cheer')+'</div></div>':'')+
      '<div class="feedback '+(all?'ok':'no')+'" style="text-align:center">'+t('gesch.ergebnis',{r:right, n:fragen.length})+(all?t('gesch.geschafft'):t('gesch.nochmal_lesen'))+'</div>'+
      '<div class="row"><button class="btn ghost" id="rAgain">'+t('gesch.fragen_nochmal')+'</button>'+(all && hasNext ? '<button class="btn know" id="rGoNext">'+t('gesch.naechste')+'</button>' : '')+'</div>'+
      /* Wie beim Vokabeltest: eine leise Reihe mit dem Weg heraus. Hier
         gab es bisher gar keinen - nur "nochmal" und "naechste". */
      '<div class="row schmal"><button class="btn ghost" id="rHome">'+t('btn.zurueck_geschichten')+'</button></div>';
    $('rAgain').addEventListener('click',()=>showStoryQ(s,0,0));
    $('rHome').addEventListener('click',()=>{ homeMode='stories'; showHome(); });
    const n=$('rGoNext'); if(n) n.addEventListener('click',()=>openStory(rIdx+1));
    $('sNext2').disabled = !(hasNext && storyUnlocked(rIdx+1));
    return;
  }
  const q=fragen[qi];
  box.innerHTML='<div class="kicker" style="text-align:center">'+t('gesch.frage_n',{i:qi+1, n:fragen.length})+'</div><div class="ex-q" style="text-align:center">'+esc(q.frage)+'</div>'+
    '<div class="options '+(q.optionen.every(o=>o.length<=14) ? 'waagrecht' : 'one')+'" id="rOpts"></div>'+
    '<div class="feedback" id="rFb" style="text-align:center"></div>';
  // Kein eigener Weiter-Knopf mehr: nach der Antwort bringt ein Tippen
  // irgendwo im Fragenfeld die nächste Frage – genau wie in der Lektion.
  // Der Horcher sitzt nur auf dem Fragenfeld, damit das Nachschlagen eines
  // Wortes im Text darüber nicht versehentlich weiterblättert.
  renderChoice($('rOpts'), shuffle(q.optionen.map(o=>({k:o}))), q.richtig, o=>o.k, r=>{
    $('rFb').textContent = r?t('task.richtig'):t('task.falsch',{wort:q.richtig});
    $('rFb').className='feedback '+(r?'ok':'no');
    uhrTakt(true); zaehle('auf'); if(r) zaehle('ric');
    weiterBeiTipp('rQ', ()=> showStoryQ(s, qi+1, right+(r?1:0)));
  });
}

/* Lektion, Test und Level-Uebersicht sind Unteransichten INNERHALB von
   levelView und laufen nicht ueber showView(). Deshalb hier eigens
   abstellen - sonst spricht das letzte Wort der Lektion (bis zu 3,7 s)
   auf der Uebersicht zu Ende. Das war der gemeldete Fall. */
function showLevelHome(){
  stilleBitte();
  $('lesson').style.display='none'; $('test').style.display='none'; $('levelHome').style.display='block';
  // Beide Aufgabenfelder leeren. renderTask() sucht seine Knöpfe mit
  // getElementById, und die ids (xCheck, xIn, xOpts …) sind in Lektion und

  // seine Knöpfe an die alten Felder hängen und auf nichts mehr reagieren.

  if(L) $('gBody').innerHTML = renderExplain(L.erklaerung||[]);
  const zeilen = wortzeilen(c);
  $('wordBox').hidden = zeilen.length === 0;
  /* Die einzige Stelle, an der alle Wörter eines Levels ruhig nebeneinander
     stehen – und ausgerechnet dort konnte man keines anhören. Aufgedeckte
     Zeilen bekommen jetzt einen Lautsprecher, sofern es dafür etwas zu hören
     gibt. */
  $('wordList').innerHTML = zeilen.map(z=>
      '<div><span class="de">'+esc(z.de)+'</span>'
    + '<span class="bs'+(z.kann?'':' zu')+'">'
    + (z.kann ? esc(z.bs)+' <span class="ok">✓</span>'
                + (hoerbar(z.bs) ? '<button type="button" class="wortton" data-bs="'+esc(z.bs)+'" aria-label="'+esc(nurWort(t('task.hoeren')))+'">🔊</button>' : '')
              : '?')
    + '</span></div>').join('');
  $('wordList').querySelectorAll('.wortton').forEach(b=>b.addEventListener('click', e=>{
    e.stopPropagation(); stilleBitte(); speak(b.dataset.bs);
  }));
  $('navPrev').disabled = catIdx===0;
  $('navNext').disabled = !(catIdx+1<CATEGORIES.length && isUnlocked(catIdx+1));
}
function updateProgress(){
  const c=cur(); const words=c.words;
  const done = words.filter(w=>known.has(w.id)).length;
  const pct = levelPct(c);
  $('fill').style.width = pct+'%';
  $('capText').textContent = t('level.cap',{done:done, n:words.length});
  $('capPct').textContent = pct+'%';
  lebenWege();                       // ohne Leben die zwei Wege zeigen, sonst wegnehmen
  const marke = $('mark80');
  marke.hidden = TEST_FREI_AB >= 100;
  marke.style.left = TEST_FREI_AB + '%';
  marke.title = t('level.test_marke',{p:TEST_FREI_AB});
  const bt=$('btnTest'), allowed=testAllowed(c);
  bt.disabled = !allowed;

  else bt.textContent = allowed ? t('level.test') : t('level.test_gesperrt',{p:TEST_FREI_AB});

// Jede Sprache setzt ihre eigenen Anführungszeichen: auf, zu.
const ZITAT = {
  de:['„','“'], en:['“','”'], tr:['“','”'], sv:['”','”'],
  nl:['‘','’'], nb:['«','»'], da:['»','«'], fr:['«','»']
};
// Setzt Text in die Anführungszeichen der aktuellen Sprache.
// Französisch bekommt dabei sein Leerzeichen innen.
function inZitat(text){
  const [auf, zu] = ZITAT[SPRACHE] || ZITAT.de;
  const luft = SPRACHE==='fr' ? ' ' : '';
  return auf+luft+text+luft+zu;
}

// Was zwischen den Anführungszeichen der aktuellen Sprache steht, wird fett.
function fettZitate(text){
  const [auf, zu] = ZITAT[SPRACHE] || ZITAT.de;
  const e = s => s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  // Leerzeichen direkt hinter « und vor » bleiben außerhalb der Fettschrift
  const re = new RegExp(e(auf)+'(\\s*)([^'+e(zu)+']*?)(\\s*)'+e(zu),'g');
  return text.replace(re, auf+'$1<b>$2</b>$3'+zu);
}

function renderExplain(parts){
  return parts.map(p=>{
    if(typeof p==='string') return '<p>'+fettZitate(esc(p))+'</p>';
    if(p.tabelle){
      const [head, ...rows] = p.tabelle;
      return '<div class="tablewrap"><table><tr>'+head.map(h=>'<th>'+esc(h)+'</th>').join('')+'</tr>'+
        rows.map(r=>'<tr>'+r.map(c=>'<td>'+esc(c)+'</td>').join('')+'</tr>').join('')+'</table></div>';
    }
    return '';
  }).join('');
}

/* =================== AUFGABEN-BAUSTEINE =================== */
/* Zwei Vokabeln koennen in einer Oberflaechensprache dieselbe Uebersetzung
   haben: auf Daenisch heissen majka und mama beide "mor", auf Franzoesisch
   kolac und torta beide "gateau". Auf Deutsch faellt das nie auf.
   Ohne diese Funktion waere die Auswahlaufgabe dort nicht entscheidbar und
   die Schreibaufgabe nicht loesbar - eine richtige Antwort kostet ein Herz.
   Gefunden am 26.09.2026, elf Stellen ueber acht Sprachen. */
const _bedeutung = s => String(s||'').toLowerCase().replace(/[.!?\u2026]+$/,'').replace(/\s+/g,' ').trim();
function geschwister(w){
  const b = _bedeutung(w.de);
  if(!b) return [];
  return CATEGORIES.flatMap(c=>c.words).filter(x => x.bs !== w.bs && _bedeutung(x.de) === b);
}
function distractors(target, words, n){
  /* Auch die Bedeutung vergleichen, nicht nur das bosnische Wort. Sonst
     landen "majka" und "mama" in derselben Auswahl, beide zeigen "mor". */
  const gleich = new Set(geschwister(target).map(x=>x.bs));
  const raus = w => w.bs===target.bs || gleich.has(w.bs);
  let pool = words.filter(w=>!raus(w));
  if(pool.length<n) pool = CATEGORIES.flatMap(c=>c.words).filter(w=>!raus(w));
  const seen = new Set([target.bs]); const out=[];
  for(const w of shuffle(pool.slice())){ if(!seen.has(w.bs)){ seen.add(w.bs); out.push(w); if(out.length===n) break; } }
  return out;
}
function renderChoice(box, opts, correctKey, keyOf, onDone){
  box.innerHTML='';
  let answered=false;
  opts.forEach(o=>{
    const b=document.createElement('button'); const label=keyOf(o);
    b.className='opt'+(label.length>14?' long':''); b.textContent=label;
    b.addEventListener('click',()=>{
      if(answered) return; answered=true;
      box.querySelectorAll('.opt').forEach(x=>{ x.disabled=true; if(x.textContent===correctKey) x.classList.add('right'); });
      const ok = label===correctKey; if(!ok) b.classList.add('wrong');
      sound(ok?'ok':'no');
      onDone(ok);
    });
    box.appendChild(b);
  });
}

/* Grammatikaufgaben tragen ihre Bedeutung meist schon in Klammern mit:
   „___ stanuješ?“ (Wo wohnst du?). Daraus wird nach der Antwort der fertige
   Satz und darunter seine Übersetzung. Steht keine Lücke in der Frage, gibt
   es nichts zusammenzusetzen - dann bleibt die Zeile weg, statt bloss die
   schon sichtbare Antwort zu wiederholen. */
function gramLoesung(g){
  const roh = String(g.frage || '').trim();
  const ANF = /^[\u201e\u201c\u201d"\u00ab\u00bb\u2018\u2019'\s]+/;
  const END = /[\u201e\u201c\u201d"\u00ab\u00bb\u2018\u2019'\s]+$/;
  if(roh.indexOf('___') >= 0){
    const klammer = roh.match(/\(([^()]{2,})\)\s*$/);
    const satz = (klammer ? roh.slice(0, klammer.index) : roh)
                   .replace('___', g.richtig).replace(ANF, '').replace(END, '').trim();
    return satz ? [satz, klammer ? klammer[1].trim() : ''] : null;
  }
  /* Keine Luecke: Manche Aufgaben geben den Satz in der eigenen Sprache vor
     und fragen nach der bosnischen Fassung - \u201eIch bin nicht m\u00fcde.\u201c mit der
     Antwort \u201eNisam umoran.\u201c. Dann ist die Frage selbst die \u00dcbersetzung.
     Nur dann, wenn ausser dem Zitat nichts dasteht - hoechstens eine
     Einleitung mit Doppelpunkt. Sonst geriete \u201eMehrzahl von \u201aku\u0107a\u2018?\u201c
     mit hinein, und dort ist das Zitat bosnisch, nicht die \u00dcbersetzung.
     Die Anfuehrungszeichen unterscheiden sich je Sprache, deshalb wird nach
     dem ersten und dem letzten gesucht statt nach einem festen Paar. */
  const Q = '\u201e\u201c\u201d"\u00ab\u00bb\u2018\u2019';
  let a = -1, b = -1;
  for(let i = 0; i < roh.length; i++){
    if(Q.indexOf(roh[i]) >= 0){ if(a < 0) a = i; b = i; }
  }
  if(a < 0 || b < a + 4) return null;
  if(b !== roh.length - 1) return null;          // hinter dem Zitat steht noch etwas
  const davor = roh.slice(0, a).trim();
  if(davor && davor.slice(-1) !== ':') return null;
  const inhalt = roh.slice(a + 1, b).trim();
  return inhalt ? [g.richtig, inhalt] : null;
}

function renderTask(task, body, done, opts={}){
  /* NUR innerhalb dieser Aufgabe suchen. Lektion und Test benutzen dieselben
     Kennungen (xOpts, xFb, ...). Sind beide gefuellt, liefert
     document.getElementById immer die ERSTE im Dokument - die der Lektion.
     Der Test legte seine Antwortknoepfe dadurch in den unsichtbaren
     Lektionskoerper und stand selbst ohne Knoepfe da. */
  const $$ = id => body.querySelector('#'+id);
  stilleBitte();                       // das Wort der vorigen Aufgabe nicht hineinreden lassen
  const meineAufgabe = aufgabeMarke;   // gilt fuer verspaetete Erkennungs-Ergebnisse
  const pool = task.pool || curWords();
  const w = task.w;
  const kick = (text)=> '<div class="kicker">'+text+(task.rep?' · <span class="rep">'+t('task.wiederholung',{label:esc(task.rep)})+'</span>':'')+(task.retry?' · <span class="rep">'+t('task.nochmal')+'</span>':'')+'</div>';
  const fb = (ok, right, extra)=>{ $$('xFb').textContent = ok?t('task.richtig'):t('task.falsch',{wort:right})+(extra?' ('+extra+')':''); $$('xFb').className='feedback '+(ok?'ok':'no'); };
  /* Nach der Antwort: das Bosnische und darunter, was es heißt. Vorher
     konnte man eine Auswahlaufgabe richtig lösen, ohne je zu erfahren, was
     das Wort bedeutet - und bei den Höraufgaben stand überhaupt nichts
     Übersetztes auf dem Bildschirm. Ajdin am 18.09.2026. */
  const loesung = (bs, de)=>{
    const feld = $$('xFb');
    if(!feld || !bs || body.querySelector('.loesung')) return;
    feld.insertAdjacentHTML('afterend',
      '<div class="loesung"><span class="lbs">'+esc(bs)+'</span>'+
      (de ? '<span class="lde">'+esc(de)+'</span>' : '')+'</div>');
  };
  const skipBtn = (text)=> opts.noSkip ? '' : '<button class="skip" id="xSkip">'+text+' ⏭</button>';
  const wireSkip = ()=>{ const b=$$('xSkip'); if(b) b.addEventListener('click',()=>done({ok:false, skipped:true})); };

  if(task.typ==='intro'){
    body.innerHTML = '<div class="kicker"><span class="rep new">'+t('task.neues_wort')+'</span></div><div class="de">'+esc(w.de)+'</div><div class="big'+(w.bs.length>16?' long':'')+'">'+esc(w.bs)+'</div>'+
      (canListen?'<button class="listen" id="xListen">'+t('task.hoeren')+'</button>':'')+
      '<div class="row"><button class="btn know" id="xNext">'+t('task.weiter')+'</button></div>';
    if(canListen){ $$('xListen').addEventListener('click',()=>speak(w.bs)); spaeterSprechen(w.bs, 250); }
    $$('xNext').addEventListener('click',()=>done({ok:true, intro:true})); $$('xNext').focus();
    return;
  }
  if(task.typ==='mc'){
    body.innerHTML = kick(t('task.was_heisst'))+'<div class="prompt'+(w.de.length>18?' long':'')+'">'+esc(w.de)+'</div><div class="options" id="xOpts"></div><div class="feedback" id="xFb"></div>';
    renderChoice($$('xOpts'), shuffle([w, ...distractors(w, pool, 3)]), w.bs, o=>o.bs, ok=>{ fb(ok, w.bs); loesung(w.bs, w.de); spaeterSprechen(w.bs, 450); done({ok}); });
    return;
  }
  if(task.typ==='mcrev'){
    body.innerHTML = kick(t('task.was_bedeutet'))+'<div class="big'+(w.bs.length>16?' long':'')+'">'+esc(w.bs)+'</div><div class="options" id="xOpts"></div><div class="feedback" id="xFb"></div>';
    /* Hier steht das bosnische Wort gross da und die Bedeutung wird gesucht -
       ein Hoerknopf verraet also nichts. Kein Autoplay: erst lesen, dann auf
       Wunsch hoeren. Nach der Antwort spricht es von selbst, damit man die
       Aussprache mitnimmt, auch wenn man daneben lag.
       body.querySelector statt $(): die Kennung xListen gibt es in der
       Lektion UND im Test, und $() findet immer nur die erste im Dokument. */
    if(hoerbar(w.bs)) body.querySelector('.options').insertAdjacentHTML('beforebegin',
      '<button class="listen" data-hoer="1">'+t('task.hoeren')+'</button>');
    const hoerKnopf = body.querySelector('[data-hoer]');
    if(hoerKnopf) hoerKnopf.addEventListener('click',()=>{ stilleBitte(); speak(w.bs); });
    renderChoice(body.querySelector('.options'), shuffle([w, ...distractors(w, pool, 3)]), w.de, o=>o.de, ok=>{ fb(ok, w.de); loesung(w.bs, w.de); spaeterSprechen(w.bs, 450); done({ok}); });
    return;
  }
  if(task.typ==='type'){
    body.innerHTML = kick(t('task.schreib'))+'<div class="prompt'+(w.de.length>18?' long':'')+'">'+esc(w.de)+'</div>'+
      '<input class="type-input" id="xIn" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="…">'+
      '<div class="feedback" id="xFb"></div><div class="row"><button class="btn know" id="xCheck">'+t('task.pruefen')+'</button></div>';
    const inp=$$('xIn'); inp.focus(); let fin=false;
    const check=()=>{
      /* Traegt ein anderes Wort dieselbe Uebersetzung, ist es genauso
         richtig - der Bildschirm zeigt ja nur die Bedeutung. matches()
         trennt ohnehin bei " / ", deshalb genuegt es, die Geschwister
         anzuhaengen. */
      if(fin) return;
      const auchOk = [w.bs, ...geschwister(w).map(x=>x.bs)].join(' / ');
      const r=matches(inp.value, auchOk);
      if(r==='leer'){ $$('xFb').textContent=t('task.tippe_wort'); $$('xFb').className='feedback no'; return; }
      // Beantwortet: der Pruefen-Knopf hat nichts mehr zu tun und wuerde

      fin=true; inp.disabled=true;

      if(pruefKnopf && pruefKnopf.parentElement) pruefKnopf.parentElement.hidden = true;
      const ok = r==='ok' || r==='almost';
      $$('xFb').textContent = r==='ok' ? t('task.richtig') : (r==='almost' ? t('task.fast',{wort:w.bs}) : t('task.falsch',{wort:w.bs}));
      $$('xFb').className='feedback '+(r==='ok'?'ok':(r==='almost'?'almost':'no'));
      loesung(w.bs, w.de);
      sound(ok?'ok':'no'); spaeterSprechen(w.bs, 450); done({ok});
    };
    inp.addEventListener('keydown',e=>{ if(e.key==='Enter') check(); });
    $$('xCheck').addEventListener('click',check);
    return;
  }
  if(task.typ==='listen'){
    body.innerHTML = kick(t('task.hoerfrage'))+'<button class="listen bigplay" id="xPlay" aria-label="'+t('task.abspielen')+'">🔊</button><div class="options" id="xOpts"></div><div class="feedback" id="xFb"></div>'+skipBtn(t('task.hoeren_skip'));
    $$('xPlay').addEventListener('click',()=>speak(w.bs)); spaeterSprechen(w.bs, 300);
    renderChoice($$('xOpts'), shuffle([w, ...distractors(w, pool, 3)]), w.bs, o=>o.bs, ok=>{ fb(ok, w.bs); loesung(w.bs, w.de); done({ok}); });
    wireSkip();
    return;
  }
  if(task.typ==='speak'){
    body.innerHTML = kick(t('task.sprechen'))+'<div class="big'+(w.bs.length>16?' long':'')+'">'+esc(w.bs)+'</div><div class="de">'+esc(w.de)+'</div>'+
      (canListen?'<button class="listen" id="xListen">'+t('task.vorsprechen')+'</button>':'')+
      '<button class="mic" id="xMic" aria-label="'+t('task.mikro')+'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/></svg></button>'+
      '<div class="heard" id="xHeard">'+t('task.mikro_tipp')+'</div><div class="feedback" id="xFb"></div>'+skipBtn(t('task.sprechen_skip'));
    if(canListen) $$('xListen').addEventListener('click',()=>speak(w.bs));
    const mic=$$('xMic'), heard=$$('xHeard'); let rec, listening=false, fin=false;
    // Laufende Erkennung abbrechen - beim Ueberspringen und ueber stilleBitte()
    const abhoeren = async ()=>{ const H = hoererPlugin(); try{ if(H) await H.stop(); else if(rec) rec.abort(); }catch(e){} };

    /* Ein Ergebnis bewerten - egal, woher es kommt. Die Erkennung liefert
       mehrere Vorschläge; einer muss passen. */
    const bewerte = (liste)=>{
      // Zu spaet: die Aufgabe ist schon beantwortet, uebersprungen oder verlassen.
      if(fin || meineAufgabe !== aufgabeMarke) return;
      // Jede Schreibweise des Zielworts gilt: "Laku noc / Lahku noc" sind zwei
      const ziele = String(w.bs).split(' / ');
      let treffer = false, erstes = '';
      for(const s of liste){
        if(!erstes) erstes = String(s).trim();
        if(ziele.some(z => klingtWie(s, z))) treffer = true;
      }
      if(treffer){
        fin = true;
        heard.innerHTML = '<span style="color:var(--good)">'+t('task.gehoert_ok',{text:esc(erstes)})+'</span>';
        sound('ok'); done({ok:true});
      } else if(!erstes){
        /* Die Erkennung hat nichts geliefert - geschwiegen, zu laut, Anruf,
           Mikrofon belegt. Vorher stand hier der Satz "Ich habe ‚‘
           verstanden" mit einem leeren Wort darin, dazu der Fehlerton. Der
           Nutzer bekam gesagt, er habe falsch gesprochen. */
        heard.textContent = t(navigator.onLine ? 'task.mikro_fehler' : 'task.mikro_offline');
      } else {
        heard.textContent = t('task.gehoert_no',{text:erstes}); sound('no');
      }
    };

    /* Sobald der Nutzer stoppt, ueberspringt oder die Aufgabe verlaesst,
       darf die Sprachschleife unten nicht die naechste Sprache anwerfen.
       Vorher lief das Mikrofon bis zu viermal weiter, auch auf der
       Levueluebersicht. Gefunden am 26.09.2026. */
    let stoppGewollt = false;
    mic.addEventListener('click', async ()=>{
      if(fin) return;
      const H = hoererPlugin();
      if(H){
        // Weg über das Plugin: Androids eigene Erkennung.
        if(listening){ stoppGewollt = true; try{ await H.stop(); }catch(e){} return; }
        try{
          let rechte = await H.checkPermissions();
          if(rechte.speechRecognition !== 'granted') rechte = await H.requestPermissions();
          if(rechte.speechRecognition !== 'granted'){
            /* canSpeak kam bisher allein aus H.available() - das sagt nur,
               dass ein Erkenner installiert ist, nicht dass die App ihn
               benutzen darf. Wer ablehnt, bekam trotzdem in jeder Lektion
               Sprechaufgaben, musste sie ueberspringen, und die Tagesaufgabe
               "ohne Fehler" verlangt Lx.skipped === 0 - sie war fuer ihn
               dauerhaft unerreichbar. Ab der naechsten Lektion faellt 'speak'
               jetzt aus dem Aufgabentopf. */
            canSpeak = false;
            mikroAbsageMerken(true);   // auch ueber den naechsten Start hinaus
            heard.textContent = t('task.mikro_blockiert');
            return;
          }
          listening = true; stoppGewollt = false;
          mic.classList.add('rec'); heard.textContent = t('task.hoert_zu');
          hoererAbbrechen = ()=>{ stoppGewollt = true; abhoeren(); };
          let erg = null;
          for(const sprache of ['bs-BA','hr-HR','sr-RS', null]){
            try{
              erg = await H.start(Object.assign({maxResults:5, partialResults:false, popup:false},
                                                sprache ? {language:sprache} : {}));
              break;
            }catch(e){
              /* Frueher stand hier nur "diese Stimme fehlt auf dem Geraet".
                 Androids Erkenner wirft auf demselben Weg aber auch bei
                 "kein Treffer", Zeitueberlauf, belegtem Mikrofon und beim
                 Abbruch durch den Nutzer. Dann darf nicht die naechste
                 Sprache starten. */
              if(stoppGewollt || fin) break;
            }
          }
          listening = false; mic.classList.remove('rec');
          bewerte((erg && erg.matches) || []);
        }catch(e){
          listening = false; mic.classList.remove('rec');
          heard.textContent = t(navigator.onLine ? 'task.mikro_fehler' : 'task.mikro_offline');
        }
        return;
      }
      // Weg über den Browser
      if(listening){ rec && rec.stop(); return; }
      rec=new SR(); rec.lang='hr-HR'; rec.interimResults=false; rec.maxAlternatives=3;
      rec.onstart=()=>{ listening=true; mic.classList.add('rec'); heard.textContent=t('task.hoert_zu'); hoererAbbrechen = abhoeren; };
      rec.onerror=(e)=>{ heard.textContent = e.error==='not-allowed' ? t('task.mikro_blockiert') : t(navigator.onLine ? 'task.mikro_fehler' : 'task.mikro_offline'); };
      rec.onend=()=>{ listening=false; mic.classList.remove('rec'); };
      rec.onresult=(ev)=> bewerte([...ev.results[0]].map(r=>r.transcript));
      rec.start();
    });
    // Nicht wireSkip(): Ueberspringen muss hier auch die Erkennung beenden,
    // sonst kommt ihr Ergebnis Sekunden spaeter in die naechste Aufgabe.
    const skipS = $$('xSkip');
    if(skipS) skipS.addEventListener('click', ()=>{ fin = true; abhoeren(); done({ok:false, skipped:true}); });
    return;
  }
  if(task.typ==='gap'){
    const s=task.s;
    body.innerHTML = kick(t('task.luecke'))+'<div class="sentence">'+esc(s.text).replace('___','<input class="blank-input" id="xIn" autocomplete="off" autocapitalize="off" spellcheck="false">')+'</div>'+
      '<div class="translation">'+inZitat(esc(s.de))+'</div><div class="feedback" id="xFb"></div><div class="row"><button class="btn know" id="xCheck">'+t('task.pruefen')+'</button></div>';
    const inp=$$('xIn'); inp.focus(); let fin=false;
    const check=()=>{
      if(fin) return; const r=matches(inp.value, s.answer);
      if(r==='leer'){ $$('xFb').textContent=t('task.tippe_luecke'); $$('xFb').className='feedback no'; return; }
      // Beantwortet: der Pruefen-Knopf hat nichts mehr zu tun und wuerde
      // nur neben dem Weiter-Knopf stehen. Ajdin am 18.09.2026.
      fin=true; inp.disabled=true;
      const pruefKnopf = $$('xCheck');
      if(pruefKnopf && pruefKnopf.parentElement) pruefKnopf.parentElement.hidden = true;
      const ok = r==='ok' || r==='almost';
      $$('xFb').textContent = r==='ok' ? t('task.richtig') : (r==='almost' ? t('task.fast',{wort:s.answer}) : t('task.falsch',{wort:s.answer}));
      $$('xFb').className='feedback '+(r==='ok'?'ok':(r==='almost'?'almost':'no'));
      loesung(s.text.replace('___', s.answer), s.de);
      sound(ok?'ok':'no');
      /* Erst jetzt den FERTIGEN Satz sprechen - vorher waere die Loesung
         verraten. Gehoert wird der Satz mit eingesetztem Wort, nicht der
         mit der Luecke. */
      const ganz = s.text.replace('___', s.answer);
      if(hoerbar(ganz)) spaeterSprechen(ganz, 450);
      else if(hoerbar(s.answer)) spaeterSprechen(s.answer, 450);
      done({ok});
    };
    inp.addEventListener('keydown',e=>{ if(e.key==='Enter') check(); });
    $$('xCheck').addEventListener('click',check);
    return;
  }
  if(task.typ==='gram'){
    const g=task.g;
    body.innerHTML = kick(t('task.grammatik'))+'<div class="ex-q">'+esc(g.frage)+'</div><div class="options'+(g.optionen.some(o=>o.length>22)?' one':'')+'" id="xOpts"></div><div class="feedback" id="xFb"></div><div class="ex-tipp" id="xTipp"></div>';
    // Nach der Antwort die richtige Form sprechen, wenn es sie als Aufnahme
    // gibt - bei „imaš“ gegen „ima“ entscheidet die Aussprache mit.
    renderChoice($$('xOpts'), shuffle(g.optionen.map(o=>({k:o}))), g.richtig, o=>o.k, ok=>{ fb(ok, g.richtig); const gl=gramLoesung(g); if(gl) loesung(gl[0], gl[1]); if(!ok && g.tipp) $$('xTipp').textContent=g.tipp; if(vorlesbar(g.richtig)) spaeterSprechen(g.richtig, 450); done({ok, slow:!ok && !!g.tipp}); });
    return;
  }
}

/* =================== LEKTION =================== */
let Lx = null;
function buildLesson(){
  const c = cur();
  const unknown = shuffle(c.words.filter(w=>!known.has(w.id)));
  const knownW = shuffle(c.words.filter(w=>known.has(w.id)));
  let nNew = Math.min(LEKTION_NEU_MAX, unknown.length);
  let nRev = Math.min(LEKTION_WOERTER - nNew, knownW.length);
  if(nRev < LEKTION_WOERTER - nNew) nNew = Math.min(unknown.length, Math.max(nNew, Math.min(8, LEKTION_WOERTER - nRev)));
  const newW = unknown.slice(0,nNew), revW = knownW.slice(0,nRev);
  const types = ['mc','mcrev','type']; if(canListen) types.push('listen'); if(canSpeak) types.push('speak');
  let ti = Math.floor(Math.random()*types.length);
  const pick = w => { for(let k=0;k<types.length;k++){ const t=types[(ti+k)%types.length]; if(t==='type' && !typable(w)) continue; ti=(ti+k+1)%types.length; return t; } return 'mc'; };
  const tasks = [];
  [...newW, ...revW].forEach(w=> tasks.push({typ:pick(w), w, neu:!known.has(w.id)}));
  shuffle(curSentences()).slice(0, LEKTION_LUECKEN).forEach(s=> tasks.push({typ:'gap', s}));
  shuffle(((GRAMMAR[c.id]||{}).uebungen||[]).slice()).slice(0, LEKTION_GRAMMATIK).forEach(g=> tasks.push({typ:'gram', g}));
  shuffle(tasks);
  const intros = newW.map(w=>({typ:'intro', w}));
  Lx = {queue:[...intros, ...tasks], i:0, results:[], right:0, total:tasks.length, skipped:0, newWords:new Set(), retried:new Set()};
}
function lessonBar(){
  $('lBar').innerHTML = Lx.queue.map((t,i)=>'<i class="'+(i<Lx.i ? (Lx.results[i]==='intro'?'intro':(Lx.results[i]==='skip'?'skip':(Lx.results[i]?'ok':'no'))) : (i===Lx.i?'cur':''))+'"></i>').join('');
}
function showLessonTask(){
  lessonBar();
  if(Lx.i >= Lx.queue.length){ lessonEnd(); return; }
  const task = Lx.queue[Lx.i];
  $('lBody').dataset.i = Lx.i;
  renderTask(task, $('lBody'), res=>{
    if(res.intro){ Lx.results[Lx.i]='intro'; }
    else if(res.skipped){ Lx.results[Lx.i]='skip'; Lx.skipped++; }
    else {
      Lx.results[Lx.i]=res.ok; zmajReact(res.ok); uhrTakt(true); zaehle('auf');
      if(res.ok){
        Lx.right++; zaehle('ric');
        if(task.typ==='gap') zaehle('lue');
        if(task.typ==='listen') zaehle('hoer');
        // Neue Wörter hier zählen, nicht in lessonEnd: wer mitten in der
        // Lektion die Leben verliert, kommt dort nie an.
        if(task.w && !known.has(task.w.id)){ known.add(task.w.id); Lx.newWords.add(task.w.id); zaehle('neu'); }
      }
      else {
        loseLife();
        if(!task.retry) Lx.queue.push({...task, retry:true});
        if(livesNow()===0){ Lx.i++; weiterBeiTipp('lBody', lessonOutOfLives); return; }
      }
    }
    Lx.i++;
    // Einleitung und Uebersprungenes sind keine Antworten - da gibt es
    // nichts nachzusehen, also gleich weiter.
    if(res.intro || res.skipped) showLessonTask();
    else weiterBeiTipp('lBody', showLessonTask);
  });
}
/* Zeigt eine Werbung und ruft danach `fertig(angesehen)` auf.
   `belohnt`: Der Nutzer hat sie freiwillig gestartet und bekommt etwas dafür.
   Hier steckt später das SDK. Bis dahin ein Platzhalter, der sich genauso
   verhält – mit Wartezeit und Schließen-Knopf.
   Beim echten SDK muss werbungPersonalisiert() mitgegeben werden: false
   bedeutet "nur allgemeine Werbung", bei AdMob das Feld npa=1. */
/* Ist AdMob beim Start gescheitert, faellt sonst jede Anzeige fuer den ganzen
   Lauf aus. Einmal nachfassen - danach geht es weiter wie immer, notfalls
   ueber den Platzhalter. */
/* Eine kurze Meldung, die nach drei Sekunden von selbst verschwindet.
   Die App hatte dafuer bisher keine Stelle - gebraucht wird sie erst,
   seit eine Anzeige ohne Ersatz ausfallen kann. */
let kurzUhr = 0;
function kurzMeldung(text){
  let el = document.querySelector('.kurznote');
  if(!el){
    el = document.createElement('div');
    el.className = 'kurznote';
    el.setAttribute('role', 'status');
    document.body.appendChild(el);
  }
  el.textContent = text;
  setTimeout(()=> el.classList.add('an'), 20);
  clearTimeout(kurzUhr);
  kurzUhr = setTimeout(()=>{
    el.classList.remove('an');
    setTimeout(()=>{ if(!el.classList.contains('an')) el.remove(); }, 400);
  }, 3200);
}

/* Punkt 9 und 13 aus WERBUNG_PRUEFUNG.md: es gab keinen Riegel gegen den
   zweiten Tipp. Ein zweiter Tipp startete einen zweiten Ladevorgang; kam
   der erst zurueck, nachdem das erste Video zu war, schob sich ein
   unangefordertes Vollbild-Video ueber die inzwischen geoeffnete
   Startseite - mit einem zweiten Leben und einem zweiten Abzug vom
   Tageskontingent.
   Der Riegel heisst anzeigeLaeuft: werbungLaeuft gibt es schon, das
   riegelt Googles Einwilligungsfenster ab. Er sitzt in zeigeWerbung()
   und nicht in zeigeWerbungJetzt():
   auch der Zweitversuch ueber admobStart() geht durch diese Tuer. Jeder
   Ausgang laeuft ueber fertigEinmal(), damit er wieder aufgeht. */
let anzeigeLaeuft = false;
function zeigeWerbung(belohnt, fertig, darfNoch){
  if(anzeigeLaeuft){ fertig(false); return; }
  anzeigeLaeuft = true;
  let erledigt = false;
  /* Sicherheitsleine. Ohne sie bliebe der Riegel fuer immer zu, wenn ein
     Weg sein fertig() nie ruft - und die App koennte bis zum Neustart
     keine Anzeige mehr zeigen. Die Frist liegt ueber der laengsten
     inneren Frist von 120 Sekunden, greift also nur, wenn wirklich
     niemand mehr antwortet. */
  let wacht = setTimeout(()=> fertigEinmal(false), 150000);
  const fertigEinmal = lief => {
    if(erledigt) return;          // ein Ausgang, einmal
    erledigt = true; anzeigeLaeuft = false;
    clearTimeout(wacht);
    fertig(lief);
  };
  const P = window.Capacitor && window.Capacitor.Plugins;
  if(WERBUNG_ECHT && !AdMobP && admobFehler && P && P.AdMob && !admobZweitversuch){
    admobZweitversuch = true;
    admobStart().then(()=> zeigeWerbungJetzt(belohnt, fertigEinmal, darfNoch),
                      ()=> zeigeWerbungJetzt(belohnt, fertigEinmal, darfNoch));
    return;
  }
  zeigeWerbungJetzt(belohnt, fertigEinmal, darfNoch);
}

function zeigeWerbungJetzt(belohnt, fertig, darfNoch){
  if(!werbungErlaubt(belohnt)){ fertig(false); return; }
  stilleBitte();   // kein Wort unter der Anzeige - egal ob echte oder Platzhalter

  // Auf dem Handy die echte Anzeige. Gezählt wird erst, wenn sie auch lief –
  // eine Anzeige, die nicht kam, darf kein Tageskontingent verbrauchen.
  // Und jede Art auf ihr eigenes Kontingent (Ajdin am 26.09.2026).
  if(admobDa()){
    admobZeigen(belohnt, darfNoch).then(lief => { if(lief) werbungGezaehlt(belohnt); fertig(lief); });
    return;
  }
  /* Auf dem Geraet gibt es keinen Platzhalter. Der ist fuer den PC
     gedacht, wo es AdMob gar nicht gibt. Ist das Plugin da und die
     Anzeige kann trotzdem nicht starten - ohne Netz zum Beispiel -,
     faellt sie aus: kein Kontingent verbraucht, und vor allem kein Leben
     fuer eine Anzeige, die nie lief. Gefunden bei P8 am 28.09.2026 im
     Flugmodus, wo auf dem Handy wirklich „Hier erscheint die Werbung“
     stand. */
  if(window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.AdMob){
    fertig(false); return;
  }
  werbungGezaehlt(belohnt);

  const kasten = document.createElement('div');
  kasten.className = 'werbung';
  kasten.innerHTML =
    '<div class="werbebox">' +
      '<div class="werbemarke">' + esc(t('werbung.marke')) + '</div>' +
      '<div class="werbeflaeche" id="werbePlatz">' + esc(t('werbung.platzhalter')) + '</div>' +
      '<div class="werbenote" id="werbeNote"></div>' +
      '<button class="btn know" id="werbeZu" disabled></button>' +
      (belohnt ? '' : '<button class="skip" id="werbePremium">' + esc(t('werbung.ohne')) + '</button>') +
    '</div>';
  document.body.appendChild(kasten);

  // Fünf Sekunden warten, dann darf man schließen - so machen es die SDKs auch
  let rest = 5;
  const knopf = kasten.querySelector('#werbeZu');
  const note = kasten.querySelector('#werbeNote');
  note.textContent = belohnt ? t('werbung.lohn_laeuft') : '';
  const tick = () => {
    knopf.textContent = rest > 0 ? t('werbung.warten', {n: rest})
                                 : t(belohnt ? 'werbung.lohn_abholen' : 'werbung.weiter');
    knopf.disabled = rest > 0;
    if(rest-- > 0) return;
    clearInterval(uhr);
  };
  tick();
  const uhr = setInterval(tick, 1000);

  const schliessen = (angesehen) => {
    clearInterval(uhr);
    kasten.remove();
    fertig(angesehen);
  };
  knopf.addEventListener('click', () => schliessen(true));
  const pk = kasten.querySelector('#werbePremium');
  if(pk) pk.addEventListener('click', () => { schliessen(false); showSettings(); });
}

/* Ein belohntes Video: freiwillig, gibt ein Leben zurück. */
function werbungFuerLeben(){
  /* Punkt 9 und 13: den Knopf sperren, solange etwas laeuft. Der Riegel
     in zeigeWerbung() haelt ohnehin, aber ein Knopf, der sich nicht
     ruehrt, laedt zum zweiten Tipp ein. */
  const knopf = $('lAd');
  /* Punkt 17: bis zum ersten Bild der Anzeige vergehen Sekunden, in denen
     der AdMob-Weg gar keine Oberflaeche baut. Ohne ein Wort sieht die App
     unbeteiligt aus - und genau das loest den zweiten Tipp aus. */
  if(knopf){ knopf.disabled = true; knopf.textContent = t('werbung.laedt'); }
  zeigeWerbung(true, angesehen => {
    if(knopf){ knopf.disabled = false; knopf.textContent = t('werbung.leben_holen'); }
    /* Ohne Anzeige kein Leben - und ein Wort dazu, sonst wirkt der Knopf
       kaputt. */
    if(!angesehen){ kurzMeldung(t('werbung.keine_anzeige')); return; }
    lives = {anzahl: Math.min(LEBEN_MAX, lives.anzahl + WERBUNG_LEBEN_LOHN),
             zeit: lives.zeit || Date.now()};
    saveProgress(); renderLives(); sound('ok');
    /* Punkt 14: nur aufraeumen, wenn der Bildschirm ohne Leben ueberhaupt
       noch steht. Wer waehrend des Ladens mit Muenzen ein Herz gekauft und
       eine neue Lektion angefangen hat, verlor sie sonst - showLevelHome()
       leert lBody, und lessonEnd() wird nie erreicht: keine Lektion
       gezaehlt, kein Bonus, kein Lerntag.
       Geprueft wird der Knopf selbst, nicht seine Kennung: nur wenn genau
       dieser Knoten noch im Dokument haengt, steht auch der alte Schirm
       noch. Dieselbe Vorsicht wie beim Interstitial seit dem 29.09.2026. */
    if(!knopf || document.body.contains(knopf)) showLevelHome();
  });
}

/* Die Anzeige nach einem Ergebnisschirm - nach der Lektion und nach dem Test.
   feld: 'lesson' oder 'test', beide liegen in levelView.
   marke: liefert das Objekt, das mit dem naechsten Durchgang wechselt (Lx bzw.
   Tx) - daran erkennt man, ob der Nutzer weitergegangen ist.

   Zwei Dinge, die Ajdin am 27.09.2026 gemeldet hat ("also es kommt nicht immer
   werbung nach der lektion und nach dem test auch nicht"):
   - Nach dem TEST kam gar keine. Das war keine Entscheidung, sondern eine
     Luecke: showTestResult() hat den Auslöser einfach nie gerufen.
   - Wer in den 1,2 Sekunden weitertippt, verlor die Anzeige ganz. Der Zaehler
     stand schon hoeher, also war sie weg. Jetzt wird sie geschuldet und beim
     naechsten Ergebnisschirm nachgeholt. */
let werbungSchuldig = !!werbungHeute.offen;
/* Immer hierueber setzen, nie direkt: der Merker muss in denselben
   Eintrag wie die Tageszaehler, sonst ueberlebt er das Schliessen der
   App nicht. */
function schuldigSetzen(ja){
  werbungSchuldig = ja;
  werbungHeute.offen = ja;
  try{ localStorage.setItem('zmaj_werbung', JSON.stringify(werbungHeute)); }catch(e){}
}
/* Der Wecker aus werbungNachDemErgebnis. Er muss abraeumbar sein: geht
   die App in den 1,2 Sekunden in den Hintergrund - Home-Taste, Anruf -,
   duerfte die Anzeige sonst beim Zurueckkommen erscheinen, ohne dass
   jemand etwas getan hat. Genau das verbietet Google.
   Punkt 2 aus WERBUNG_PRUEFUNG.md, behoben am 29.09.2026. */
let werbungWecker = 0;
function werbungNachDemErgebnis(feld, marke){
  const dran = werbungSchuldig ||
               (werbungZaehler >= WERBUNG_AB_LEKTION &&
                (werbungZaehler - WERBUNG_AB_LEKTION) % WERBUNG_JEDE_X === 0);
  if(!dran || !werbungErlaubt()) return;
  /* Nur, wenn der Ergebnisschirm noch steht. Sonst stuende die Anzeige ueber
     dem Lernpfad, den Einstellungen oder schon ueber der ersten Aufgabe der
     naechsten Lektion. */
  const dieser = marke();
  /* Dieselbe Bedingung zweimal gebraucht: einmal jetzt, wenn der Wecker
     klingelt, und noch einmal unten in admobZeigen(), kurz bevor die
     Anzeige wirklich kommt. document.hidden gehoert dazu - sichtbar()
     fragt nur das CSS, nicht ob die App ueberhaupt noch vorne ist. */
  const darfNoch = ()=> marke() === dieser && !wegmarkeLaeuft
                        && sichtbar('levelView') && sichtbar(feld)
                        && !document.hidden;
  clearTimeout(werbungWecker);
  werbungWecker = setTimeout(()=>{
    werbungWecker = 0;
    /* wegmarkeLaeuft: eine Anzeige ueber dem 100. Lerntag waere die
       schlechteste Minute, die sich die App aussuchen koennte. */
    if(darfNoch()){
      schuldigSetzen(false);
      zeigeWerbung(false, lief => { if(!lief) schuldigSetzen(true); }, darfNoch);
    } else {
      schuldigSetzen(true);     // nicht verloren, nur verschoben
    }
  }, 1200);
}
/* Android fragt erst beim allerersten Zugriff nach dem Mikrofon – und die
   Spracherkennung bricht in derselben Sekunde mit „nicht erlaubt" ab,
   bevor jemand antworten konnte. Deshalb holen wir die Erlaubnis schon
   beim Start der Lektion ein, sobald darin eine Sprechaufgabe steckt:
   Wir öffnen kurz das Mikrofon und schließen es sofort wieder – uns geht
   es nur um die Rückfrage. Sagt jemand Nein, passiert nichts Schlimmes,
   die Sprechaufgabe lässt sich überspringen.
   Gefragt wird nur einmal je Sitzung; Android merkt sich die Antwort. */
let mikroGefragt = false;
async function mikroVorbereiten(){
  if(mikroGefragt) return;
  mikroGefragt = true;
  const H = hoererPlugin();
  if(H){
    // Das Plugin fragt selbst und zeigt dabei Androids Abfrage.
    try{
      const r = await H.checkPermissions();
      if(r.speechRecognition !== 'granted') await H.requestPermissions();
    }catch(e){}
    return;
  }
  const md = navigator.mediaDevices;
  if(!md || !md.getUserMedia) return;
  try{
    const strom = await md.getUserMedia({audio:true});
    strom.getTracks().forEach(s=>s.stop());
  }catch(e){}
}

let Tx = null;
function buildTest(){
  const c = cur();
  const eigene = shuffle(c.words.slice());
  const gram = shuffle(((GRAMMAR[c.id]||{}).uebungen||[]).slice()).slice(0,3);
  let basisIds = (c.baut_auf && c.baut_auf.length) ? c.baut_auf : CATEGORIES.slice(0, catIdx).map(x=>x.id);
  const basisWords = shuffle(basisIds.flatMap(id => (byId(id)||{words:[]}).words.map(w=>({w, rep:byId(id).label, pool:byId(id).words}))));
  const nRep = Math.min(TEST_WIEDERHOLUNG, basisWords.length);
  const nOwn = Math.min(TEST_FRAGEN - nRep - gram.length, eigene.length);
  const picks = [...eigene.slice(0,nOwn).map(w=>({w})), ...basisWords.slice(0,nRep)];
  while(picks.length + gram.length < TEST_FRAGEN) picks.push({w:eigene[Math.floor(Math.random()*eigene.length)]});
  const qs = picks.map((p,i)=>{ let typ = i%3===0 ? 'mcrev' : 'mc'; if(typable(p.w) && i%4===2) typ = 'type'; return {...p, typ}; });
  gram.forEach(g => qs.push({g, typ:'gram'}));
  Tx = {qs:shuffle(qs), i:0, right:0, results:[]};
