     das Tab-Symbol sonst sehr lange, auch ohne Zwischenspeicher. -->

<!-- Schriften und Animationsbibliothek liegen hier im Ordner, nicht bei
     Google oder Cloudflare. So baut die App beim Start keine Verbindung
     nach außen auf und überträgt keine IP-Adresse an Dritte.
     Herkunft und Lizenzen: web/LIZENZEN.txt -->
<link href="schriften.css" rel="stylesheet">
<script src="lottie.min.js"></script>
<!-- Das Aussehen VOR dem ersten Zeichnen setzen. Stuende das unten im grossen
     Skript, blitzte beim Start kurz die falsche Fassung auf - hell auf einem
     dunkel gestellten Handy blendet richtig. Deshalb diese sechs Zeilen hier
     oben, noch vor dem Stil.
     Kein data-theme heisst: so, wie das Geraet eingestellt ist. Gespeichert
     wird deutsch ("hell"/"dunkel"), im Merkmal steht englisch - das Merkmal
     gehoert zum Stil, der gespeicherte Wert zur App. Umgesetzt wird das an
     genau zwei Stellen: hier und in themeAnwenden(). -->
<script>
  try{
    var w = localStorage.getItem('zmaj_theme');
    if(w === 'hell')   document.documentElement.dataset.theme = 'light';
    if(w === 'dunkel') document.documentElement.dataset.theme = 'dark';
  }catch(e){}
</script>

       blau und jeder Balken gelb, dadurch standen auf dem Lernpfad nach
       Farbton nur vier Toene.
       Drei Farbtoene sind belegt und bleiben frei: Gruen 148 heisst
       "richtig", Rot 3 heisst "falsch", Gelb 48 ist der Akzent. Mit 26 Grad
       Abstand um jeden bleibt der Bogen von 175 bis 336 Grad, und darauf
       liegen die neun Toene mit 20 Grad Abstand. Sektion 1 behaelt das Blau
       der App und der Fahne, danach geht es den Bogen hinauf und am Ende
       herum.
       Weil 20 Grad allein zu wenig sind, um zwei Nachbarn auf einer grossen
       Flaeche zu unterscheiden, ist bei jeder zweiten Sektion der Grund eine
       Stufe kraeftiger. Dadurch unterscheiden sich Nachbarn in Farbton UND

       Hier sind die Toene dunkler als in der dunklen Fassung, sonst leuchten

    --sek4:#D487D9; --sek4-dunkel:#B261B8; --sek4-sanft:#532956; --sek4-grund:#271528; --sek4-flaeche:#4C2C4E; --sek4-linie:#69416C; --sek4-matt:#CAADCD; --sek4-fuell:#D487D9; --sek4-fuell-dunkel:#B261B8;   /* Purpur */

  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--bg); color:var(--ink); font-family:var(--font-ui); font-weight:500;
    -webkit-font-smoothing:antialiased; line-height:1.5;
    min-height:100vh; display:flex; flex-direction:column; align-items:center;
    padding:16px 16px 48px;
  }
  .wrap{width:100%; max-width:540px}
  /* Der Stern trifft alles - auch den Vorspann. Dessen Notaus-Animation
     muss aber bleiben: sie ist der einzige Weg, das Logo wegzunehmen,
     wenn das Skript nicht anlaeuft. Deshalb :not(#vorspann). */
  .no-anim *:not(#vorspann){transition:none!important; animation:none!important}
  /* Wer die Bewegung abschaltet, bekommt dasselbe Endbild wie bei der
     Systemeinstellung - sonst bleibt die Glut als gelber Fleck vor der
     Schnauze stehen. Gemeldet am 23.09.2026. */
  .no-anim #vsGlut, .no-anim #vsFeuer{opacity:0}
  .no-anim #vsText{fill:#FFFFFF}

  /* ---------- Kopf ---------- */
  /* Drei Spalten: links Herzen, Mitte Muenzen, rechts Knoepfe. Die beiden
     aeusseren sind gleich breit (1fr), also sitzt die mittlere genau in der
     Mitte der Zeile - unabhaengig davon, wie breit Herzen und Knoepfe gerade
     sind. Mit dem alten Nebeneinander hing die Muenzpille an den Herzen und
     stand 40 Punkte zu weit links. Ajdin am 18.09.2026. */
  header{display:grid; grid-template-columns:1fr auto 1fr; align-items:center;
    gap:8px; margin-bottom:14px; min-height:40px}
  header .left{grid-column:1; justify-self:start; display:flex; align-items:center; gap:10px}
  /* Drinnen ist die Kopfzeile eine Werkzeugleiste, kein Briefkopf: Logo,
     Wortmarke und Untertitel treten ab, sobald man angemeldet ist. */
  body:not(.vorAnmeldung) header .left{display:none}
  .hbtns{grid-column:3; justify-self:end}
  .flag{width:34px; height:34px; border-radius:9px; flex:0 0 auto}
  .mark{font-family:var(--font-ui); font-weight:800; font-size:26px; color:var(--primary); letter-spacing:-.3px; line-height:1}
  .mark .dot{color:var(--accent)}
  .tag{font-size:12px; color:var(--muted); font-weight:700}
  /* Auf der Anmeldeseite steht unter dem Logo kein Untertitel, dafür der
     große Titel in der Mitte. Damit das Logo dort nicht verloren wirkt,
     wird es eine Nummer größer. Im Lernpfad bleibt der Kopf kompakt. */
  body.vorAnmeldung header{margin-bottom:4px}
  body.vorAnmeldung .flag{width:46px; height:46px; border-radius:12px}
  body.vorAnmeldung .mark{font-size:36px; letter-spacing:-.6px}
  @media (max-width:420px){
    body.vorAnmeldung .flag{width:40px; height:40px; border-radius:11px}
    body.vorAnmeldung .mark{font-size:31px}
  }
  /* Große Überschrift auf der Anmeldeseite. Dort ist Platz dafür; im
     Lernpfad bleibt der kleine Titel oben im Kopf, damit die Übungen
     nicht nach unten rutschen. */
  .seitentitel{font-family:var(--font-ui); font-size:30px; font-weight:800;
    text-align:center; color:var(--text); margin:22px 0 18px; letter-spacing:-.4px; line-height:1.15}
  @media (max-width:420px){
    .seitentitel{font-size:25px; margin:16px 0 14px}
    /* Am Handy nimmt der Drache sonst ein Drittel der Breite weg */
    .hero{gap:10px; padding:12px}
    .hero .zmaj{width:96px; height:96px; flex:0 0 96px}
  }
  .hbtns{display:flex; gap:6px}
  .back{
    border:2px solid var(--line); background:var(--surface); color:var(--ink); font-family:inherit; font-size:13px; font-weight:800;
    padding:7px 12px; border-radius:99px; cursor:pointer; transition:.15s;
  }
  .back:hover{border-color:var(--primary); color:var(--primary)}

  /* ---------- Maskottchen ---------- */
  /* Maskottchen: Bild aus web/maskottchen (wenn vorhanden), sonst Vektor. Bewegung per CSS. */
  .zmaj{width:136px; height:136px; flex:0 0 auto; filter:drop-shadow(0 6px 8px rgba(0,0,0,.28))}
  .celebrate .zmaj{width:180px; height:180px}
  .zmaj>img,.zmaj>svg,.zmaj-anim{width:100%; height:100%; display:block; object-fit:contain; transform-origin:50% 100%}
  .zmaj-anim svg{display:block}
  .zmaj.idle>img,.zmaj.idle>svg{animation:zIdle 3.2s ease-in-out infinite}
  .zmaj.cheer>img,.zmaj.cheer>svg{animation:zCheer 1.1s cubic-bezier(.34,1.56,.64,1)}
  .zmaj.sad>img,.zmaj.sad>svg{animation:zSad 3.4s ease-in-out infinite; filter:saturate(.75)}
  .zmaj.ok>img,.zmaj.ok>svg{animation:zPop .55s cubic-bezier(.34,1.56,.64,1)}
  .zmaj.no>img,.zmaj.no>svg{animation:zShake .5s ease-in-out}
  .zmaj.mini{width:112px; height:112px; position:absolute; right:6px; top:2px; filter:drop-shadow(0 3px 4px rgba(0,0,0,.25))}
  #lesson .card{padding-top:34px}
  #lesson .tbar{margin-right:110px}
  #lesson .kicker{margin-right:100px}
  @media (max-width:480px){ .zmaj.mini{width:84px; height:84px} #lesson .tbar{margin-right:86px} #lesson .kicker{margin-right:80px} }
  .card{position:relative}
  @keyframes zIdle{0%,100%{transform:translateY(0) rotate(0) scale(1)}35%{transform:translateY(-5px) rotate(-1.5deg) scale(1.02)}70%{transform:translateY(-2px) rotate(1.2deg) scale(1.01)}}
  @keyframes zCheer{0%,100%{transform:translateY(0) rotate(0) scale(1)}30%{transform:translateY(-16px) rotate(-6deg) scale(1.06)}60%{transform:translateY(-4px) rotate(5deg) scale(1.03)}}
  @keyframes zSad{0%,100%{transform:translateY(3px) rotate(-3deg) scale(.97)}50%{transform:translateY(5px) rotate(-5deg) scale(.96)}}
  @keyframes zPop{0%{transform:scale(1)}40%{transform:scale(1.22) rotate(-4deg)}70%{transform:scale(.96) rotate(3deg)}100%{transform:scale(1)}}
  @keyframes zShake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px) rotate(-4deg)}40%{transform:translateX(6px) rotate(4deg)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
  .hero{
    display:flex; align-items:center; gap:14px; background:linear-gradient(135deg,var(--primary),var(--primary-dark)); color:#fff;
    border-radius:var(--radius); padding:14px 16px; margin-bottom:12px; position:relative; overflow:hidden;
  }
  .hero::after{content:''; position:absolute; right:-40px; top:-60px; width:200px; height:200px; background:var(--accent); opacity:.18; transform:rotate(25deg); border-radius:20px}
  /* display:block hebt das flex der allgemeinen .bubble-Regel auf. Sonst
     stünden Gruß und Erklärung nebeneinander statt untereinander - am
     Handy werden daraus zwei viel zu schmale Spalten. */
  .hero .bubble{
    display:block; background:#fff; color:#0F1E4D; border-radius:14px; padding:10px 14px;
    font-weight:800; font-size:14px; position:relative; flex:1; z-index:1; min-height:0;
  }
  .hero .bubble::before{content:''; position:absolute; left:-8px; top:18px; border:8px solid transparent; border-right-color:#fff; border-left:0}
  .hero .bubble small{display:block; font-weight:600; color:#5E6B94; margin-top:4px; font-size:12px}

  /* ---------- Startseite ---------- */
  /* ---- Oben auf der Startseite: Serie und Drache nebeneinander ----
     Entwurf A+C+D, eingebaut am 26.09.2026. */
  .obenreihe{display:flex; align-items:center; gap:8px; margin-bottom:10px}
  .serieblock{flex:1; min-width:0}
  .seriezahl{font-family:var(--font-display); font-size:46px; font-weight:700;
             line-height:1; display:flex; align-items:baseline; gap:8px}
  .seriezahl span:first-child{font-size:30px}
  /* Am Handy naehme der Drache in seiner vollen Groesse die halbe Breite. */
  .obenreihe .zmaj{width:120px; height:120px; flex:0 0 120px}
  .obenreihe .streakline{margin:7px 0 0}
  /* .btn hat flex:1 und steht sonst immer in einer Reihe. Dieser hier
     steht allein, also braucht er seine Breite selbst. */
  .weiterknopf{display:block; width:100%; margin-bottom:12px}

  /* ---- Die drei Tagesaufgaben als Ringe ----
     Aus Entwurf B. Als Liste untereinander kosteten sie drei Zeilen und
     sagten trotzdem nicht auf einen Blick, wie weit man ist. */
  .qringe{display:flex; gap:7px}
  /* --primary-soft statt --bg: der Grund ist dunkler als die Karte, in
     der die Ringe liegen - sie sahen aus wie Loecher. Der blasse Ton der
     Sektion legt sie darueber und faerbt sie mit. */
  .qring{flex:1; min-width:0; text-align:center; background:var(--primary-soft);
         border:1px solid var(--line); border-radius:11px; padding:9px 5px;
         font-size:11px; font-weight:800; color:var(--ink); line-height:1.25}
  /* Die Zahl im Ring hat dieselbe Schriftfarbe wie der Text darunter.
     Bis zum 26.09.2026 stand sie in Gelb - das ist der Akzent der App und
     heisst dort "dein Fortschritt": die Balken in den Levels, "Jetzt dran",
     die Muenzen. Im Ring bedeutete es nichts, es sah nur anders aus als
     alles daneben. Die Sektionsfarbe scheidet aus, sie kaeme auf dem
     blassen Ringgrund nur auf 3,9 zu 1 - die Schwelle ist 4,5.
     Welcher Ring offen und welcher geschafft ist, sagt ohnehin der Grund
     des Rings: blass oder gruen. */
  .qring .kreisel{width:36px; height:36px; margin:0 auto 6px; border-radius:50%;
                  display:grid; place-items:center; font-size:13px; font-weight:800;
                  background:var(--primary-soft); color:var(--ink)}
  .qring.fertig{color:var(--muted)}
  .qring.fertig .kreisel{background:var(--good); color:var(--on-primary)}

  .mode{display:flex; gap:6px; background:var(--primary-soft); padding:5px; border-radius:99px; margin-bottom:12px}
  .mode button{
    flex:1; border:0; background:transparent; color:var(--primary); font-family:inherit; font-size:14px; font-weight:800;
    padding:10px 6px; border-radius:99px; cursor:pointer; white-space:nowrap;
  }
  /* Drei Reiter werden auf schmalen Handys sonst umgebrochen */
  @media (max-width:430px){ .mode button{font-size:12.5px; padding:10px 4px} }
  @media (max-width:340px){ .mode button{font-size:11.5px} }
  .mode button[aria-selected="true"]{background:var(--primary-fill); color:var(--on-fill)}
  /* Dieselbe Leiste dient in den Einstellungen als Dreierwahl fuer das
     Aussehen. Dort ist es keine Reiterreihe, sondern eine Auswahl - deshalb
     aria-checked statt aria-selected. Beide sehen gleich aus. */
  .mode button[aria-checked="true"]{background:var(--primary-fill); color:var(--on-fill)}
  .streakline{display:flex; align-items:center; gap:10px; flex-wrap:wrap; font-size:13px; color:var(--muted); font-weight:700; margin:0 0 12px 4px}
  .streakline b{color:var(--ink)}
  .streakline .frost{color:var(--primary); background:var(--primary-soft); border-radius:99px; padding:2px 10px; font-weight:800}
  .streakline .lost{color:var(--bad); font-weight:800}
  /* ---------- Tagesaufgaben ---------- */
  .quests{margin:0 0 12px; padding:10px 12px; border:2px solid var(--line); border-radius:14px; background:var(--surface)}
  .qkopf{display:flex; justify-content:space-between; align-items:center; font-size:12px; font-weight:800; color:var(--muted); margin-bottom:6px}
  .qkopf .muenzen{color:var(--ink)}
  /* Die Tagesaufgaben standen bis zum 26.09.2026 als Liste untereinander,
     mit Haken, Zahl und einem duennen Balken je Zeile. Jetzt sind es drei
     Ringe, der Stil dafuer steht weiter unten bei .qringe. Die alten
     Regeln sind hier entfernt, es gab kein Element mehr dazu. */
  .qalle{margin-top:6px; font-size:12px; font-weight:800; color:var(--good)}
  /* ---------- Laden ---------- */
  .ware{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 0; border-top:1px solid var(--line)}
  /* Nur die Zeile mit ZWEI Wegen darf umbrechen. flex-wrap auf .ware
     insgesamt zu legen war falsch - damit brachen auch Kopf, Hals, Brille
     und Farbe auf und wurden hoeher. Ajdin am 27.09.2026: "die anderen sind
     auch komisch gemacht worden". */
  .ware.zweiwege{flex-wrap:wrap}
  .ware:first-of-type{border-top:0}
  .ware .wt{font-weight:800; font-size:14px}
  .ware .wd{font-size:12px; color:var(--muted)}
  /* Alle Knoepfe im Laden gleich breit, damit die Spalte ruhig bleibt */
  .btn.kauf{flex:0 0 auto; min-width:104px; padding-left:12px; padding-right:12px; text-align:center}
  /* Zwei Wege zum selben Stueck - beim Herz der Preis und das Video. */
  /* Zwei Wege zum selben Stueck - beim Herz der Preis und das Video. Sie
     bekommen eine EIGENE ZEILE unter dem Namen, wie auf dem Schirm nach der
     Lektion. Nebeneinander im rechten Feld der Zeile war zu eng: gemessen
     liefen sie 41 Pixel ueber den Rand, der Titel wurde auf 60 Pixel
     gequetscht und die Zeile 174 statt 60 Pixel hoch.
     flex:1 0 100% erzwingt die eigene Zeile, flex:1 an den Knoepfen teilt
     sie gleichmaessig - dasselbe Bild wie .row.schmal.
     nowrap und weniger Polsterung, weil "Video ansehen" sonst umbrach und
     die Knoepfe 71 statt 50 Pixel hoch machte. */
  .kaufwege{display:flex; gap:8px; flex:1 0 100%; margin-top:8px}
  .kaufwege .btn.kauf{flex:1; min-width:0; white-space:nowrap;
                      font-size:14px; padding-left:8px; padding-right:8px}

  /* ---------- Sprachwahl ---------- */
  .langbar{display:flex; gap:6px; flex-wrap:wrap; justify-content:center; margin:0 0 14px}
  .langbar button{
    border:2px solid var(--line); background:var(--surface); color:var(--muted); font-family:inherit; font-size:13px; font-weight:800;
    padding:6px 12px; border-radius:99px; cursor:pointer; transition:.15s;
  }
  .langbar button:hover{border-color:var(--primary)}
  .langbar button.on{border-color:var(--primary); color:var(--primary); background:var(--primary-soft)}
  .summary{font-size:13px; color:var(--muted); margin:2px 0 14px 4px; font-weight:700}
  .stufe{display:inline-block; font-size:11px; color:var(--on-accent); background:var(--accent); border-radius:99px; padding:1px 8px; margin-left:8px; vertical-align:middle; font-weight:800}
  .section{
    background:var(--surface); border:2px solid var(--line); border-radius:var(--radius);
    padding:16px 16px 6px; margin-bottom:14px;
  }
  /* Welche Sektion welche Farbe traegt. Es gibt vier; eine fuenfte bekaeme
     wieder die erste, siehe die Zuweisung in renderPath().
     Der farbige Streifen haengt an diesen Klassen und NICHT an .section:
     die Einstellungen benutzen dieselbe Klasse fuer ihre neun Kaesten
     (Laden, Profil, Lernserie, Vollversion, Sprache, Lernen, Sicherung,
     Ueber die App). Die haetten sonst alle einen blauen Streifen bekommen.
     Am 26.09.2026 genau so passiert und hier behoben.
     Der Streifen steht nach der Kurzschreibweise border: darueber, sonst
     ueberschriebe sie ihn wieder. */
  /* ---- Die ganze App traegt die Farbe der laufenden Sektion ----
     data-sek steht am Wurzelelement und wird in sektionsFarbe() gesetzt.
     Diese vier Zeilen biegen --primary und seine zwei Begleiter um; alle
     45 Stellen, die var(--primary) benutzen, folgen damit von selbst -
     Knoepfe, Ueberschriften, Geschichten, Einstellungen.
     Gelb bleibt unangetastet. Es ist der Akzent, die zweite Farbe der
     Fahne, und es traegt "Jetzt dran", die Muenzen und die Balken in den
     Levels. Waere es die Farbe einer Sektion, gaebe es diese Anker nicht
     mehr.
     Sektion 1 traegt genau die Werte, die die App vorher fest hatte. */
  /* Nicht nur die Hauptfarbe: auch der Grund nimmt den Ton an.
     Die Helligkeiten sind genau die, die die App vorher fest hatte -
     Grund 12, Flaeche 18, Linie 28, gedaempft 74 Prozent in der
     dunklen Fassung. Nur der Farbton wandert, deshalb bleibt der
     Kontrast ueberall gleich.
     Ajdin am 26.09.2026: "das hintergrund soll die farbe annehmen
     nicht nur dieser rand". */
  :root[data-sek="1"]{
    --primary:var(--sek1); --primary-dark:var(--sek1-dunkel);
    --primary-soft:var(--sek1-sanft); --bg:var(--sek1-grund);
    --primary-fill:var(--sek1-fuell); --primary-fill-dark:var(--sek1-fuell-dunkel);
    --surface:var(--sek1-flaeche); --line:var(--sek1-linie);
    --muted:var(--sek1-matt);
  }
  :root[data-sek="2"]{
    --primary:var(--sek2); --primary-dark:var(--sek2-dunkel);
    --primary-soft:var(--sek2-sanft); --bg:var(--sek2-grund);
    --primary-fill:var(--sek2-fuell); --primary-fill-dark:var(--sek2-fuell-dunkel);
    --surface:var(--sek2-flaeche); --line:var(--sek2-linie);
    --muted:var(--sek2-matt);
  }
  :root[data-sek="3"]{
    --primary:var(--sek3); --primary-dark:var(--sek3-dunkel);
    --primary-soft:var(--sek3-sanft); --bg:var(--sek3-grund);
    --primary-fill:var(--sek3-fuell); --primary-fill-dark:var(--sek3-fuell-dunkel);
    --surface:var(--sek3-flaeche); --line:var(--sek3-linie);
    --muted:var(--sek3-matt);
  }
  :root[data-sek="4"]{
    --primary:var(--sek4); --primary-dark:var(--sek4-dunkel);
    --primary-soft:var(--sek4-sanft); --bg:var(--sek4-grund);
    --primary-fill:var(--sek4-fuell); --primary-fill-dark:var(--sek4-fuell-dunkel);
    --surface:var(--sek4-flaeche); --line:var(--sek4-linie);
    --muted:var(--sek4-matt);
  }
  :root[data-sek="5"]{
    --primary:var(--sek5); --primary-dark:var(--sek5-dunkel);
    --primary-soft:var(--sek5-sanft); --bg:var(--sek5-grund);
    --primary-fill:var(--sek5-fuell); --primary-fill-dark:var(--sek5-fuell-dunkel);
    --surface:var(--sek5-flaeche); --line:var(--sek5-linie);
    --muted:var(--sek5-matt);
  }
  :root[data-sek="6"]{
    --primary:var(--sek6); --primary-dark:var(--sek6-dunkel);
    --primary-soft:var(--sek6-sanft); --bg:var(--sek6-grund);
    --primary-fill:var(--sek6-fuell); --primary-fill-dark:var(--sek6-fuell-dunkel);
    --surface:var(--sek6-flaeche); --line:var(--sek6-linie);
    --muted:var(--sek6-matt);
  }
  :root[data-sek="7"]{
    --primary:var(--sek7); --primary-dark:var(--sek7-dunkel);
    --primary-soft:var(--sek7-sanft); --bg:var(--sek7-grund);
    --primary-fill:var(--sek7-fuell); --primary-fill-dark:var(--sek7-fuell-dunkel);
    --surface:var(--sek7-flaeche); --line:var(--sek7-linie);
    --muted:var(--sek7-matt);
  }
  :root[data-sek="8"]{
    --primary:var(--sek8); --primary-dark:var(--sek8-dunkel);
    --primary-soft:var(--sek8-sanft); --bg:var(--sek8-grund);
    --primary-fill:var(--sek8-fuell); --primary-fill-dark:var(--sek8-fuell-dunkel);
    --surface:var(--sek8-flaeche); --line:var(--sek8-linie);
    --muted:var(--sek8-matt);
  }
  :root[data-sek="9"]{
    --primary:var(--sek9); --primary-dark:var(--sek9-dunkel);
    --primary-soft:var(--sek9-sanft); --bg:var(--sek9-grund);
    --primary-fill:var(--sek9-fuell); --primary-fill-dark:var(--sek9-fuell-dunkel);
    --surface:var(--sek9-flaeche); --line:var(--sek9-linie);
    --muted:var(--sek9-matt);
  }

  /* ---- Weicher Uebergang beim Sektionswechsel ----
     Wenn die naechste Sektion dran ist, soll die neue Farbe hineinlaufen
     statt umzuspringen.
     Die Regel gilt nur, solange die Klasse farbwechsel gesetzt ist. Stuende
     sie immer, zoege auch die Rueckmeldung auf eine Antwort traege
     hinterher - gruen fuer richtig soll sofort da sein. sektionsFarbe()
     setzt die Klasse und nimmt sie nach einer Dreiviertelsekunde weg.
     --bg selbst laesst sich nicht ueberblenden. Was sich ueberblenden
     laesst, ist das, was daraus wird: die Hintergrundfarbe des Elements.
     Deshalb steht hier background-color und nicht --bg.
     !important, weil .btn eine eigene, schnellere Ueberblendung hat und
     sonst als die genauere Regel gewaenne.
     Die Regel fuer "weniger Bewegung" steht weiter unten im Stil und
     gewinnt gegen diese hier - das soll so sein. */
  :root.farbwechsel, :root.farbwechsel *{
    transition: background-color .55s ease, background-image .55s ease,
                color .55s ease, border-color .55s ease,
                box-shadow .55s ease, fill .55s ease !important;
  }

  /* ---- Auf- und Zuklappen ----
     Es ist immer genau eine Sektion offen. Die anderen zeigen nur ihren
     Kopf. Das kuerzt den Lernpfad von fast viertausend Pixeln auf gut
     einen Bildschirm und macht das Aufklappen zu der Geste, an der die
     Farbe der App haengt. */
  .skopf{cursor:pointer; -webkit-user-select:none; user-select:none;
         position:relative; padding-right:24px}
  /* Das Dreieck ist gezeichnet, nicht als Zeichen gesetzt. Als Schriftzeichen
     kam es je nach Geraet als duenner Strich heraus. Aus vier Raendern
     gebaut sieht es ueberall gleich aus.
     Es dreht sich, statt dass zwei Formen getauscht werden: so ist die
     Bewegung sichtbar. */
  .skopf::after{content:''; position:absolute; right:2px; top:10px;
                width:0; height:0; border:6px solid transparent;
                border-top-color:var(--muted); transition:transform .25s}
  .section:not(.zu) > .skopf::after{transform:rotate(180deg)}
  .skopf:focus-visible{outline:3px solid var(--accent); outline-offset:3px;
                       border-radius:8px}
  /* Eingeklappt faellt die Beschreibung weg, nicht nur die Level: sonst
     waere der Kopf immer noch drei Zeilen hoch. */
  .section.zu > .skopf .desc, .section.zu .levels{display:none}
  .section.zu{padding-bottom:14px}

  .section.sek1, .section.sek2, .section.sek3, .section.sek4, .section.sek5, .section.sek6, .section.sek7, .section.sek8, .section.sek9{ position:relative }
  /* Der Streifen laeuft von der eigenen Farbe in die der naechsten Sektion.
     Scrollt man den Lernpfad hinunter, gehen die Farben ineinander ueber,
     statt hart zu springen. Bei der letzten bleibt er einfarbig, dafuer
     sorgt renderPath().
     Ein Rahmen kann keinen Verlauf tragen, deshalb ein eigenes Element.
     Es liegt zwei Pixel weiter links und oben, damit es den Rahmen der
     Karte an dieser Seite ueberdeckt statt neben ihm zu stehen. */
  .section.sek1::before, .section.sek2::before, .section.sek3::before, .section.sek4::before, .section.sek5::before, .section.sek6::before, .section.sek7::before, .section.sek8::before, .section.sek9::before{
    content:''; position:absolute; left:-2px; top:-2px; bottom:-2px; width:5px;
    border-radius:var(--radius) 0 0 var(--radius);
    background:linear-gradient(180deg, var(--sek), var(--sek-next, var(--sek)));
  }
  .section.sek1{--sek:var(--sek1)}
  .section.sek2{--sek:var(--sek2)}
  .section.sek3{--sek:var(--sek3)}
  .section.sek4{--sek:var(--sek4)}
  .section.sek5{--sek:var(--sek5)}
  .section.sek6{--sek:var(--sek6)}
  .section.sek7{--sek:var(--sek7)}
  .section.sek8{--sek:var(--sek8)}
  .section.sek9{--sek:var(--sek9)}
  /* Bis zum 26.09.2026 stand hier opacity:.6 - die gesperrten Sektionen
     waren also zu 40 Prozent durchsichtig, und der Grund schien hindurch.
     Der Tester am selben Tag: "weil die Boxen durchsichtig sind mischt
     sich ihr Dunkelgrau mit dem Hintergrund und deshalb wirken die Farben
     so matt". Er hatte recht, und opacity faerbt ausserdem alles mit -
     Schrift, Rahmen, Balken.
     Jetzt bleibt der Kasten blickdicht, und gesperrt wird ueber die Farbe
     gesagt: gedaempfte Schrift, blasserer Rand. */
  .section.locked{border-color:var(--primary-soft)}
  .section.locked h2, .section.locked .skopf::after{color:var(--muted)}
  .section.locked .sbar i{background:var(--muted)}
  .section h2{font-family:var(--font-ui); font-weight:800; font-size:18px; margin:0 0 2px; color:var(--sek, var(--primary))}
  .section .desc{font-size:13px; color:var(--muted); margin-bottom:10px}
  .section .sbar{height:8px; background:var(--primary-soft); border-radius:99px; overflow:hidden; margin-bottom:6px}
  .section .sbar i{display:block; height:100%; background:var(--sek, var(--accent)); width:0; transition:width .4s}
  .section .scap{font-size:12px; color:var(--muted); margin-bottom:6px; font-weight:700}
  .node{
    display:flex; align-items:center; gap:14px; width:100%; text-align:left;
    border:0; background:transparent; color:var(--ink); font-family:inherit; padding:10px 2px; cursor:pointer;
    border-top:1px solid var(--line);
  }
  .node:hover .circle{transform:scale(1.06)}
  .node .circle{
    flex:0 0 44px; width:44px; height:44px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-weight:800; font-size:15px; border:3px solid var(--line); color:var(--muted); background:var(--surface); transition:.15s;
    box-shadow:0 3px 0 var(--line);
  }
  /* Erledigte Level: blasse Scheibe mit kraeftigem Rand. Der Rand bleibt
     --primary, sonst verschwaemme der Kreis auf dem hellen Grund. */
  .node.done .circle{background:var(--primary-fill); border-color:var(--primary); color:var(--on-fill); box-shadow:0 3px 0 var(--primary-fill-dark)}
  .node.current .circle{background:var(--accent); border-color:var(--accent); color:var(--on-accent); box-shadow:0 3px 0 var(--accent-dark)}
  .node.locked{cursor:not-allowed}
  .node.locked .label{color:var(--muted)}
  .node .txt{flex:1; min-width:0}
  .node .label{font-weight:800; font-size:15px}
  /* Titel und Schwierigkeit in EINER Zeile. Vorher rutschte das Schildchen
     bei langen Titeln ("Razgovor za posao") in die naechste Zeile, bei kurzen
     nicht - die Liste wirkte dadurch zerfasert. Ajdin am 18.09.2026.
     Jetzt kuerzt der Titel ab, das Schildchen bleibt stehen. */
  .node .label.mitstufe{display:flex; align-items:center; gap:8px; min-width:0}
  .node .label.mitstufe .titel{min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .node .label.mitstufe .stufe{margin-left:0; flex:0 0 auto}
  .node .tipp{font-size:12px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .node .mini{height:5px; background:var(--primary-soft); border-radius:99px; margin-top:6px; overflow:hidden; width:120px}
  .node .mini i{display:block; height:100%; background:var(--accent); width:0}
  .node .state{font-size:12px; color:var(--muted); white-space:nowrap; font-weight:800}
  .node.current .state{color:var(--accent-dark)}
  .node.done .state{color:var(--good)}

  /* Regeln fürs Passwort: hakt ab, was schon erfüllt ist */
  .pwregeln{font-size:12px; color:var(--muted); line-height:1.9; margin:-2px 0 2px}
  .pwregeln b{display:block; font-weight:700; margin-bottom:2px}
  .pwregeln span{display:inline-block; margin-right:12px; white-space:nowrap}
  .pwregeln span::before{content:"○ "; font-weight:700}
  .pwregeln span.ok{color:var(--good)}
  .pwregeln span.ok::before{content:"✓ "}
  /* Werbung: ganzseitig über allem, damit sie nicht mit der App verwechselt
     wird. Der Rahmen und das Wort "Anzeige" sind Pflicht. */
  /* Deckend, nicht durchscheinend. Vorher sah man die Lektion durch die
     Werbung hindurch – das wirkte, als hinge das Fenster nur davor. */
  .werbung{position:fixed; inset:0; z-index:999; background:#060C20;
    display:flex; align-items:center; justify-content:center; padding:18px}
  /* --surface, nicht --card: eine Farbe dieses Namens gibt es hier nicht,
     und ein unbekannter Wert macht die Flaeche unsichtbar statt bunt. */
  .werbebox{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    padding:16px; width:100%; max-width:420px; text-align:center}
  .werbemarke{font-size:11px; font-weight:800; letter-spacing:.12em; text-transform:uppercase;
    color:var(--muted); margin-bottom:10px}
  .werbeflaeche{min-height:230px; display:flex; align-items:center; justify-content:center;
    border:2px dashed var(--line); border-radius:12px; color:var(--muted);
    font-size:13px; padding:16px; line-height:1.5}
  .werbenote{font-size:12px; color:var(--muted); font-weight:700; margin-top:10px; min-height:16px}
  .werbebox .btn{width:100%; margin-top:10px}
  .werbebox .skip{margin-top:8px}
  /* Eine kurze Meldung, die von selbst wieder geht. Gebraucht wird sie,
     seit die Anzeige auf dem Geraet ausfallen darf: wer auf „Video
     ansehen“ tippt und ohne Netz ist, sah sonst gar nichts. P8, 28.09.2026. */
  .kurznote{position:fixed; left:50%; bottom:86px; transform:translateX(-50%);
    z-index:1001; max-width:min(92vw,420px); padding:12px 16px; text-align:center;
    background:var(--surface); border:1px solid var(--line); border-radius:12px;
    box-shadow:0 8px 24px rgba(0,0,0,.35); color:var(--ink);
    font-size:14px; font-weight:700; line-height:1.4;
    opacity:0; transition:opacity .25s}
  .kurznote.an{opacity:1}
  /* Einwilligung: kommt beim ersten Start, bevor irgendeine Werbung läuft.
     Beide Knöpfe sind gleich groß und gleich auffällig – Ablehnen darf nach
     der DSGVO nicht umständlicher sein als Zustimmen. */
  .einwilligung{position:fixed; inset:0; z-index:1000; background:rgba(6,12,32,.86);
    display:flex; align-items:center; justify-content:center; padding:18px; overflow:auto}
  /* Deckend, nicht durchscheinend: vor dem Schliessen soll nichts mehr
     durchschimmern, sonst wirkt die Frage wie ein Versehen. */
  .nachfrage{position:fixed; inset:0; z-index:1000; background:rgba(6,12,32,.72);
    display:flex; align-items:center; justify-content:center; padding:18px; overflow:auto}
  .einwilligungbox, .nachfragebox{background:var(--surface); border:1px solid var(--line);
    border-radius:var(--radius);
    padding:18px; width:100%; max-width:440px; max-height:92vh; overflow:auto}
  .einwilligungbox h3, .nachfragebox h3{margin:0 0 10px; font-size:19px}
  .einwilligungbox .txt, .nachfragebox .txt{font-size:14px; line-height:1.6; color:var(--muted)}
  .einwilligungbox .btn, .nachfragebox .btn{width:100%; margin-top:10px}
  .einwilligungbox details{margin-top:14px}
  .einwilligungbox .fuss{font-size:12px; color:var(--muted); margin-top:12px; text-align:center}
  /* Nachfrage: kurz, mittig, schmaler als die Einwilligung. */
  .nachfragebox{max-width:340px; text-align:center; background:var(--surface);
    border:1px solid var(--line); box-shadow:0 18px 50px rgba(0,0,0,.55)}

  /* ---- Vollversion ----
     Der Weg zu Googles Abo-Seite. Kündigen kann die App nicht, das geht nur
     bei Google - also führt hier ein Verweis hin. Google verlangt diesen Weg
     ausdrücklich auf einem Einstellungsbildschirm. */
  .abolink{background:none; border:0; padding:0; cursor:pointer; font:inherit;
    color:var(--primary); text-decoration:underline; text-underline-offset:2px}
  .abowahl{display:flex; flex-direction:column; gap:10px; margin:14px 0 4px}
  .abokarte{display:flex; align-items:center; justify-content:space-between; gap:12px;
    width:100%; padding:14px; border-radius:var(--radius); border:1px solid var(--line);
    background:var(--bg); cursor:pointer; font:inherit; color:var(--ink); text-align:left}
  .abokarte:disabled{opacity:.45; cursor:default}
  /* Die gewählte Karte. Sie kauft nicht - dafür gibt es den Knopf darunter. */
  .abokarte[aria-checked="true"]{border-color:var(--primary); background:var(--primary-soft)}
  .abokarte .haken{font-weight:800; color:var(--primary); margin-right:6px}
  .abokarte .n{font-weight:800; font-size:15px}
  .abokarte .p{font-weight:800; font-size:17px; color:var(--primary); white-space:nowrap}
  /* Beides steht in derselben gelben Pille, untereinander: nebeneinander
     war die Zeile auf Deutsch zu lang, und in Grau darunter wirkte der
     Monatspreis wie eine Fussnote. Ajdin am 29.09.2026. */
  .abospar .promonat{display:block; font-weight:700; opacity:.9}
  .abospar{display:inline-block; margin-top:4px; font-size:11px; font-weight:800;
    text-align:center; line-height:1.4;
    color:var(--on-accent); background:var(--accent); border-radius:99px; padding:2px 8px}
  /* Der Drache im Kaufkasten. Niemand kauft eine Aufzaehlung, aber ein
     Bild, das man haben will. Ajdin am 29.09.2026. */
  .abovorschau{display:flex; flex-direction:column; align-items:center; margin:2px 0 6px}
  .abovorschau .zmaj-anim, .abovorschau .zmaj{width:150px; height:150px}
  .abovorschau .wort{font-size:12px; font-weight:800; color:var(--muted); margin-top:2px}
  .abohinweis{font-size:12px; line-height:1.5; color:var(--muted); margin-top:8px}

  /* ---- Wegmarke ----
     Dieselbe Huelle wie die Nachfrage, nur mit einer sehr grossen Zahl.
     Bewusst nichts Neues erfunden: ein zweiter Overlay-Bau waere eine
     zweite Stelle, an der man den Abstand zum Rand pflegen muesste. */
  .wegmarkebox{max-width:320px}
  .wegmarkebox .celebrate{margin-bottom:0}
  .wegmarkebox .zmaj{width:120px; height:120px}
  .wegzahl{font-family:var(--font-ui); font-weight:800; font-size:64px; line-height:1;
    letter-spacing:-2px; color:var(--accent); margin:2px 0 0}
  .wegwort{font-weight:800; font-size:15px; color:var(--ink); margin:0 0 10px}
  /* Die Schnipsel fallen ueber den ganzen Bildschirm, nicht nur ueber die
     Karte - deshalb position:fixed und nicht absolute.
     Sie werden nur dann ueberhaupt erzeugt, wenn Bewegung an ist: die Regel
     .no-anim * {animation:none} wuerde sie sonst als bunte Punkte oben am
     Rand einfrieren lassen, und das saehe aus wie ein Fehler. */
  .schnipsel{position:fixed; top:-18px; width:9px; height:14px; border-radius:2px;
    pointer-events:none; animation:schnipselFall linear forwards}
  @keyframes schnipselFall{
    from{transform:translateY(-20px) rotate(0deg); opacity:1}
    to{transform:translateY(104vh) rotate(720deg); opacity:.15}
  }
  /* Vorspann: das Studio-Zeichen beim Start.
     Er steht schon im HTML und nicht erst im Skript – sonst sähe man beim
     Laden erst eine leere Seite und danach das Logo.
     z-index 900: unter Einwilligung und Nachfrage (1000), damit die beim
     ersten Start darüber liegen können und nicht dahinter festhängen.
     Die Notaus-Animation blendet ihn nach zehn Sekunden von selbst weg –
     falls das Skript gar nicht erst anläuft, bleibt niemand hier stehen. */
  #vorspann{position:fixed; inset:0; z-index:900; background:#060C20;
    display:flex; align-items:center; justify-content:center; padding:24px;
    transition:opacity .45s ease; animation:vorspannNotaus .6s ease 10s forwards}
  #vorspann svg{width:min(320px,74vw); height:auto; display:block}
  #vorspann.weg{opacity:0; pointer-events:none}
  @keyframes vorspannNotaus{to{opacity:0; visibility:hidden}}
  /* Der Ablauf des Vorspanns. Zeiten in Sekunden:
       0,00–0,45  der Kopf kommt
       0,48–0,86  das Maul holt Luft
       0,70–1,75  Feuerstrahl nach rechts, dann zurück
       1,22–1,84  der Name wird von links nach rechts freigelegt
       1,28–2,23  er glüht von Gold auf Weiß aus
     Danach steht das Bild, bis vorspannWeg() es ausblendet. */
  #vsKopf{transform-box:view-box; transform-origin:136px 97px;
    animation:vsKopfAuf .45s cubic-bezier(.2,.8,.3,1) both}
  @keyframes vsKopfAuf{from{opacity:0; transform:scale(.9) translateY(6px)} to{opacity:1; transform:none}}
  #vsGlut{transform-box:view-box; transform-origin:248px 138px;
    animation:vsGlut .38s ease-out .48s both}
  @keyframes vsGlut{0%{opacity:0; transform:scale(.2)} 55%{opacity:.95; transform:scale(1.15)} 100%{opacity:0; transform:scale(.5)}}
  #vsFeuer{transform-box:view-box; transform-origin:246px 138px; opacity:0;
    animation:vsFeuer 1.05s ease-in-out .7s both}
  @keyframes vsFeuer{
    0%  {transform:scaleX(.04) scaleY(.45); opacity:0}
    10% {transform:scaleX(.40) scaleY(1.05); opacity:1}
    28% {transform:scaleX(1)   scaleY(.95); opacity:1}
    46% {transform:scaleX(.93) scaleY(1.07); opacity:1}
    62% {transform:scaleX(.99) scaleY(.92); opacity:1}
    78% {transform:scaleX(.70) scaleY(.85); opacity:.85}
    100%{transform:scaleX(.05) scaleY(.35); opacity:0}}
  /* Jede Zunge zuckt fuer sich. Die Takte sind absichtlich krumm
     (.27s bis .47s) - liefen sie im Gleichschritt, saehe es aus
     wie ein pulsierender Ballon und nicht wie Feuer. */
  .vsZunge{transform-box:fill-box; transform-origin:0 50%;
    animation:vsLecken .36s ease-in-out infinite alternate}
  @keyframes vsLecken{
    from{transform:scaleX(.80) scaleY(.86)}
    to{transform:scaleX(1.07) scaleY(1.14)}
  }
  #vsZ1{animation-duration:.37s; animation-delay:0s}
  #vsZ2{animation-duration:.43s; animation-delay:-.11s}
  #vsZ3{animation-duration:.31s; animation-delay:-.05s}
  #vsZ4{animation-duration:.47s; animation-delay:-.19s}
  #vsZ5{animation-duration:.34s; animation-delay:-.08s}
  #vsZ6{animation-duration:.41s; animation-delay:-.23s}
  #vsZ7{animation-duration:.29s; animation-delay:-.15s}
  #vsZ8{animation-duration:.39s; animation-delay:-.02s}
  #vsZ9{animation-duration:.33s; animation-delay:-.17s}
  #vsZ10{animation-duration:.27s; animation-delay:-.09s}
  #vsZ11{animation-duration:.36s; animation-delay:-.21s}
  #vsZ12{animation-duration:.45s; animation-delay:-.28s}
  @keyframes vsFunkeFlug{
    0%{opacity:0; transform:translate(0,0) scale(.4)}
    20%{opacity:.9}
    100%{opacity:0; transform:translate(120px,-30px) scale(.15)}
  }
  .vsFunke{transform-box:view-box; opacity:0;
    animation:vsFunkeFlug 1.3s ease-out infinite}
  #vsFk2{animation-delay:-.4s}
  #vsFk3{animation-delay:-.8s}
  #vsFk4{animation-delay:-1.2s}
  #vsFk5{animation-delay:-.6s}
  /* Das Maul geht auf, kurz bevor die Flamme kommt, und schliesst sich,
     wenn sie weg ist. Scharnier ist der hintere Maulwinkel. */
  #vsKiefer{transform-box:view-box; transform-origin:150px 142px;
    animation:vsMaul 1.45s ease-in-out .55s both}
  @keyframes vsMaul{
    0%{transform:rotate(0deg)}
    14%{transform:rotate(12deg)}
    55%{transform:rotate(9deg)}
    78%{transform:rotate(11deg)}
    100%{transform:rotate(0deg)}}
  #vsName{clip-path:url(#vsFrei)}
  #vsFrei rect{transform-box:view-box; transform-origin:290px 0;
    animation:vsFrei .62s cubic-bezier(.3,.7,.3,1) 1.22s both}
  @keyframes vsFrei{from{transform:scaleX(0)} to{transform:scaleX(1)}}
  #vsText{animation:vsGluehen .95s ease-out 1.28s both}
  @keyframes vsGluehen{0%{fill:#F5C400} 55%{fill:#FFE682} 100%{fill:#FFFFFF}}
  /* Wer keine Bewegung will, bekommt sofort das Endbild. */
  @media (prefers-reduced-motion:reduce){
    #vsKopf,#vsGlut,#vsFeuer,#vsKiefer,#vsFrei rect,#vsText,
    .vsZunge,.vsFunke{animation:none}
    #vsGlut,#vsFeuer{opacity:0}
    #vsText{fill:#FFFFFF}
  }
  .kontoform{display:grid; gap:10px; margin-top:16px}
  .kontoform .btn{margin-top:4px}
  .feldhinweis{font-size:12px; color:var(--muted); margin:-6px 0 0}
  /* Ein eigenes display: (flex, grid, block) schlägt das eingebaute
     display:none des hidden-Merkmals. Deshalb hier einmal verbindlich –
     sonst bleiben ausgeblendete Zeilen sichtbar. */
  [hidden]{display:none !important}
  .ankreuz{display:flex; align-items:center; gap:9px; font-size:14px; cursor:pointer; padding:2px 0}
  .ankreuz input{width:18px; height:18px; accent-color:var(--primary); cursor:pointer; flex:0 0 auto}
  /* Hinweis auf den Spam-Ordner: Bei einem neuen Absender landen die
     ersten Mails oft dort. Das muss auffallen, sonst sucht man vergebens. */
  .spamhinweis{margin-top:4px; padding:10px 12px; border-radius:12px;
    background:var(--surface); border:1px solid var(--line);
    font-size:13px; line-height:1.5; color:var(--muted)}
  .kontowechsel{margin-top:14px; display:grid; gap:8px}
  .kontowechsel .btn{width:100%}
  input.field,textarea.field,select.field,button.field{
    font-family:inherit; font-size:15px; padding:11px 12px; border:2px solid var(--line); border-radius:12px; background:var(--surface); color:var(--ink); width:100%;
  }
  input.field:focus,textarea.field:focus,select.field:focus,button.field:focus{outline:none; border-color:var(--primary)}

  /* ---------- Leben ---------- */
  /* Schmal genug, um in eine Ecke zu passen: nur so breit wie ihr Inhalt.
     Aufgeklappt wächst sie um die Wartezeit, sonst bleibt sie ein Knopf. */
  /* Herzen links, Muenzen rechts, auf einer Linie. Die Muenzzahl stand
     vorher nur als Satz im Laden - man sah sie also nirgends, wo sie
     interessiert. Ajdin am 18.09.2026. */
  /* Sitzt jetzt in der Kopfzeile, deshalb kein eigener Abstand nach unten
     und keine Ausrichtung nach rechts mehr - das macht .hbtns. */
  /* display:contents loest den Kasten auf: Herzen und Muenzen werden damit
     selbst zu Feldern des Rasters oben, statt gemeinsam in einem Kasten zu
     sitzen. Nur so kann die eine links und die andere mittig stehen. Der
     Kasten bleibt trotzdem, weil die Ansichten ihn zum Ein- und Ausblenden
     brauchen ($('kopfLeiste').style.display). */
  .kopfleiste{display:contents}
  header .livesbar{grid-column:1; justify-self:start}
  header .muenzbar{grid-column:2; justify-self:center}
  /* Alles in der Kopfzeile gleich hoch. Vorher: Herzen 42 Punkte, Muenzen 36,
     Knoepfe 37 - mittig ausgerichtet, aber sichtbar verschieden gross, und
     genau das machte die Zeile unruhig. Ajdin am 18.09.2026. */
  header .livesbar, header .muenzbar, .hbtns .back{
    height:38px; box-sizing:border-box; padding-top:0; padding-bottom:0;
    display:inline-flex; align-items:center;
  }
  /* Gleich viel Luft links wie rechts. Die alte Polsterung war schief
     (4 links, 8 rechts) - das stammte aus der Zeit, als rechts im selben
     Feld noch die Wartezeit stand. Gemessen waren es 6 zu 10 Punkte.
     Ajdin am 18.09.2026. */
  header .livesbar{padding-left:6px; padding-right:6px}
  header .livesbar .herz{padding-top:0; padding-bottom:0}
  .muenzbar{
    display:inline-flex; align-items:center; gap:6px; cursor:pointer;
    background:var(--surface); border:2px solid var(--line); border-radius:99px;
    padding:5px 12px; font:800 15px var(--font-ui); color:var(--accent-dark);
  }
  .muenzbar b{color:var(--ink)}
  /* KM - konvertibilna marka, die Waehrung in Bosnien. Ajdins Einfall am
     18.09.2026: dann heisst das Geld in der App so wie das Geld in dem Land,
     um das es die ganze Zeit geht. Kleiner und leiser als die Zahl, damit
     die Zahl die Hauptsache bleibt. */
  .km{font-size:.78em; opacity:.7; font-weight:800; letter-spacing:.3px}
  /* Der Weg zu Googles Einwilligungsfenster ist jetzt der Schalter selbst -
     ein Tipp darauf oeffnet es. Damit ist Googles Forderung nach einem Weg
     dorthin erfuellt, ohne ein zweites Bedienelement. */
  .muenzbar:hover{border-color:var(--accent)}
  .livesbar{
    display:inline-flex; align-items:center; gap:8px; background:var(--surface); border:2px solid var(--line);
    border-radius:99px; padding:3px 8px 3px 4px; font-size:13px; color:var(--muted); font-weight:700;
    width:auto; min-width:0;
    position:relative;          /* Bezugspunkt fuer den Hinweis darunter */
  }
  /* Die Wartezeit haengt UNTER der Herzpille, nicht daneben.
     Vorher stand sie in derselben Zeile; der Kopf ist aber ein Raster mit
     drei festen Spalten, und die Pille wuchs damit unter die Muenzen und
     Knoepfe, die spaeter im Quelltext stehen und darueber gemalt werden.
     Gemeldet am 24.09.2026.
     position:absolute nimmt sie aus der Zeile: die Herzpille bleibt
     aufgeklappt genauso breit wie zugeklappt, das Raster ruehrt sich
     nicht, und der Inhalt darunter rutscht nicht weg.
     pointer-events:none, weil sie ueber der Karte darunter schwebt und
     dort keinen Tipp abfangen soll. */
  .livesbar .info{
    position:absolute; top:calc(100% + 4px); left:0; z-index:5;
    background:var(--surface); border:2px solid var(--line); border-radius:99px;
    box-shadow:0 2px 0 var(--line); padding:2px 10px;
    font-size:11.5px; line-height:16px; font-weight:700;
    max-width:calc(100vw - 40px);
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    pointer-events:none;
  }
  .livesbar .herz{
    display:inline-flex; align-items:center; gap:5px; background:none; border:0; cursor:pointer;
    font:inherit; font-size:17px; color:var(--bad); padding:3px 8px; border-radius:99px;
  }
  .livesbar .herz b{font-size:15px; color:var(--ink)}
  .livesbar .herz:hover{background:var(--primary-soft)}
  .livesbar.premium .herz{color:var(--accent-dark)}
  .livesbar.zero{border-color:var(--bad)}
  /* Bei null Leben steht der Hinweis dauerhaft (renderLives: zeigen =
     livesInfoAn || n === 0). Dann traegt er denselben roten Rand wie die
     Pille darueber, damit beide als ein Stueck zu lesen sind. */
  .livesbar.zero .info{border-color:var(--bad)}

  /* ---------- Level ---------- */
  .level{background:var(--surface); border:2px solid var(--line); border-radius:var(--radius); padding:14px 18px; margin:4px 0 12px}
  .level h2{font-family:var(--font-ui); font-weight:800; font-size:20px; margin:0; color:var(--primary)}
  .level h2 small{font-weight:700; font-size:12px; color:var(--muted); margin-left:8px}
  .level .tipp{font-size:13px; color:var(--muted); margin-top:4px}
  .level .basis{font-size:12px; color:var(--muted); margin-top:8px; display:flex; gap:6px; flex-wrap:wrap; align-items:center; font-weight:700}
  .level .basis span{border:1.5px solid var(--line); border-radius:99px; padding:1px 8px}
  .note{font-size:12px; color:var(--muted); margin-top:8px; font-weight:700}

  .progress{margin:6px 0 12px}
  .progress .bar{height:12px; background:var(--primary-soft); border-radius:99px; overflow:hidden; position:relative}
  .progress .fill{height:100%; width:0; background:var(--accent); transition:width .5s ease}
  /* Die Marke sitzt da, wo der Test aufgeht. Ihre Stelle kommt aus
     TEST_FREI_AB und wird in updateProgress() gesetzt; steht die Schwelle bei
     100, wäre sie das Balkenende und damit nur Beiwerk - dann bleibt sie weg. */
  .progress .mark80{position:absolute; left:80%; top:-3px; width:3px; height:18px; background:var(--primary); border-radius:2px; opacity:.6}
  .progress .cap{display:flex; justify-content:space-between; font-size:12px; color:var(--muted); margin-top:6px; font-weight:700}

  details{background:var(--surface); border:2px solid var(--line); border-radius:var(--radius); padding:0 16px; margin-bottom:10px}
  details summary{cursor:pointer; font-weight:800; font-size:14px; padding:12px 0; list-style:none; display:flex; justify-content:space-between; align-items:center}
  details summary::-webkit-details-marker{display:none}
  details summary::after{content:'+'; color:var(--primary); font-size:20px; font-weight:800}
  details[open] summary::after{content:'–'}
  details .inner{padding:0 0 14px}
  /* Sprachwahl: Kopfzeile mit Pfeil, darunter fahren alle Sprachen aus. */
  .sprachwahl{position:relative}
  .sprachkopf{display:flex; align-items:center; justify-content:space-between; gap:10px;
    width:100%; text-align:left; cursor:pointer; font-family:inherit}
  .sprachkopf .pfeil{transition:transform .18s ease; color:var(--muted); font-size:13px}
  .sprachkopf[aria-expanded="true"] .pfeil{transform:rotate(180deg)}
  .sprachliste{margin-top:6px; border:2px solid var(--line); border-radius:var(--radius);
    overflow:hidden; background:var(--surface); animation:sprachAuf .18s ease}
  @keyframes sprachAuf{from{opacity:0; transform:translateY(-6px)} to{opacity:1; transform:none}}
  .sprachzeile{display:flex; align-items:center; gap:8px; width:100%; text-align:left;
    background:none; border:0; border-bottom:1px solid var(--line); cursor:pointer;
    font:600 15px var(--font-ui); color:var(--ink); padding:12px 14px}
  .sprachzeile:last-child{border-bottom:0}
  .sprachzeile:hover{background:var(--primary-soft)}
  .sprachzeile.jetzt{background:var(--primary-soft); color:var(--primary)}
  .sprachzeile .haken{margin-left:auto; color:var(--good)}
  @media (prefers-reduced-motion:reduce){ .sprachliste{animation:none} }
  /* Der Hinweis unter einer beantworteten Aufgabe. Er pulsiert leise,
     damit klar ist, dass die App auf einen wartet und nicht haengt. */
  /* Nach der Antwort ein richtiger Knopf mit Kasten statt des blossen
     Hinweises "Tippen fuer die naechste Aufgabe". Ajdin am 18.09.2026.
     Tippen irgendwo im Aufgabenfeld bringt weiterhin die naechste Aufgabe -
     der Knopf ist das Sichtbare daran, nicht der einzige Weg. */
  .weiterbox{margin-top:18px}
  .weiterbox .btn{animation:weiterPuls 1.8s ease-in-out infinite}
  @keyframes weiterPuls{0%,100%{filter:brightness(1)} 50%{filter:brightness(1.14)}}
  @media (prefers-reduced-motion:reduce){ .weiterbox .btn{animation:none} }
  .wordlist{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:4px 14px; font-size:14px}
  /* Feste Zeilenhöhe und kein Umbruch: vorher war jede Zeile so hoch, wie
     ihr längstes Wort es erzwang, und die Liste wirkte zerfasert. */
  .wordlist div{display:flex; justify-content:space-between; align-items:center; gap:8px;
    min-width:0; min-height:30px; padding:3px 0; border-bottom:1px dashed var(--line)}
  .wordlist .de{flex:1 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .wordlist .bs{flex:0 1 auto; min-width:0; font-family:var(--font-display); color:var(--primary);
    font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .wordlist .bs.zu{color:var(--muted); opacity:.55; font-family:var(--font-ui)}
  .wordlist .ok{color:var(--good); font-size:12px}
  @media (max-width:480px){.wordlist{grid-template-columns:1fr}}

  .card{background:var(--surface); border:2px solid var(--line); border-radius:var(--radius); padding:24px 20px; text-align:center}
  .kicker{font-size:12px; color:var(--muted); margin-bottom:16px; font-weight:800; text-transform:uppercase; letter-spacing:.4px}
  /* Am Ende einer Lektion, eines Tests oder einer Geschichte steht keine
     Rubrik, sondern eine Ueberschrift. Klein, grau und in Grossbuchstaben
     sah das aus wie eine Beschriftung und nicht wie ein Ergebnis.
     Die Schrift ist die des Projekts fuer Bedeutungsvolles - dieselbe,
     in der auch die bosnischen Woerter stehen. */
  .ergebnis-titel{display:block; text-align:center; font-family:var(--font-display);
    font-weight:700; font-size:26px; line-height:1.25; color:var(--ink);
    letter-spacing:0; text-transform:none; margin:2px 0 12px}
  @media (max-width:380px){ .ergebnis-titel{font-size:23px} }
  .de{font-size:14px; color:var(--muted); margin-bottom:4px; font-weight:700}
  .prompt{font-size:26px; font-weight:800; margin-bottom:20px; line-height:1.3}
  .prompt.long{font-size:20px}
  .big{font-family:var(--font-display); font-size:38px; font-weight:600; color:var(--primary); line-height:1.25; margin:4px 0 6px}
  .big.long{font-size:24px}
  .listen{
    margin-top:12px; border:2px solid var(--line); background:var(--surface); color:var(--ink);
    font-family:inherit; font-size:14px; font-weight:800; padding:8px 16px; border-radius:99px; cursor:pointer; display:inline-flex; gap:7px; align-items:center;
  }
  .listen:hover{border-color:var(--primary); color:var(--primary)}
  .listen.bigplay{width:96px; height:96px; border-radius:50%; justify-content:center; font-size:40px; margin:6px auto 12px; background:var(--primary-fill); color:var(--on-fill); border:0; box-shadow:0 5px 0 var(--primary-fill-dark)}
  .listen.bigplay:active{transform:translateY(3px); box-shadow:0 2px 0 var(--primary-dark)}

  .row{display:flex; gap:10px; margin-top:20px}
  /* Nebenangebote – kleiner und leiser als der Hauptknopf darunter. */
  .row.schmal{margin-top:14px}
  .row.schmal .btn{font-size:13.5px; font-weight:700; padding:9px 10px; border-radius:11px}
  .btn{
    flex:1; border:0; font-family:inherit; font-size:15px; font-weight:800; padding:13px;
    border-radius:14px; cursor:pointer; transition:.1s; letter-spacing:.2px;
  }
  .btn.know{background:var(--primary-fill); color:var(--on-fill); box-shadow:0 4px 0 var(--primary-fill-dark)}
  .btn.again{background:var(--accent); color:var(--on-accent); box-shadow:0 4px 0 var(--accent-dark)}
  .btn.ghost{background:var(--surface); border:2px solid var(--line); color:var(--muted); box-shadow:0 4px 0 var(--line)}
  /* Solange vorgelesen wird, traegt derselbe Knopf "Stopp" und pulst leise,
     damit man auf einen Blick sieht, woher der Ton kommt. */
  .btn.laeuft{animation:tonPuls 1.6s ease-in-out infinite}
  @keyframes tonPuls{0%,100%{filter:brightness(1)} 50%{filter:brightness(1.18)}}
  @media (prefers-reduced-motion:reduce){ .btn.laeuft{animation:none} }
  /* Der Lautsprecher in der Wort-Blase ist ein Knopf zum Nochmal-Hoeren.
     flex:none, damit er bei langem Text in die naechste Zeile rutscht statt
     die Blase ueber den Rand zu schieben. */
  .wortton{flex:none; margin-left:auto; border:0; background:transparent; color:inherit; font:inherit; font-size:17px; line-height:1; padding:4px 6px; border-radius:8px; cursor:pointer; opacity:.8}
  .wortton:active{opacity:1; transform:scale(.92)}
  .btn:active{transform:translateY(3px); box-shadow:none}
  .btn:disabled{opacity:.45; cursor:default; transform:none}
  .skip{margin-top:14px; border:0; background:transparent; color:var(--muted); font-family:inherit; font-size:13px; font-weight:700; cursor:pointer; text-decoration:underline dotted}
  .skip:hover{color:var(--primary)}

  .sentence{font-family:var(--font-display); font-size:24px; margin:6px 0 4px; line-height:1.4; font-weight:500}
  .blank-input{font-family:var(--font-display); font-size:22px; color:var(--primary); text-align:center; border:0; border-bottom:3px dashed var(--muted); background:transparent; width:150px; padding:2px 4px}
  .blank-input:focus{outline:none; border-bottom-color:var(--primary)}
  .translation{font-size:14px; color:var(--muted); margin:14px 0 2px}
  .feedback{min-height:22px; font-size:14px; font-weight:800; margin-top:14px}
  .feedback.ok{color:var(--good)} .feedback.no{color:var(--bad)} .feedback.almost{color:var(--accent-dark)}

  /* Nach der Antwort: was das Bosnische heisst. Bisher stand bei den
     Auswahlaufgaben nur da, welches Wort richtig gewesen waere - was es
     bedeutet, erfuhr man nie. Ajdin am 18.09.2026: "der bosnische Satz oben
     und die Uebersetzung unten drunter".
     Eigene Klassennamen (lbs/lde), weil .de und .bs im Haus schon fuer die
     Wortliste und die Aufgabenkoepfe vergeben sind. */
  .loesung{margin-top:12px; padding:9px 12px; border-radius:12px; text-align:center;
    background:var(--surface); border:1px solid var(--line)}
  .loesung .lbs{display:block; font-family:var(--font-display); font-weight:600;
    font-size:16px; color:var(--primary); line-height:1.35}
  .loesung .lde{display:block; margin-top:2px; font-size:13.5px; color:var(--muted); font-weight:600}

  /* Tempo des Vorlesens. Steht unter dem Vorlese-Knopf der Geschichte und
     noch einmal in den Einstellungen; beide zeigen denselben Wert. */
  .tempo{display:flex; align-items:center; justify-content:center; flex-wrap:wrap;
    gap:6px; margin-top:12px}
  .tempo .tlabel{font-size:12px; font-weight:800; color:var(--muted); margin-right:2px}
  .tempo button{border:2px solid var(--line); background:var(--surface); color:var(--muted);
    font-family:inherit; font-size:12.5px; font-weight:800; padding:5px 10px;
    border-radius:99px; cursor:pointer; min-width:46px}
  .tempo button[aria-pressed="true"]{border-color:var(--primary); color:var(--primary);
    background:var(--bg)}
  .setting .tempo{justify-content:flex-start; margin-top:8px}
  /* Punkt in der Farbe, um die es geht - direkt vor dem Namen. */
  .farbtupfer{display:inline-block; width:13px; height:13px; border-radius:50%;
    margin-right:7px; vertical-align:-1px; box-shadow:0 0 0 2px var(--surface), 0 0 0 3px var(--line)}
  .ex-tipp{font-size:13px; color:var(--muted); margin-top:6px; min-height:18px}

  .options{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:18px}
  .options.one{grid-template-columns:1fr}
  /* Kurze Antworten stehen nebeneinander - drei Woerter brauchen keine
     drei Zeilen. Passen sie nicht in eine Reihe, rutschen sie von selbst
     um; deshalb flex mit Umbruch statt fester Spalten. */
  .options.waagrecht{display:flex; flex-wrap:wrap; gap:10px}
  .options.waagrecht .opt{flex:1 1 auto; min-width:0; padding:14px 12px}
  .opt{
    border:2px solid var(--line); background:var(--surface); color:var(--ink); font-family:var(--font-display);
    font-size:20px; font-weight:600; padding:15px 10px; border-radius:14px; cursor:pointer; transition:.12s; line-height:1.3; box-shadow:0 3px 0 var(--line);
  }
  .opt.long{font-size:15px; font-family:var(--font-ui); font-weight:700}
  .opt:hover{border-color:var(--primary); background:var(--primary-soft)}
  .opt:active{transform:translateY(2px); box-shadow:none}
  .opt.right{border-color:var(--good); background:var(--primary-soft); color:var(--good); box-shadow:0 3px 0 var(--good-dark)}
  .opt.wrong{border-color:var(--bad); color:var(--bad); box-shadow:0 3px 0 var(--bad)}
  .opt:disabled{cursor:default}

  .tbar{display:flex; gap:3px; margin-bottom:16px}
  .tbar i{flex:1; height:8px; border-radius:99px; background:var(--primary-soft)}
  .tbar i.ok{background:var(--good)} .tbar i.no{background:var(--bad)} .tbar i.skip{background:var(--muted); opacity:.5} .tbar i.cur{background:var(--accent)} .tbar i.intro{background:var(--line)}
  .rep{display:inline-block; font-size:11px; color:var(--on-accent); background:var(--accent); border-radius:99px; padding:1px 8px; text-transform:none; letter-spacing:0}
  .rep.new{background:var(--primary-fill); color:var(--on-fill)}
  .type-input{font-family:var(--font-display); font-size:24px; color:var(--primary); text-align:center; border:0; border-bottom:3px dashed var(--muted); background:transparent; width:100%; max-width:320px; padding:4px; margin-top:8px}
  .type-input:focus{outline:none; border-bottom-color:var(--primary)}
  .result-big{font-family:var(--font-ui); font-size:46px; font-weight:800; color:var(--primary); margin:6px 0}
  .result-big.fail{color:var(--bad)}
  .stats{display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin:14px 0 4px}
  .stat{background:var(--primary-soft); border-radius:12px; padding:8px 12px; font-size:12px; color:var(--muted); font-weight:700}
  .stat b{display:block; font-size:18px; color:var(--primary); font-weight:800}
  .celebrate{display:flex; justify-content:center; margin-bottom:6px}

  .mic{
    width:88px; height:88px; border-radius:50%; border:0; cursor:pointer; margin:6px auto 0;
    background:var(--primary-fill); color:var(--on-fill); display:flex; align-items:center; justify-content:center;
    transition:.2s; box-shadow:0 5px 0 var(--primary-fill-dark);
  }
  .mic svg{width:34px; height:34px}
  .mic.rec{background:var(--bad); box-shadow:0 5px 0 #9c2c26; animation:pulse 1.1s infinite}
  @keyframes pulse{0%{outline:0 solid rgba(214,69,61,.4)}70%{outline:14px solid rgba(214,69,61,0)}100%{outline:0 solid rgba(214,69,61,0)}}
  .heard{font-size:14px; color:var(--muted); min-height:20px; margin-top:14px}

  .lesson{text-align:left}
  .lesson p{font-size:15px; line-height:1.6; margin:0 0 12px}
  .lesson table{width:100%; border-collapse:collapse; font-size:13px; margin:6px 0 14px}
  .lesson th,.lesson td{border:1px solid var(--line); padding:6px 8px; text-align:left; vertical-align:top}
  .lesson th{background:var(--primary-soft); color:var(--primary); font-weight:800}
  .lesson .tablewrap{overflow-x:auto}
  .lesson b{color:var(--primary)}
  .ex-q{font-size:20px; font-weight:800; margin:6px 0 4px; line-height:1.4}

  .story{text-align:left}
  .story h3{font-family:var(--font-ui); font-weight:800; font-size:22px; margin:0 0 12px; color:var(--primary)}
  .story .txt{font-family:var(--font-display); font-size:20px; line-height:1.75; font-weight:500}
  .story .w{cursor:pointer; border-bottom:2px dotted var(--line); border-radius:3px; transition:.12s}
  .story .w:hover,.story .w.on{background:var(--accent-soft); color:var(--primary); border-bottom-color:var(--accent)}
  .bubble{margin-top:14px; padding:10px 14px; border-radius:12px; background:var(--accent-soft); color:var(--ink); font-size:14px; min-height:40px; display:flex; flex-wrap:wrap; gap:10px; align-items:center; font-weight:700}
  .bubble b{font-family:var(--font-display); font-size:18px; color:var(--primary)}
  .bubble.empty{color:var(--muted); background:transparent; border:2px dashed var(--line)}
  .trans{font-size:14px; color:var(--muted); line-height:1.6; margin-top:12px; padding-top:12px; border-top:1px solid var(--line)}
  /* Eigener Name, nicht .q - das ist die Zeile der Tagesaufgaben und
     die steht auf display:flex. Damit lag hier alles nebeneinander. */
  .fragenblock{margin-top:20px; padding-top:16px; border-top:1px solid var(--line)}
  .fragenblock .ex-q{font-size:16px}

  .nav{display:flex; justify-content:space-between; gap:10px; margin-top:16px}
  .nav button{border:2px solid var(--line); background:var(--surface); color:var(--muted); font-family:inherit; font-size:13px; font-weight:800; padding:8px 12px; border-radius:99px; cursor:pointer}
  .nav button:disabled{opacity:.4; cursor:default}

  /* ---------- Einstellungen ---------- */
  .setting{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 0; border-top:1px solid var(--line)}
  .setting:first-of-type{border-top:0}
  .setting .st{font-weight:800; font-size:14px}
  .setting .sd{font-size:12px; color:var(--muted)}
  .switch{position:relative; width:50px; height:28px; border-radius:99px; background:var(--line); border:0; cursor:pointer; flex:0 0 auto; transition:.2s}
  .switch::after{content:''; position:absolute; top:3px; left:3px; width:22px; height:22px; border-radius:50%; background:#fff; transition:.2s; box-shadow:0 1px 3px rgba(0,0,0,.25)}
  .switch[aria-checked="true"]{background:var(--good)}
  .switch[aria-checked="true"]::after{left:25px}
  .srcs{font-size:13px; line-height:1.7; margin:0; padding-left:18px}
  .srcs a{color:var(--primary); font-weight:700}
  .legal{font-size:13px; color:var(--muted); line-height:1.6}

  footer{margin-top:24px; text-align:center; font-size:12px; color:var(--muted); line-height:1.6; font-weight:700}
  .err{background:var(--accent-soft); color:var(--ink); padding:12px 16px; border-radius:12px; font-size:14px; margin-bottom:14px; display:none; text-align:left; line-height:1.6}
  @media (prefers-reduced-motion: reduce){*{animation:none!important; transition:none!important}}
</style>
</head>
<body>
<!-- Vorspann: das Zeichen des Studios, nicht der App.
     Der Drache speit Feuer nach rechts, und aus dem Feuer tritt der Name
     hervor. Alles steckt hier im HTML und wird per CSS bewegt - kein Bild,
     keine zusätzliche Datei, rund 3 KB. Der Ablauf steht oben im Stil.
     Antippen überspringt. -->
<div id="vorspann" aria-hidden="true">
  <!-- viewBox beginnt bei 11, nicht bei 0: das schiebt das Zeichen um elf
       Einheiten nach links. Nach dem Rahmen gerechnet saß es mittig (Kasten
       von 15 bis 579, Mitte 297 bei 300) - es SAH aber nach rechts verrutscht
       aus. Grund: Nur die beiden Hörner reichen ganz nach links, und die
       schweben oben in der Luft. Auf der Höhe, auf der man wirklich liest -
       Kopf und Schriftzug -, fängt das Bild erst bei 43 an, und dort lag die
       Mitte bei 311. Genau diese elf Einheiten sind jetzt weg. -->
  <svg viewBox="11 0 600 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="SmartDragon">
    <defs>
      <clipPath id="vsFrei" clipPathUnits="userSpaceOnUse">
        <rect x="290" y="46" width="300" height="140"/>
      </clipPath>
    </defs>
    <!-- Das Feuer liegt hinter dem Kopf, sonst käme es nicht aus dem Maul.
         Zwölf einzelne Zungen: runder Körper, gezackte Spitze, von außen
         rot-orange nach innen weißglühend. Jede zuckt in eigenem Takt. -->
    <g id="vsFeuer">
      <g transform="translate(246,138) rotate(-26) scale(0.66,0.80)">
        <path id="vsZ1" class="vsZunge" fill="#C2410C" opacity=".78" d="M0,30 C10,22 22,8 44,4 C70,0 96,6 122,13 C152,20 178,26 200,30 C176,35 150,43 122,48 C94,54 66,58 42,54 C20,50 8,40 0,30 Z"/>
      </g>
      <g transform="translate(246,138) rotate(-15) scale(1.12,0.96)">
        <path id="vsZ2" class="vsZunge" fill="#D2620E" opacity=".88" d="M0,30 C10,22 22,8 44,4 C70,0 96,6 122,13 C152,20 178,26 200,30 C176,35 150,43 122,48 C94,54 66,58 42,54 C20,50 8,40 0,30 Z"/>
      </g>
      <g transform="translate(246,138) rotate(-6) scale(1.60,1.06)">
        <path id="vsZ3" class="vsZunge" fill="#E2751A" opacity=".92" d="M0,30 C10,22 22,8 44,4 C70,0 96,6 122,13 C152,20 178,26 200,30 C176,35 150,43 122,48 C94,54 66,58 42,54 C20,50 8,40 0,30 Z"/>
      </g>
      <g transform="translate(246,138) rotate(3) scale(1.40,1.00)">
        <path id="vsZ4" class="vsZunge" fill="#D2620E" opacity=".9" d="M0,30 C10,22 22,8 44,4 C70,0 96,6 122,13 C152,20 178,26 200,30 C176,35 150,43 122,48 C94,54 66,58 42,54 C20,50 8,40 0,30 Z"/>
      </g>
      <g transform="translate(246,138) rotate(13) scale(0.98,0.88)">
        <path id="vsZ5" class="vsZunge" fill="#C2410C" opacity=".8" d="M0,30 C10,22 22,8 44,4 C70,0 96,6 122,13 C152,20 178,26 200,30 C176,35 150,43 122,48 C94,54 66,58 42,54 C20,50 8,40 0,30 Z"/>
      </g>
      <g transform="translate(246,138) rotate(23) scale(0.58,0.72)">
        <path id="vsZ6" class="vsZunge" fill="#C2410C" opacity=".72" d="M0,30 C10,22 22,8 44,4 C70,0 96,6 122,13 C152,20 178,26 200,30 C176,35 150,43 122,48 C94,54 66,58 42,54 C20,50 8,40 0,30 Z"/>
      </g>
      <g transform="translate(246,138) rotate(-11) scale(0.86,0.52)">
        <path id="vsZ7" class="vsZunge" fill="#EE9A16" d="M0,30 C10,22 22,8 44,4 C70,0 96,6 122,13 C152,20 178,26 200,30 C176,35 150,43 122,48 C94,54 66,58 42,54 C20,50 8,40 0,30 Z"/>
      </g>
      <g transform="translate(246,138) rotate(-3) scale(1.24,0.58)">
        <path id="vsZ8" class="vsZunge" fill="#F5C400" d="M0,30 C10,22 22,8 44,4 C70,0 96,6 122,13 C152,20 178,26 200,30 C176,35 150,43 122,48 C94,54 66,58 42,54 C20,50 8,40 0,30 Z"/>
      </g>
      <g transform="translate(246,138) rotate(7) scale(0.94,0.50)">
        <path id="vsZ9" class="vsZunge" fill="#F5C400" d="M0,30 C10,22 22,8 44,4 C70,0 96,6 122,13 C152,20 178,26 200,30 C176,35 150,43 122,48 C94,54 66,58 42,54 C20,50 8,40 0,30 Z"/>
      </g>
      <g transform="translate(246,138) rotate(-5) scale(0.92,0.30)">
        <path id="vsZ10" class="vsZunge" fill="#FFE682" d="M0,30 C10,22 22,8 44,4 C70,0 96,6 122,13 C152,20 178,26 200,30 C176,35 150,43 122,48 C94,54 66,58 42,54 C20,50 8,40 0,30 Z"/>
      </g>
      <g transform="translate(246,138) rotate(2) scale(1.04,0.32)">
        <path id="vsZ11" class="vsZunge" fill="#FFE682" d="M0,30 C10,22 22,8 44,4 C70,0 96,6 122,13 C152,20 178,26 200,30 C176,35 150,43 122,48 C94,54 66,58 42,54 C20,50 8,40 0,30 Z"/>
      </g>
      <g transform="translate(246,138) rotate(-1) scale(0.66,0.18)">
        <path id="vsZ12" class="vsZunge" fill="#FFF8DC" d="M0,30 C10,22 22,8 44,4 C70,0 96,6 122,13 C152,20 178,26 200,30 C176,35 150,43 122,48 C94,54 66,58 42,54 C20,50 8,40 0,30 Z"/>
      </g>
      <circle id="vsFk1" class="vsFunke" cx="300" cy="120" r="3.2" fill="#FFE682"/>
      <circle id="vsFk2" class="vsFunke" cx="356" cy="156" r="2.4" fill="#FFE682"/>
      <circle id="vsFk3" class="vsFunke" cx="410" cy="126" r="2.8" fill="#FFE682"/>
      <circle id="vsFk4" class="vsFunke" cx="338" cy="148" r="2.0" fill="#FFE682"/>
      <circle id="vsFk5" class="vsFunke" cx="268" cy="132" r="2.2" fill="#FFE682"/>
    </g>
    <g id="vsKopf" stroke-linejoin="round">
      <!-- Grundflaeche OHNE Unterkiefer - sie endet an der Maullinie. Waere
           der Kiefer noch darin, staende beim Aufklappen blaues Gesicht im
           offenen Maul. -->
      <polygon points="248,108 256,126 250,129 152,142 142,180 92,168 58,148 44,116 66,104 22,68 76,80 56,58 16,14 64,28 110,48 158,64 190,88" fill="#1E3FA8" stroke="#1E3FA8" stroke-width="1.6"/>
      <polygon points="110,48 158,64 138,96 108,84" fill="#4F76E8" stroke="#4F76E8" stroke-width="1.1"/>
      <polygon points="158,64 190,88 186,110 138,96" fill="#2B4FC0" stroke="#2B4FC0" stroke-width="1.1"/>
      <polygon points="190,88 248,108 218,116 186,110" fill="#4F76E8" stroke="#4F76E8" stroke-width="1.1"/>
      <polygon points="248,108 218,116 218,132 256,126" fill="#1E3FA8" stroke="#1E3FA8" stroke-width="1.1"/>
      <polygon points="218,116 186,110 170,126 218,132" fill="#2B4FC0" stroke="#2B4FC0" stroke-width="1.1"/>
      <polygon points="138,96 186,110 170,126 124,116" fill="#0F2160" stroke="#0F2160" stroke-width="1.1"/>
      <polygon points="124,116 170,126 150,142 112,130" fill="#1E3FA8" stroke="#1E3FA8" stroke-width="1.1"/>
      <polygon points="218,132 170,126 150,142" fill="#2B4FC0" stroke="#2B4FC0" stroke-width="1.1"/>
      <polygon points="108,84 138,96 124,116 112,130" fill="#2B4FC0" stroke="#2B4FC0" stroke-width="1.1"/>
      <polygon points="110,48 76,80 66,104 108,84" fill="#2B4FC0" stroke="#2B4FC0" stroke-width="1.1"/>
      <polygon points="66,104 44,116 112,130 108,84" fill="#1E3FA8" stroke="#1E3FA8" stroke-width="1.1"/>
      <polygon points="44,116 58,148 92,168 112,130" fill="#2B4FC0" stroke="#2B4FC0" stroke-width="1.1"/>
      <polygon points="112,130 92,168 142,180 150,142" fill="#1E3FA8" stroke="#1E3FA8" stroke-width="1.1"/>
      <!-- Maulhoehle: liegt unter dem Kiefer. Geschlossen sieht man nur den
           Spalt, offen den Rachen. -->
      <polygon points="152,142 250,129 247,155 237,170 190,179 145,176" fill="#0A1538"/>
      <!-- Der bewegliche Unterkiefer, mit seinem Zahn und seiner Kontur -->
      <g id="vsKiefer">
        <polygon points="150,142 142,180 190,178 238,166 248,152" fill="#4F76E8" stroke="#4F76E8" stroke-width="1.1"/>
        <polygon points="203,148 218,146 211,130" fill="#FFFFFF"/>
        <polygon points="150,142 142,180 190,178 238,166 248,152" fill="none" stroke="#4F76E8" stroke-width="2.2" stroke-linejoin="round"/>
      </g>
      <polygon points="110,48 64,28 16,14 92,62" fill="#F5C400" stroke="#F5C400" stroke-width="1.1"/>
      <polygon points="92,62 16,14 56,58 76,80" fill="#C99E00" stroke="#C99E00" stroke-width="1.1"/>
      <polygon points="76,80 22,68 71,92" fill="#F5C400" stroke="#F5C400" stroke-width="1.1"/>
      <polygon points="71,92 22,68 66,104" fill="#C99E00" stroke="#C99E00" stroke-width="1.1"/>
      <polygon points="176,114 160,122 143,115 159,107" fill="#F5C400" stroke="#F5C400" stroke-width="1.1"/>
      <polygon points="236,106 250,116 234,115" fill="#1E3FA8" stroke="#1E3FA8" stroke-width="1.1"/>
      <polygon points="243,128 226,131 236,150" fill="#FFFFFF"/>
      <polygon points="196,135 180,137 188,151" fill="#FFFFFF"/>
      <!-- Aussenkontur des Schaedels. Der Kiefer bringt seine eigene mit,
           sonst staende beim Aufklappen eine Linie quer durchs Maul. -->
      <polygon points="248,108 256,126 250,129 152,142 142,180 92,168 58,148 44,116 66,104 22,68 76,80 56,58 16,14 64,28 110,48 158,64 190,88"
               fill="none" stroke="#4F76E8" stroke-width="2.2" stroke-linejoin="round"/>
    </g>

<script>
/* Der Inhalt kommt aus vokabeln.py, grammatik.py und geschichten.py – hier muss nichts geändert werden. */
const LEKTION_WOERTER = 10;      // Wortaufgaben pro Lektion
const LEKTION_NEU_MAX = 5;       // davon höchstens so viele neue Wörter (wenn es schon bekannte gibt)
const LEKTION_LUECKEN = 2;       // Lückentexte pro Lektion
const LEKTION_GRAMMATIK = 2;     // Grammatik-Aufgaben pro Lektion (wenn vorhanden)
/* Ajdin am 27.09.2026: "mach die pruefung statt bei 80% auf 100% sonst lernt
   man nicht alles". Der Test geht jetzt erst auf, wenn JEDES Wort des Levels
   einmal richtig beantwortet war. Das kostet je Level ein paar Lektionen mehr -
   buildLesson() nimmt aber immer zuerst die noch unbekannten Wörter, es kann
   also keine Sackgasse geben, in der ein Wort nicht mehr dran kommt. */
const TEST_FREI_AB = 100;        // Prozent bekannter Wörter, ab denen der Level-Test frei ist
const TEST_FRAGEN = 10, TEST_WIEDERHOLUNG = 3, TEST_BESTANDEN_AB = 8;
const LEBEN_MAX = 5;               // Leben für die ganze App
const LEBEN_NACHFUELLEN_MIN = 120; // Minuten, bis ein Leben nachwächst (Vollversion: unbegrenzt)
/* Münzen: 10 je geschaffter Tagesaufgabe, also höchstens 30 am Tag.
   Die Preise im Laden sind daran gemessen. Die Vollversion gibt es
   ausdrücklich NICHT für Münzen – siehe ANLEITUNG.md. */
const MUENZEN_PRO_QUEST = 10;
/* Zwei Sorten Ware. Oben, was sich verbraucht - unten der Zierrat fuer den
   Drachen, der einmal gekauft bleibt. Es kann immer nur ein Stueck getragen
   werden. Die Preise sind an 30 Muenzen am Tag gemessen. */
const VERBRAUCH = [
  {id:'herz',   preis:100, titel:'laden.herz',   sub:'laden.herz_sub',
   geht:()=> !unlimited() && lives.anzahl < LEBEN_MAX},
  {id:'schutz', preis:300, titel:'laden.schutz', sub:'laden.schutz_sub',
   geht:()=> schutzNow() < SCHUTZ_MAX}
];
/* Zierrat in fuenf Gruppen - Kopf, Brille, Hals, Farbe, Effekt. Das sind
   zugleich die Reiter im Laden. Aus jeder Gruppe kann ein Stueck getragen
   werden, alle fuenf zusammen. Die Reihenfolge
   hier ist die Reihenfolge im Laden: das Guenstigste zuerst.
   Die Kennungen muessen zu den Dateien web/maskottchen/zmajz-<id>.json
   passen, die zmaj_lottie.py erzeugt. */
const ZIERRAT = [
  {id:'ohrenschuetzer', gruppe:'kopf',   preis:600},
  {id:'kappe',          gruppe:'kopf',   preis:700},
  {id:'fes',            gruppe:'kopf',   preis:900},
  {id:'kopfhoerer',     gruppe:'kopf',   preis:1200},
  {id:'hut',            gruppe:'kopf',   preis:1500},
  {id:'doktorhut',      gruppe:'kopf',   preis:1800},

  if(unlimited()) return false;

/* Zeigt das Fenster und liefert die Wahl zurück. Es lässt sich nicht
   wegklicken - eine der beiden Antworten muss kommen. */
function zeigeEinwilligung(){
  return new Promise(fertig => {
    const kasten = document.createElement('div');
    kasten.className = 'einwilligung';
    kasten.innerHTML =
      '<div class="einwilligungbox">' +
        '<h3>' + esc(t('consent.titel')) + '</h3>' +
        '<div class="txt">' + t('consent.text') + '</div>' +
        '<details><summary>' + esc(t('set.datenschutz')) + '</summary>' +
          '<div class="inner legal">' + t('set.datenschutz_text', {anbieter: t('set.anbieter')}) + '</div>' +
        '</details>' +
        '<button class="btn know" id="einwJa"></button>' +
        '<button class="btn ghost" id="einwNein"></button>' +
        '<div class="fuss">' + esc(t('consent.fuss')) + '</div>' +
      '</div>';
    const ja = kasten.querySelector('#einwJa'), nein = kasten.querySelector('#einwNein');
    ja.textContent = t('consent.ja');
    nein.textContent = t('consent.nein');
    document.body.appendChild(kasten);
    const waehle = wahl => { einwilligungMerken(wahl); kasten.remove(); fertig(wahl); };
    ja.addEventListener('click', () => waehle('ja'));
    nein.addEventListener('click', () => waehle('nein'));
  });
}

/* `belohnt` trennt die beiden Arten. Ohne Argument ist die Pflicht-Anzeige
   gemeint, so wie vorher - der Aufruf in lessonEnd() bleibt deshalb
   unveraendert. Das `|| 0` faengt Staende ab, die noch ohne `lohn` im
   Geraetespeicher liegen; sonst waere der Vergleich NaN und der Knopf
   "Leben holen" von der ersten Sekunde an weg. */
function werbungErlaubt(belohnt){
  if(!WERBUNG_AN || unlimited()) return false;   // Vollversion: nie
  if(admobDa() && !admobDarf) return false;      // Google sagt nein
  /* Punkt 7: auf dem Geraet ohne laufendes AdMob gibt es nichts zu zeigen.
     Seit das eigene Einwilligungsfenster dort nicht mehr einspringt, waere
     der Knopf „Video ansehen“ sonst zwar da, liefe aber jedes Mal ins
     Leere. Lieber gar nicht erst anbieten. */
  const Pw = window.Capacitor && window.Capacitor.Plugins;
  if(!admobDa() && Pw && Pw.AdMob) return false;
  if(einwilligungFragen()) return false;         // erst fragen, dann werben
  const heute = new Date().toISOString().slice(0,10);
  if(werbungHeute.tag !== heute) werbungHeute = {tag: heute, n: 0, lohn: 0,
                                                 offen: !!werbungHeute.offen};
  /* Das freiwillige Video fuer ein Herz bleibt begrenzt - es kostet Leben,
     und wer sich zwanzig Videos ansieht, spielt den Tag durch, ohne je zu
     warten. Die Anzeige nach Lektion und Test ist nicht begrenzt. */
  return belohnt ? (werbungHeute.lohn || 0) < WERBUNG_MAX_LOHN
                 : (!WERBUNG_MAX_TAG || (werbungHeute.n || 0) < WERBUNG_MAX_TAG);
}
function werbungGezaehlt(belohnt){
  const heute = new Date().toISOString().slice(0,10);
  if(werbungHeute.tag !== heute) werbungHeute = {tag: heute, n: 0, lohn: 0,
                                                 offen: !!werbungHeute.offen};
  if(belohnt) werbungHeute.lohn = (werbungHeute.lohn || 0) + 1;
  else werbungHeute.n    = (werbungHeute.n    || 0) + 1;
  try{ localStorage.setItem('zmaj_werbung', JSON.stringify(werbungHeute)); }catch(e){}
}

async function admobStart(){

     wollte. Gefunden am 26.09.2026. */

    // und die Ablehnung sähe aus, als hätte sie nicht gezählt.
