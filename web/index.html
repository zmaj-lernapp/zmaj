<!-- Das Aussehen VOR dem ersten Zeichnen setzen. Stuende das unten im grossen
     Skript, blitzte beim Start kurz die falsche Fassung auf - hell auf einem
     dunkel gestellten Handy blendet richtig. Deshalb diese sechs Zeilen hier
     oben, noch vor dem Stil.
     Kein data-theme heisst: so, wie das Geraet eingestellt ist. Gespeichert
     wird deutsch ("hell"/"dunkel"), im Merkmal steht englisch - das Merkmal
     gehoert zum Stil, der gespeicherte Wert zur App. Umgesetzt wird das an
     genau zwei Stellen: hier und in themeAnwenden(). -->
<script>
  try{
    var w = localStorage.getItem('zmaj_theme');
    if(w === 'hell')   document.documentElement.dataset.theme = 'light';
    if(w === 'dunkel') document.documentElement.dataset.theme = 'dark';
  }catch(e){}
  /* Die Plattform-Weiche (30.10.2026, iOS_Plan.md 3.5). Hier oben und nur
     hier wird entschieden, wo die App laeuft: 'android', 'ios' oder 'web'
     (Browser, Web-Demo). Das grosse Skript liest es als PLATTFORM. Hier oben,
     weil der Stil es schon vor dem ersten Zeichnen braucht: auf dem iPhone
     liegt die Seite unter Notch und Home-Leiste (capacitor.config.json,
     contentInset "never"), und nur mit viewport-fit=cover nennt WebKit die
     Raender in env(safe-area-inset-*).
     Capacitor ohne getPlatform() heisst 'android': vor iOS gab es nur die
     eine Huelle, und die Browsertests stellen Capacitor seit jeher ohne
     getPlatform() nach - fuer sie bleibt alles wie vorher.
     Android bekommt viewport-fit bewusst NICHT: die WebView beachtet es dort
     seit Chromium 140 auch, und dann laege die Kopfleiste unter der
     Statusleiste. Android bleibt, wie es war.
     maximum-scale=1.0 seit dem 15.11.2026 (Ajdin: "die app ist etwas zu
     breit fuer iphone das muss ganz leicht duenner sein"): Tippt man auf
     dem iPhone in ein Feld mit weniger als 16 px Schrift, vergroessert
     WKWebView die Seite auf 16/Schriftgroesse (15 px: +6,8 %) und bleibt
     nach dem Verlassen so stehen - rechts fehlten am iPhone 11 rund 11
     Punkte (WebKit WKWebViewIOS.mm, _zoomToFocusRect). Capacitor sperrt das
     Zoomen mit zwei Fingern ohnehin, es geht also nichts verloren. Die
     Felder haben auf iOS ausserdem 16 px (Stil bei input.field), das ist
     die zweite Sicherung.
     minimum-scale=1.0 und user-scalable=no seit dem 15.11.2026 (Ajdin mit
     Build 3: "wenn ich doppel tippe dann zoomt die app rein aber kann nicht
     wieder zurück zoomen"). Capacitor sperrt das Zoomen mit zwei Fingern
     erst, wenn ein Zoom beginnt (scrollViewWillBeginZooming); kommt das
     auch beim Doppeltipp-Zoom, geht es danach nicht mehr zurueck - so passt
     es zum Befund, belegt ist es ohne Mac nicht. Mit min = max = 1 und user-scalable=no ist
     die Seite fuer WKWebView nicht zoombar, dann gibt es auch keinen
     Doppeltipp-Zoom (WKWebView beachtet das, solange
     ignoresViewportScaleLimits aus ist; die Huelle setzt es ausdruecklich
     in ZmajViewController.swift). Dazu touch-action: manipulation im Stil,
     auch in Kaesten mit eigenem Bildlauf. Android bleibt, wie es war. */
  var C = window.Capacitor;
  window.ZMAJ_PLATTFORM = !C ? 'web'
    : (typeof C.getPlatform === 'function' ? String(C.getPlatform() || 'web')
       : (C.Plugins ? 'android' : 'web'));
  document.documentElement.dataset.plattform = window.ZMAJ_PLATTFORM;
  if(window.ZMAJ_PLATTFORM === 'ios'){
    var vp = document.querySelector('meta[name="viewport"]');
    if(vp) vp.setAttribute('content', 'width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover');
  }
</script>
<!-- Tablets (30.10.2026). Ajdin zu den Store-Bildern fuer 7- und 10-Zoll-
     Tablets: "die tablet bilder die zeigen zu viel platz kann man nicht je
     nach dem wie gross der bildschirm ist das layout anpassen". Die App war
     ueberall eine Spalte bis 540 Punkte in Handygroesse; auf dem 10-Zoll-
     Tablet hochkant blieb links und rechts je ein Siebtel leer, alles war
     klein, und unter einer Lektion stand der halbe Bildschirm leer.
     Ab dem kleinsten Seitenmass 600 (so trennt auch Android Tablet und
     Handy, "sw600dp") vergroessert CSS-zoom die ganze App, also Schrift,
     Knoepfe, Abstaende und Drachen im selben Verhaeltnis (GROSS):
       - hochkant so weit, dass die Spalte 88 % der Breite fuellt
         (800 x 1280: 1,30), solange 840 Punkte Hoehe bleiben (iPad
         768 x 1024: 1,22 statt 1,25, die Spalte fuellt 86 %). Ein 7-Zoll-
         Tablet mit 600 Punkten bleibt bei 1, die Spalte fuellt dort schon
         90 %.
       - quer nur so weit, dass 740 Punkte Hoehe bleiben - so passt eine
         Lektion ohne Scrollen wie auf dem Handy (S21: 726). 10 Zoll quer:
         1,08. Die Spalte ist quer immer 640 Punkte breit und steht in der
         Mitte: 7 Zoll quer (960 x 600, Massstab 1) 640 von 960, 10 Zoll
         quer 640 x 1,08 = 692 von 1280 Bildschirmpunkten.
       - hoechstens 1,4 (iPad Pro 12,9 Zoll).
       Die Spalte selbst (--spalte) ist 88 % der Breite in Punkten der
       vergroesserten Seite, mindestens 540 wie am Handy, hoechstens 640.
       Hochkant sind das meist 540; breiter wird sie nur, wo der Massstab
       durch Hoehe oder Obergrenze kleiner bleibt (iPad 768 x 1024: 554,
       iPad Pro 12,9 Zoll: 640).
     Klasse "gross" fuer alles ab 600 Punkten, dazu "hoch", wenn mindestens
     840 Punkte Hoehe da sind: erst dann fuellt die Lektion den Bildschirm
     mit Drache, Aufgabe und Antworten verteilt (siehe Stil unter
     "Tablets"). Quer bleibt die Lektion so aufgebaut wie am Handy.
     Warum zoom und nicht ueberall rem/calc: das Stilblatt hat Hunderte
     fester px-Werte, die Handy-Fassung ist Punkt fuer Punkt abgestimmt und
     soll genau so bleiben. zoom kennen Chrome/Android-WebView und
     Safari/WKWebView seit Jahren; Lottie zeichnet als SVG und bleibt scharf.
     Was zoom NICHT gleich macht, steht im Stil unter "Tablets" (vh-Werte)
     und bei rectFaktor() (getBoundingClientRect in aelteren WebViews).
     Unter 600 Punkten passiert hier nichts: keine Klasse, kein zoom, keine
     Variable - das Handy sieht exakt aus wie vorher
     (tests_e2e/test_tablet.py prueft das).
     Hier oben und nicht im grossen Skript, damit schon das erste Bild in
     der richtigen Groesse steht. -->
<script>
  var GROSS = 1;
  (function(){
    var d = document.documentElement, breite = 0, an = false, hoch = false;
    /* Offene Tastatur: Android macht die Ansicht dabei niedriger. Dann
       bleiben Massstab und Aufbau, wie sie sind - sonst sprang beim Tippen
       in eine Luecke die ganze Seite auf eine andere Groesse. Nur die Hoehe
       zieht nach, damit die Aufgabe ueber die Tastatur ruecken kann. */
    function tippt(){
      var a = document.activeElement;
      return !!a && (a.tagName === 'TEXTAREA' || (a.tagName === 'INPUT' && !/^(checkbox|radio|button|submit|file)$/.test(a.type)));
    }
    function setzen(){
      var w = window.innerWidth, h = window.innerHeight;
      if(!w || !h) return;
      if(!(an && w === breite && tippt())){
        an = Math.min(w, h) >= 600 && !!(window.CSS && CSS.supports && CSS.supports('zoom', '1.5'));
        var z = h >= w ? Math.min(0.88 * w / 540, h / 840) : h / 740;
        GROSS = an ? Math.round(Math.max(1, Math.min(z, 1.4)) * 1000) / 1000 : 1;
        hoch = an && h / GROSS >= 839.5;
        breite = w;
      }
      if(!an){
        /* Am Handy nichts anfassen, nur zuruecknehmen, was ein Tablet-Mass
           vorher gesetzt hat (geteilter Bildschirm, Drehen). So schreibt
           das Skript am Handy nie etwas in die Seite. */
        if(d.classList.contains('gross')){
          d.classList.remove('gross', 'hoch');
          ['--gross', '--hoehe', '--breite', '--spalte'].forEach(function(n){ d.style.removeProperty(n); });
        }
        return;
      }
      d.classList.add('gross');
      if(hoch) d.classList.add('hoch'); else d.classList.remove('hoch');
      d.style.setProperty('--gross', String(GROSS));
      /* Bildschirmhoehe und -breite in den Punkten der vergroesserten Seite.
         100vh/100vw rechnet Chrome im zoom mit (1,3 x so hoch wie der
         Bildschirm), deshalb im Stil fuer Tablets diese beiden statt vh/vw. */
      d.style.setProperty('--hoehe', (h / GROSS).toFixed(2) + 'px');
      d.style.setProperty('--breite', (w / GROSS).toFixed(2) + 'px');
      d.style.setProperty('--spalte', Math.round(Math.min(640, Math.max(540, 0.88 * w / GROSS))) + 'px');
    }
    setzen();
    window.addEventListener('resize', setzen);
  })();
</script>
