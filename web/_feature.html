<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Feature-Grafik</title>
<link href="schriften.css" rel="stylesheet">
<script src="lottie.min.js"></script>
<style>
  body{margin:0;background:#222;display:flex;align-items:center;justify-content:center;height:100vh}
  canvas{box-shadow:0 0 0 1px #555}
  #versteck{position:absolute;left:-9999px;top:0}
</style>
</head>
<body>
<canvas id="bild" width="1024" height="500"></canvas>
<div id="versteck"><canvas id="drache" width="420" height="404"></canvas></div>
<script>
/* Feature-Grafik für den Play Store, 1024 x 500.
   Hintergrund in den Farben der App, links der Drache aus zmaj.json,
   rechts der Schriftzug. Am Ende liegt das Bild als Daten-URL in
   window._png und wird von aussen abgeholt. */
const c = document.getElementById('bild');
const g = c.getContext('2d');
const B = 1024, H = 500;

function hintergrund(){
  const v = g.createLinearGradient(0, 0, B, H);
  v.addColorStop(0, '#0B1330'); v.addColorStop(0.55, '#14265E'); v.addColorStop(1, '#1E3FA8');
  g.fillStyle = v; g.fillRect(0, 0, B, H);

  // Anklang an die Flagge: schräges gelbes Band, sehr zurückhaltend
  g.save();
  g.beginPath();
  g.moveTo(B*0.62, -20); g.lineTo(B*1.05, -20); g.lineTo(B*1.05, H+20); g.closePath();
  const vg = g.createLinearGradient(B*0.62, 0, B, H);
  vg.addColorStop(0, 'rgba(255,210,63,0.16)'); vg.addColorStop(1, 'rgba(255,210,63,0.05)');
  g.fillStyle = vg; g.fill();
  g.restore();

  // ein paar Sterne wie auf der Flagge, ganz leise
  g.fillStyle = 'rgba(255,255,255,0.10)';
  for(let i = 0; i < 7; i++){
    const t = i / 6;
    stern(B*0.60 + t*B*0.40, -30 + t*(H+60), 15);
  }
}

function stern(mx, my, r){
  g.beginPath();
  for(let i = 0; i < 10; i++){
    const a = -Math.PI/2 + i*Math.PI/5;
    const rr = i % 2 ? r*0.42 : r;
    const x = mx + rr*Math.cos(a), y = my + rr*Math.sin(a);
    i ? g.lineTo(x, y) : g.moveTo(x, y);
  }
  g.closePath(); g.fill();
}

function schrift(){
  // Wortmarke: Zmaj mit gelbem Punkt, wie in der App
  g.textBaseline = 'alphabetic';
  g.font = '800 116px Nunito, system-ui, sans-serif';
  const x = 452, y = 250;
  g.fillStyle = '#FFFFFF';
  g.fillText('Zmaj', x, y);
  const breite = g.measureText('Zmaj').width;
  g.fillStyle = '#FFD23F';
  g.fillText('.', x + breite, y);

  // Die beiden Zeilen je Sprache: _feature.html?sprache=en usw. Seit
  // 11.10.2026; vorher stand die Grafik in allen Store-Sprachen auf Deutsch.
  const [zeile1, zeile2] = ZEILEN[SPRACHE] || ZEILEN.de;
  const platz = B - (x + 6) - 28;
  passend(zeile1, 700, 44, platz);
  g.fillStyle = '#C9D6FF';
  g.fillText(zeile1, x + 4, y + 62);

  passend(zeile2, 600, 27, platz);
  g.fillStyle = '#93A6DE';
  g.fillText(zeile2, x + 6, y + 116);
}

const ZEILEN = {
  de: ['Bosnisch lernen', '65 Levels · Grammatik · Geschichten'],
  en: ['Learn Bosnian', '65 levels · Grammar · Stories'],
  tr: ['Boşnakça öğren', '65 seviye · Dil bilgisi · Hikâyeler'],
  sv: ['Lär dig bosniska', '65 nivåer · Grammatik · Berättelser'],
  nl: ['Bosnisch leren', '65 levels · Grammatica · Verhalen'],
  nb: ['Lær bosnisk', '65 nivåer · Grammatikk · Historier'],
  da: ['Lær bosnisk', '65 niveauer · Grammatik · Historier'],
  fr: ['Apprendre le bosnien', '65 niveaux · Grammaire · Histoires'],
};
const SPRACHE = new URLSearchParams(location.search).get('sprache') || 'de';

// Schrift so gross wie geplant, aber nie breiter als der Platz rechts vom Drachen.
function passend(text, gewicht, groesse, platz){
  let px = groesse;
  do {
    g.font = gewicht + ' ' + px + 'px Nunito, system-ui, sans-serif';
  } while(g.measureText(text).width > platz && --px > 16);
}

function fertigstellen(drache){
  hintergrund();
  if(drache) g.drawImage(drache, 52, 62, 372, 358);   // Drache links
  window._drache = !!drache;
  schrift();
  window._png = c.toDataURL('image/png');
  window._fertig = true;
  document.title = 'fertig';
  /* _feature.html?senden=1: das Bild an grafiken_bauen.py schicken
     (ZWEITE_GRAFIK = True, wartet auf 127.0.0.1:8199). Ohne den Schalter
     geht nichts nach draussen. 15.10.2026 - vorher beschrieb
     grafiken_bauen.py diesen Weg, die Seite schickte aber nichts. */
  if(new URLSearchParams(location.search).has('senden'))
    fetch('http://127.0.0.1:8199/', {method: 'POST', body: window._png}).catch(() => {});
}

/* Der Drache wird als SVG gezeichnet (die Leinwand-Fassung von lottie
   blieb leer) und danach in ein Bild verwandelt, das sich auf die große
   Leinwand malen lässt. Seit dem 15.10.2026 besteht der Drache aus Bildern
   (maskottchen/teile/*.webp, siehe zmaj_lottie.py). Ein SVG, das als Bild
   über eine Daten-URL gezeichnet wird, lädt keine fremden Dateien - der
   Banner zeigte darum nur noch Hintergrund und Schrift. Deshalb werden die
   Bilder vorher selbst als Daten-URL ins SVG geschrieben (einbetten). */
const behaelter = document.getElementById('versteck');
behaelter.style.width = '420px';
behaelter.style.height = '404px';

const a = lottie.loadAnimation({
  container: behaelter,
  renderer: 'svg',
  loop: false, autoplay: false,
  path: 'maskottchen/zmaj.json',
  rendererSettings: {preserveAspectRatio: 'xMidYMid meet'}
});

a.addEventListener('DOMLoaded', () => {
  a.goToAndStop(20, true);                 // ruhige Haltung aus dem idle-Abschnitt
  document.fonts.ready.then(() => setTimeout(drachenBild, 400));
});

const XLINK = 'http://www.w3.org/1999/xlink';
async function einbetten(svg){
  for(const el of svg.querySelectorAll('image')){
    const href = el.getAttributeNS(XLINK, 'href') || el.getAttribute('href');
    if(!href || href.startsWith('data:')) continue;
    const blob = await (await fetch(href)).blob();
    const url = await new Promise((ok, fehler) => {
      const r = new FileReader(); r.onload = () => ok(r.result); r.onerror = fehler; r.readAsDataURL(blob);
    });
    el.setAttributeNS(XLINK, 'xlink:href', url);
    el.setAttribute('href', url);
  }
}

async function drachenBild(){
  const svg = behaelter.querySelector('svg');
  if(!svg){ fertigstellen(null); return; }
  try{ await einbetten(svg); }
  catch(e){ fertigstellen(null); return; }   // ohne Bilder lieber gar kein Drache als zwei Augen
  svg.setAttribute('width', 420);
  svg.setAttribute('height', 404);
  svg.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
  const text = new XMLSerializer().serializeToString(svg);
  const bild = new Image();
  bild.onload = () => fertigstellen(bild);
  bild.onerror = () => fertigstellen(null);
  bild.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(text);
}
</script>
</body>
</html>
