version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
  # requirements-dev.txt, requirements-e2e.txt and requirements-hf.txt are
  # locked with hashes from their .in files (uv pip compile, command in each
  # header).
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(deps-dev)"
