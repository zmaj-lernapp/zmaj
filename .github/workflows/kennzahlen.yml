# Every Monday: measure the thresholds from docs/codex-for-oss/PLAN.md §5
# and show the table in the run summary. Read-only, pushes nothing.
name: Kennzahlen

on:
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  messen:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Measure
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          {
            echo "## Codex for Open Source – Schwellen ($(date -u +%F))"
            echo
            python kennzahlen.py --markdown || true
            echo
            echo "Manuelle Werte: docs/codex-for-oss/kennzahlen_manuell.json"
          } >> "$GITHUB_STEP_SUMMARY"
