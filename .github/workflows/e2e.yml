# Browser end-to-end tests: the real app in headless Chromium.
# Separate from ci.yml so the fast unit suite stays fast; see tests_e2e/conftest.py.
# Its own lock file (requirements-e2e.txt) keeps Playwright out of the other jobs.
name: E2E

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    name: App in Chromium
    runs-on: ubuntu-24.04
    # 15 Minuten reichten bis v107 (9,5 min). Mit den Tests von v108 brach
    # der Lauf am 27.10.2026 nach 15 Minuten ab, ohne Fehler (PR #57).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-e2e.txt

      - name: Install test tools (pytest and Playwright, pinned with hashes in requirements-e2e.txt)
        run: python -m pip install --require-hashes -r requirements-e2e.txt

      # Chromium (~170 MB) nur neu laden, wenn sich die Playwright-Version
      # in requirements-e2e.txt aendert. Die Systempakete installiert
      # install-deps trotzdem jedes Mal.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements-e2e.txt') }}

      - name: Install Chromium for Playwright
        run: |
          python -m playwright install chromium
          python -m playwright install-deps chromium

      - name: Browser tests (start in 8 languages, lesson, level test, story, backup import)
        run: python -m pytest tests_e2e -q
