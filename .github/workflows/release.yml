# Push a tag like v1.0.0 (or data-v1.0.0) and this workflow tests everything,
# packs the open dataset and attaches it to a GitHub release.
# Or run it by hand on master with a new tag name: it then tests that commit
# and creates the tag and the release itself.
name: Release

on:
  push:
    tags: ["v*", "data-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag for the release, e.g. v1.0.0 (created at the chosen commit if it does not exist)"
        required: true

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Test before packing
        run: |
          python -m pip install --require-hashes -r requirements-dev.txt
          python -m pytest
          python daten_exportieren.py --pruefen

      - name: Pack the dataset
        run: |
          set -euo pipefail
          name="zmaj-bosnian-dataset-${TAG}"
          mkdir -p "dist/$name/web"
          cp -r data/. "dist/$name/"
          cp -r web/audio "dist/$name/web/audio"
          rm -rf "dist/$name/web/audio/_probe"
          cp LICENSE-CONTENT "dist/$name/LICENSE"
          (cd dist && zip -qr "$name.zip" "$name")
          (cd dist && zip -qr "zmaj-anki-decks-${TAG}.zip" "$name/anki" "$name/LICENSE")

      - name: Build Anki packages with audio (one per language)
        run: |
          set -euo pipefail
          python anki_bauen.py
          mv dist/anki/*.apkg dist/
          (cd dist && sha256sum ./*.zip ./*.apkg > SHA256SUMS.txt)
          ls -la dist

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/*.apkg
            dist/SHA256SUMS.txt

  huggingface:
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Is Hugging Face configured?
        id: key
        env:
          KEY: ${{ secrets.HF_TOKEN }}
        run: echo "present=$([ -n "$KEY" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.key.outputs.present == 'true'
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: steps.key.outputs.present == 'true'
        with:
          python-version: "3.13"
      - name: Upload the dataset to Hugging Face
        if: steps.key.outputs.present == 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          ZMAJ_VERSION: ${{ env.TAG }}
        run: |
          python -m pip install --require-hashes -r requirements-hf.txt
          python hf_hochladen.py
