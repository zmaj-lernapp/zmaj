# Push a tag like v1.0.0 (or data-v1.0.0) and this workflow tests everything,
# packs the open dataset and attaches it to a GitHub release.
name: Release

on:
  push:
    tags: ["v*", "data-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build the release for"
        required: true

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Test before packing
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pytest
          python daten_exportieren.py --pruefen

      - name: Pack the dataset
        run: |
          set -euo pipefail
          name="zmaj-bosnian-dataset-${TAG}"
          mkdir -p "dist/$name/web"
          cp -r data/. "dist/$name/"
          cp -r web/audio "dist/$name/web/audio"
          rm -rf "dist/$name/web/audio/_probe"
          cp LICENSE-CONTENT "dist/$name/LICENSE"
          (cd dist && zip -qr "$name.zip" "$name")
          (cd dist && zip -qr "zmaj-anki-decks-${TAG}.zip" "$name/anki" "$name/LICENSE")
          (cd dist && sha256sum ./*.zip > SHA256SUMS.txt)
          ls -la dist

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ env.TAG }}
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/SHA256SUMS.txt
