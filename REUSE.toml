# Machine-readable licensing for every file in this repository.
# Spec: https://reuse.software/spec-3.3/  ·  check locally with `reuse lint`.
#
# Rule of thumb: program code is AGPL-3.0-or-later, learning content
# (vocabulary, sentences, grammar, stories, translations, audio, artwork,
# documentation) is CC-BY-SA-4.0. Third-party files keep their own licenses.
# The names "Zmaj" and "SmartDragon" and their logos are trademarks and are
# not licensed by either license; see TRADEMARK.md.
#
# Later annotations override earlier ones for the same path.
version = 1
SPDX-PackageName = "Zmaj"
SPDX-PackageSupplier = "Ajdin Hasic <zmaj.lernapp@gmail.com>"
SPDX-PackageDownloadLocation = "https://github.com/zmaj-lernapp/zmaj"

# --- default: code ---------------------------------------------------------
[[annotations]]
path = "**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Ajdin Hasic <zmaj.lernapp@gmail.com>"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# --- learning content, data, media and documentation -----------------------
[[annotations]]
path = [
  "vokabeln.py",
  "grammatik.py",
  "geschichten.py",
  "uebersetzungen.py",
  "woerter_*.json",
  "bedeutung_ausnahmen.json",
  "sonderzeichen_korrekturen.json",
  "ton_ausnahmen.json",
  "data/**",
  "web/audio/**",
  "web/maskottchen/**",
  "web/flagge.png",
  "web/icon-256.png",
  "web/icon.ico",
  "docs/assets/**",
  "paket/**",
  "store/**/*.png",
  "store/**/*.svg",
  "testdaten/**",
  "Zmaj Berichte/**",
  "**/*.md",
  "**/LIESMICH.txt",
  "web/LIZENZEN.txt",
]
precedence = "override"
SPDX-FileCopyrightText = "2026 Ajdin Hasic <zmaj.lernapp@gmail.com>"
SPDX-License-Identifier = "CC-BY-SA-4.0"

# --- third party ------------------------------------------------------------
[[annotations]]
path = "web/fonts/nunito-*.woff2"
precedence = "override"
SPDX-FileCopyrightText = "2014 The Nunito Project Authors (Vernon Adams, Cyreal, Jacques Le Bailly)"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = "web/fonts/spectral-*.woff2"
precedence = "override"
SPDX-FileCopyrightText = "2017 Production Type"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = "web/lottie.min.js"
precedence = "override"
SPDX-FileCopyrightText = "2015 Bodymovin"
SPDX-License-Identifier = "MIT"

# axe-core 4.13.0, only for the browser accessibility test in tests_e2e/.
# Never shipped in web/. The bundle contains MIT-licensed helpers listed in
# axe-core-LICENSE-3RD-PARTY.txt.
[[annotations]]
path = "tests_e2e/vendor/**"
precedence = "override"
SPDX-FileCopyrightText = "2015 - 2026 Deque Systems, Inc."
SPDX-License-Identifier = "MPL-2.0 AND MIT"

# --- metadata files that describe licensing themselves ---------------------
[[annotations]]
path = ["REUSE.toml", "LICENSE-CONTENT", "CITATION.cff", ".gitignore", ".gitattributes", ".editorconfig", ".github/**", ".claude/**", "AGENTS.md", "pyproject.toml", "requirements-dev.txt", "requirements-dev.in", "requirements-hf.txt", "requirements-hf.in"]
precedence = "override"
SPDX-FileCopyrightText = "2026 Ajdin Hasic <zmaj.lernapp@gmail.com>"
SPDX-License-Identifier = "CC0-1.0"
